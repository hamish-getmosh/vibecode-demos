<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment platform · clickable prototype</title>
<style>
:root{
  --ink:#16211d; --ink2:#54635d; --ink3:#8b9691;
  --line:#e3e8e6; --line2:#d2dad7;
  --bg:#f7f9f8; --panel:#fff;
  --accent:#0f6b52; --accent-d:#0b543f; --accent-s:#e4f0ec;
  --hot:#b8501c; --hot-s:#fdf1e8;
  --amber:#8a6a12; --amber-s:#fbf3dc;
  --blue:#2f62c4; --blue-s:#eef3fc;
  --purple:#6b3fa0; --purple-d:#542f82; --purple-s:#f3ecf9;
  --nav:#12211c;
  --r:10px;
  --sh:0 1px 2px rgba(18,33,28,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* ---------- shell ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
.nav{width:198px;background:var(--nav);color:#a9c2b8;padding:16px 12px;flex-shrink:0;display:flex;flex-direction:column}
.nav .logo{color:#fff;font-weight:650;font-size:14px;margin-bottom:20px;padding:0 8px;display:flex;align-items:center;gap:8px}
.nav .logo i{width:20px;height:20px;border-radius:6px;background:var(--accent);display:block}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:7px;
  color:#9ab5aa;text-decoration:none;margin-bottom:2px;font-size:13px;cursor:pointer}
.nav a:hover{background:#1a2f28;color:#d3e3dc}
.nav a.on{background:#1e3830;color:#fff;font-weight:550}
.nav .grp{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#5d786e;margin:16px 0 6px;padding:0 9px;font-weight:700}
.nav .count{font-size:11px;color:#6f8b80}
.nav .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 9px;border-top:1px solid #1e332c;font-size:12px}
.nav .av{width:24px;height:24px;border-radius:99px;background:#2c4a3f;color:#cfe0d9;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:700}

.stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:13px 22px;
  display:flex;justify-content:space-between;align-items:center;gap:16px;flex-shrink:0}
.top .lhs{min-width:0}
.top h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.top .meta{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.top .rhs{display:flex;gap:8px;align-items:center;flex-shrink:0}
.content{flex:1;overflow-y:auto;padding:22px;position:relative}
.content-inner{max-width:1180px;margin:0 auto}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;font-size:13px;
  font-weight:550;border:1px solid transparent;background:transparent;color:var(--ink2);transition:.12s;white-space:nowrap}
.btn:hover{background:#eef1f0}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.pri:disabled{background:#c8d4cf;color:#f2f6f4;cursor:not-allowed}
.btn.sec{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn.sec:hover{background:#f4f7f6;border-color:#b9c4c0}
.btn.sec:disabled{color:var(--ink3);cursor:not-allowed;background:#f6f8f7}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.xs{padding:3px 7px;font-size:11px;border-radius:5px}
.btn.danger{color:var(--hot)} .btn.danger:hover{background:var(--hot-s)}
.btn.pub{background:var(--purple);color:#fff;font-size:15px;font-weight:650;padding:14px 28px;
  border-radius:10px;box-shadow:0 4px 14px rgba(107,63,160,.28)}
.btn.pub:hover{background:var(--purple-d)}
.btn.pub:disabled{background:#d4c6e4;color:#f7f2fb;cursor:not-allowed;box-shadow:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:99px;
  background:#edf1ef;color:var(--ink2);font-weight:550;white-space:nowrap;border:1px solid transparent;
  font-family:inherit;line-height:1.5}
.chip.g{background:var(--accent-s);color:var(--accent)}
.chip.h{background:var(--hot-s);color:var(--hot)}
.chip.a{background:var(--amber-s);color:var(--amber)}
.chip.b{background:var(--blue-s);color:var(--blue)}
.chip.p{background:var(--purple-s);color:var(--purple)}
.chip.out{background:transparent;border:1px dashed var(--line2);color:var(--ink3)}
.chip.pick{cursor:pointer;transition:.12s;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.chip.pick:hover{border-color:var(--ink3);background:#f4f7f6}
.chip.pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.rm{cursor:pointer}
.chip .x{opacity:.5;font-weight:700}
.chip .x:hover{opacity:1}

.dot{width:6px;height:6px;border-radius:99px;background:var(--hot);display:inline-block;flex-shrink:0}
.info{width:14px;height:14px;border-radius:99px;background:#e7ecea;color:var(--ink3);font-size:9px;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;cursor:help;position:relative}
.info.down:hover::after{bottom:auto;top:130%}
.info:hover::after{content:attr(data-t);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:var(--nav);color:#e4ede9;padding:7px 10px;border-radius:7px;font-size:11.5px;font-weight:400;
  width:210px;line-height:1.45;z-index:200;letter-spacing:0;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.16)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.h5{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:0}
.k{font-size:12px;color:var(--ink3)}
.v{font-size:13.5px;font-weight:550}

.flab{font-size:11.5px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.fld{width:100%;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:8px 11px;
  font-size:13.5px;color:var(--ink);outline:none;transition:.12s}
.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,82,.09)}
.fld::placeholder{color:#a8b2ae}
.fld.lock{background:#f2f5f4;color:var(--ink2);border-style:dashed}
.fld.inline{border:1px solid transparent;background:transparent;padding:2px 6px;font-weight:650;font-size:13px;
  border-radius:6px;width:auto;min-width:40px;max-width:140px}
.fld.inline:hover{border-color:var(--line2);background:#fff}
.fld.inline:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(15,107,82,.09)}
.row{display:flex;gap:11px} .row>*{flex:1}
.sep{height:1px;background:var(--line);margin:12px 0}
.sel{background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:13px;
  color:var(--ink);outline:none}
.sel:focus{border-color:var(--accent)}
.sel.sm{padding:3px 7px;font-size:11.5px;border-radius:6px}

/* ---------- global analysis bar ---------- */
.anabar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;
  margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--sh)}
.anabar .al{font-size:11.5px;color:var(--ink3);font-weight:600}
.anabar .ag{display:flex;align-items:center;gap:7px}

/* ---------- document layout ---------- */
.doc-wrap{display:flex;gap:22px;align-items:flex-start}
.rail{width:206px;flex-shrink:0;position:sticky;top:0}
.rail a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;
  font-size:13px;color:var(--ink2);text-decoration:none;margin-bottom:2px;cursor:pointer}
.rail a:hover{background:#ecf0ee}
.rail a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh);border:1px solid var(--line)}
.rail a.locked{color:#b6bfbb;cursor:not-allowed}
.rail a.locked:hover{background:transparent}
.rail a .num{width:19px;height:19px;border-radius:99px;background:#e7ecea;color:var(--ink3);font-size:10px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.rail a.on .num{background:var(--accent);color:#fff}
.rail a.done .num{background:var(--accent-s);color:var(--accent)}
.rail a.locked .num{background:#f0f3f2;color:#c3ccc8}
.rail a .lbl{flex:1}
.rail a .warn{color:var(--amber);font-weight:700;font-size:12px}
.railnote{margin-top:12px;padding:0 3px;font-size:11.5px;color:var(--ink3);line-height:1.5}
.prog{height:4px;background:#e7ecea;border-radius:99px;margin:0 3px 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}

.doc{flex:1;min-width:0}
.stg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;
  margin-bottom:13px;box-shadow:var(--sh);scroll-margin-top:12px}
.stg.act{border-color:#b3c8c0;box-shadow:0 0 0 3px rgba(15,107,82,.055)}
.stg.locked{background:#fbfcfc;border-style:dashed;box-shadow:none;padding:14px 19px}
.stg.locked .nm{color:var(--ink3);font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.stg.locked .sec-h{margin-bottom:0}
.sec-h .nm{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.sec-h .nm .sn{width:20px;height:20px;border-radius:99px;background:var(--accent-s);color:var(--accent);
  font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.stg.locked .sec-h .nm .sn{background:#f0f3f2;color:#c3ccc8}
.sec-h .rt{display:flex;gap:7px;align-items:center}
.sec-f{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--line)}

/* ---------- variant cards ---------- */
.vcard{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:9px;background:#fff}
.vcard.ctrl{background:#fbfcfc}
.vcard.diff{border-color:#e5bb9c;background:#fffaf6}
.vcard.aa{border-color:#e2cf93;background:#fdfaf1}
.vcard-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.slots{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.slot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;
  padding:6px 10px;font-size:12.5px;background:#fff;cursor:pointer;transition:.12s;
  font-family:inherit;color:var(--ink);text-align:left}
.slot:hover{border-color:var(--ink3);background:#f7f9f8}
.slot.new{border-color:#dda87f;background:var(--hot-s);color:var(--hot)}
.slot.add{border-style:dashed;color:var(--ink3)}
.slot .pm{font-size:11px;color:var(--ink3)}

/* ---------- compare grid ---------- */
.grid{display:grid;column-gap:8px;overflow-x:auto;align-items:start}
.gh,.colh{height:34px;display:flex;align-items:center;gap:7px;justify-content:space-between}
.gh{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.gl{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;height:46px;margin-bottom:8px}
.cel{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;height:46px;margin-bottom:8px;
  display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.3;overflow:hidden}
.cel .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.cel.same{background:#f5f8f7;border-style:dashed;color:#7b8985}
.cel.none{color:var(--ink3)}
.cel.diff{border-color:#dda87f;background:#fff8f3}
.grid-actions{height:34px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- funnel / traffic ---------- */
.fun{display:flex;gap:2px;height:36px;border-radius:8px;overflow:hidden}
.fun i{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-style:normal;
  color:#fff;font-weight:600;transition:flex .25s ease;min-width:0;overflow:hidden;white-space:nowrap}
.fun .o{background:#e3e8e6;color:var(--ink3)}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;cursor:grab;margin:0}
input[type=range]:active{cursor:grabbing}
.splits{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.splitrow{display:flex;align-items:center;gap:12px}
.splitrow .sl{width:72px;font-weight:600;font-size:13px}
.splitrow .sr{width:56px;text-align:right;font-weight:650}
.mdebox{border:1px solid var(--line);border-radius:9px;padding:14px 15px;margin-top:14px;background:#fbfcfc}
.mdeout{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}
.mdeout .mo{flex:1;min-width:140px}
.mdeout .mv{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.mdeout .ml{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- launch checklist ---------- */
.ckl{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:13px}
.ck{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
.ck:last-child{border-bottom:0}
.ck.no{background:#fffdf7}
.cki{width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0}
.ck.ok .cki{background:var(--accent-s);color:var(--accent)}
.ck.no .cki,.ck.warn .cki{background:var(--amber-s);color:var(--amber)}
.ckb{flex:1;min-width:0}
.ckt{font-size:13px;font-weight:550}
.ckd{font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.45}
.pubbox{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:#fff;
  display:flex;flex-direction:column;gap:16px}
.pubbox .envs{display:flex;gap:10px;flex-wrap:wrap}
.envchip{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--line2);
  border-radius:9px;cursor:pointer;background:#fff;font-weight:550;font-size:13.5px;transition:.12s}
.envchip:hover{border-color:var(--ink3)}
.envchip.on{border-color:var(--purple);background:var(--purple-s);color:var(--purple)}
.envchip .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700}
.envchip.on .box{background:var(--purple);border-color:var(--purple);color:#fff}

/* ---------- popover ---------- */
.pop-bg{position:fixed;inset:0;background:rgba(18,33,28,.28);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.pop{background:#fff;border-radius:14px;width:min(520px,100%);max-height:84vh;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(18,33,28,.28);overflow:hidden}
.pop-h{padding:15px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.pop-h .t{font-size:15px;font-weight:650}
.pop-b{padding:14px 18px;overflow-y:auto;flex:1;min-height:0}
.pop-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;background:#fafbfb;flex-shrink:0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s;background:#fff}
.opt:hover{border-color:var(--ink3);background:#f7f9f8}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt .on{font-size:13.5px;font-weight:600}
.opt .od{font-size:11.5px;color:var(--ink3);margin-top:2px}
.opt.create{border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--accent-s)}
.opt.create .on{color:var(--accent)}
.scrollist{max-height:404px;overflow-y:auto;padding-right:5px;margin-right:-5px}
.scrollist .opt{margin-bottom:8px}
.scrollist .opt:last-child{margin-bottom:0}

/* ---------- GTM slide over: stays inside the white stage, not over the nav ---------- */
.gtm{position:absolute;inset:0;z-index:50;background:rgba(18,33,28,.22);display:flex;justify-content:flex-end}
.gtm-panel{background:var(--bg);height:100%;display:flex;flex-direction:column;width:min(920px,92%);
  box-shadow:-12px 0 40px rgba(18,33,28,.2);animation:gin .2s cubic-bezier(.2,.85,.25,1)}
@keyframes gin{from{transform:translateX(36px);opacity:.6}to{transform:none;opacity:1}}
.gtm-top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;
  justify-content:space-between;align-items:center;gap:16px;flex-shrink:0}
.gtm-body{flex:1;overflow-y:auto;padding:20px}
.gtm-inner{max-width:100%;margin:0 auto;display:flex;gap:18px;align-items:flex-start}
.crumb{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.crumb b{color:var(--ink2);font-weight:600}

.phone{width:230px;flex-shrink:0;background:#fff;border:1px solid var(--line2);border-radius:22px;
  padding:16px 14px 18px;box-shadow:0 6px 22px rgba(18,33,28,.08);position:sticky;top:0}
.phone .nub{width:52px;height:4px;background:#e0e5e3;border-radius:9px;margin:0 auto 14px}
.pl{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;transition:.15s}
.pl.on{border-color:var(--accent);background:var(--accent-s);box-shadow:0 0 0 2px rgba(15,107,82,.08)}
.pl .pt{font-size:12.5px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pl .pp{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.pl .pp span{font-size:11.5px;font-weight:500;color:var(--ink3)}
.pl .pm{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.4}

/* ---------- plan editor ---------- */
.plan{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:9px;background:#fff}
.plan-h{display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.doses{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.dose .dl{font-size:11px;color:var(--ink3);margin-bottom:4px}
.dose input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;
  font-size:13px;outline:none;text-align:right}
.dose input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,82,.09)}
.pfx{position:relative}
.pfx span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
.pfx input{padding-left:22px;text-align:left}
.seg{display:inline-flex;background:#eef1f0;border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink3);font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:6px;transition:.12s}
.seg button:hover{color:var(--ink2)}
.seg button.on{background:#fff;color:var(--accent);
  box-shadow:0 1px 2px rgba(18,33,28,.12),0 0 0 1px rgba(18,33,28,.07)}

/* ---------- library master-detail ---------- */
.lib-split{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;min-height:520px}
.lib-list{width:340px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.lib-list-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.lib-rows{flex:1;overflow-y:auto}
.lib-row{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
.lib-row:hover{background:#f7f9f8}
.lib-row.on{background:var(--accent-s);border-left:3px solid var(--accent);padding-left:11px}
.lib-row .rn{font-weight:600;font-size:13.5px}
.lib-row .rm{font-size:11.5px;color:var(--ink3);margin-top:2px}
.lib-detail{flex:1;min-width:0;overflow-y:auto;padding:18px 20px;background:#fbfcfc}
.lib-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink3);
  font-size:13px;text-align:center;padding:40px;line-height:1.6}

<body>

<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* =====================================================================
   REFERENCE DATA
   ===================================================================== */
let CARE = {
  dietitian:{id:'dietitian', name:'Dietitian consult', kind:'Consult', mode:'included', price:0,
    note:'30 minutes, monthly'},
  longevity:{id:'longevity', name:'Longevity consult', kind:'Consult', mode:'addon', price:79,
    note:'One off, practitioner led'},
  shake:{id:'shake', name:'Protein shake', kind:'Product', mode:'addon', price:39,
    note:'Shipped monthly with treatment'},
  bloods:{id:'bloods', name:'Blood panel', kind:'Test', mode:'included', price:0,
    note:'Baseline and month three'}
};

const DOSES = {
  'Semaglutide':['0.25 mg','0.5 mg','1.0 mg','1.7 mg','2.4 mg'],
  'Tirzepatide':['2.5 mg','5 mg','7.5 mg','10 mg'],
  'Contrave':['Standard']
};
const PLAN_TYPES = ['Monthly','3-month','6-month','12-month'];
const flat = (type, price) => ({type, mode:'flat', price, tiers:{}});

let library = {
  pkg_basic:{id:'pkg_basic', name:'AU Semaglutide Basic', region:'AU', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('3-month',349), flat('Monthly',399)], care:[], uses:6},
  pkg_maint:{id:'pkg_maint', name:'AU Semaglutide Maintenance', region:'AU', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('3-month',289), flat('Monthly',329)], care:['dietitian'], uses:2},
  pkg_contrave:{id:'pkg_contrave', name:'AU Contrave Standard', region:'AU', vertical:'Weight loss',
    medication:'Contrave', plans:[flat('3-month',219), flat('Monthly',249)], care:[], uses:3},
  pkg_nz:{id:'pkg_nz', name:'NZ Semaglutide Standard', region:'NZ', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('3-month',379), flat('Monthly',419)], care:['bloods'], uses:2},
  pkg_my:{id:'pkg_my', name:'MY Semaglutide Starter', region:'MY', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('Monthly',289)], care:[], uses:1}
};

const AUD_GROUPS = [
  {id:'country', label:'Country', opts:['AU','NZ','MY']},
  {id:'brand',   label:'Brand',   opts:['MOSHY','MOSH']},
  {id:'vertical',label:'Vertical',opts:['Weight loss','Sex','Hair','Skin']},
  {id:'customer',label:'Customer',opts:['New','Returning','Any']}
];

const EXTRA_PROPS = [
  'Device is iOS','Device is Android','Device is desktop','Browser is Safari','Browser is Chrome',
  'Session count is 1','Session count > 1','Session count > 5',
  'Referrer is paid search','Referrer is paid social','Referrer is organic','Referrer is email','Referrer is direct',
  'Has abandoned cart','Has started quiz','Has completed quiz','Quiz outcome is eligible','Quiz outcome is ineligible',
  'Age band 18-24','Age band 25-34','Age band 35-44','Age band 45-54','Age band 55 plus',
  'State is VIC','State is NSW','State is QLD','State is WA','State is SA',
  'Landed on pricing page','Landed on homepage','Landed on product page','Viewed practitioner page',
  'BMI band 25 to 30','BMI band 30 to 35','BMI band 35 plus',
  'Has active subscription','Previously cancelled','Previously paused',
  'Lifetime orders > 3','Lifetime value > $1000','Opted into marketing','Has referral code'
];

/* =====================================================================
   STAGES
   ===================================================================== */
const STAGES = [
  {id:'setup',    label:'Setup'},
  {id:'audience', label:'Audience'},
  {id:'variants', label:'Variants'},
  {id:'traffic',  label:'Traffic'},
  {id:'launch',   label:'Review'}
];
const stageIdx = id => STAGES.findIndex(s => s.id === id);

let S = {
  view:'dashboard',
  dashTab:'running',
  libTab:'packages',
  libSel:null,
  libDraft:null,                // selected package or care product id in master-detail
  focus:null,                 // package draft, only when creating from experiment
  activeSection:'setup',
  maxStage:0,
  compare:true,
  ruleQuery:'',
  saving:false,
  modal:null,
  exp:null,
  published:false,
  // global analysis settings: drive every result card
  conf:95,                    // significance / confidence level
  power:80
};

function newExperiment(){
  return {
    key:'005', name:'', hypothesis:'',
    variants:[],
    audience:{country:'AU', brand:'MOSHY', vertical:'Weight loss', customer:'New', extra:[]},
    traffic:25,
    evenSplit:true,
    splits:{},                // variantId -> share of enrolled traffic
    mde:5,                    // desired minimum detectable effect, %
    lengthDays:21,
    envs:['staging'],         // can be staging, production, or both
    aaAcknowledged:false
  };
}

/* =====================================================================
   DERIVATIONS
   ===================================================================== */
function pkg(id){ return library[id]; }
function doses(med){ return DOSES[med] || DOSES['Semaglutide']; }

function planPrices(p){
  if(p.mode === 'tiered'){
    return Object.values(p.tiers||{}).filter(x => x !== '' && x != null).map(Number);
  }
  return (p.price === '' || p.price == null) ? [] : [Number(p.price)];
}
function pkgPrices(P){ return P ? P.plans.flatMap(planPrices) : []; }
function money(n){ return '$' + Number(n).toLocaleString(); }
function planLabel(p){
  const ps = planPrices(p);
  if(!ps.length) return p.type + ' unpriced';
  const lo = Math.min(...ps), hi = Math.max(...ps);
  return p.type + ' ' + (lo === hi ? money(lo) : money(lo)+' to '+money(hi));
}

function priceRange(v){
  const ps = v.packages.filter(Boolean).flatMap(id => pkgPrices(pkg(id)));
  if(!ps.length) return null;
  const lo = Math.min(...ps), hi = Math.max(...ps);
  return lo === hi ? money(lo) : money(lo) + ' to ' + money(hi);
}
function planTypes(v){
  const t = [...new Set(v.packages.filter(Boolean).flatMap(id => pkg(id) ? pkg(id).plans.map(p=>p.type) : []))];
  return t.length ? t.join(', ') : null;
}
function careList(v){
  const c = [...new Set(v.packages.filter(Boolean).flatMap(id => pkg(id) ? pkg(id).care : []))];
  return c.length ? c.map(id => CARE[id] ? CARE[id].name : id).join(', ') : null;
}
function pricingShape(v){
  const ps = v.packages.filter(Boolean).map(pkg).filter(Boolean);
  if(!ps.length) return null;
  return ps.some(P => P.plans.some(p => p.mode === 'tiered')) ? 'Per dose' : 'One price per plan';
}
const ATTRS = [
  {id:'pkg1',  label:'Package 1',     get:v=> v.packages[0] ? pkg(v.packages[0]).name : null},
  {id:'pkg2',  label:'Package 2',     get:v=> v.packages[1] ? pkg(v.packages[1]).name : null},
  {id:'plans', label:'Plans',         get:v=> planTypes(v)},
  {id:'price', label:'Price range',   get:v=> priceRange(v)},
  {id:'shape', label:'Pricing model', get:v=> pricingShape(v)},
  {id:'care',  label:'Care products', get:v=> careList(v)}
];

function diffRows(){
  const vs = S.exp.variants;
  if(vs.length < 2) return [];
  const ctrl = vs[0];
  return ATTRS.map(a => {
    const base = a.get(ctrl);
    const vals = vs.map(v => a.get(v));
    return {attr:a, base, vals, differs: vals.some(x => x !== base)};
  });
}
function overrideCount(v){
  const ctrl = S.exp.variants[0];
  if(!ctrl || v === ctrl) return 0;
  return ATTRS.filter(a => a.get(v) !== a.get(ctrl)).length;
}
function diffCount(){ return diffRows().filter(r=>r.differs).length; }
function aaVariants(){ return S.exp.variants.slice(1).filter(v => overrideCount(v) === 0); }

const ELIGIBLE = 16700;

/* keep splits in sync with the variant list */
function ensureSplits(){
  const e = S.exp, vs = e.variants;
  if(!vs.length){ e.splits = {}; return; }
  if(e.evenSplit){
    const each = Math.round((100 / vs.length) * 10) / 10;
    const out = {};
    vs.forEach((v,i)=>{
      out[v.id] = i === vs.length-1
        ? Math.round((100 - each*(vs.length-1))*10)/10
        : each;
    });
    e.splits = out;
  } else {
    vs.forEach(v=>{ if(e.splits[v.id] == null) e.splits[v.id] = 0; });
    Object.keys(e.splits).forEach(id=>{ if(!vs.find(v=>v.id===id)) delete e.splits[id]; });
  }
}
function splitOf(id){ return S.exp.splits[id] ?? 0; }
function splitSum(){ return Object.values(S.exp.splits).reduce((a,b)=>a+Number(b||0),0); }

function perVariantWeekly(id){
  const share = id ? splitOf(id) : (100 / Math.max(S.exp.variants.length,1));
  return Math.round(ELIGIBLE * (S.exp.traffic/100) * (share/100));
}
/* days to detect the desired MDE at current traffic, for the smallest arm */
function daysToDetectNum(mde){
  const m = mde == null ? S.exp.mde : mde;
  const n = Math.min(...(S.exp.variants.length
    ? S.exp.variants.map(v => perVariantWeekly(v.id))
    : [perVariantWeekly()]));
  if(!n || !m) return Infinity;
  // rough sample-size model: needed ~ (z_alpha + z_power)^2 * p*(1-p) * 2 / (mde)^2
  // simplified to a constant scaled by mde and power/conf
  const zA = S.conf === 95 ? 1.96 : (S.conf === 90 ? 1.645 : 1.28);
  const zP = S.power === 90 ? 1.28 : (S.power === 80 ? 0.84 : 0.52);
  const needed = Math.round(Math.pow(zA+zP,2) * 0.25 * 2 / Math.pow(m/100,2));
  return Math.max(1, Math.ceil(needed / n * 7));
}
function daysToDetect(mde){
  const d = daysToDetectNum(mde);
  return d === Infinity ? 'not enough traffic' : d + ' days';
}

/* --- stage gating --- */
function stageBlockers(id){
  const e = S.exp;
  if(id === 'setup')    return e.name.trim() ? [] : ['Give the experiment a name'];
  if(id === 'audience') return [];
  if(id === 'variants'){
    const out = [];
    if(e.variants.length < 2) out.push('Add at least two variants');
    else if(e.variants.some(v => !v.packages.filter(Boolean).length)) out.push('Every variant needs a package');
    return out;
  }
  if(id === 'traffic'){
    const out = [];
    if(e.traffic <= 0) out.push('Allocate some traffic');
    else if(Math.abs(splitSum() - 100) > 0.5) out.push('Variant shares must add to 100%');
    return out;
  }
  return [];
}
function stageDone(id){
  if(id === 'launch') return S.published;
  return stageBlockers(id).length === 0 && stageIdx(id) < S.maxStage;
}
const reached = id => stageIdx(id) <= S.maxStage;
/* Next is a one-time unlock control: hide once the following stage is open */
const showNext = id => stageIdx(id) === S.maxStage && stageIdx(id) < STAGES.length - 1;

function checklist(){
  const e = S.exp, out = [];
  const aud = [e.audience.country, e.audience.brand, e.audience.vertical,
    e.audience.customer + ' customer', ...e.audience.extra].join(' · ');

  out.push({ok: !!e.name.trim(), block:true, jump:'setup',
    t:'Named and keyed',
    d: e.name.trim() ? `${e.name.trim()} · exp_${e.key}` : 'The name is still empty'});

  out.push({ok:true, block:false, jump:'audience',
    t:'Audience defined',
    d: `${aud} · ${ELIGIBLE.toLocaleString()} match per week`});

  out.push({ok: e.variants.length >= 2, block:true, jump:'variants',
    t:'At least two variants',
    d: e.variants.length >= 2
      ? `${e.variants.map(v=>v.name||v.id).join(', ')} · ${e.variants.length} arms`
      : 'A test needs a control and at least one variant'});

  const hasPkg = e.variants.length > 0 && e.variants.every(v => v.packages.filter(Boolean).length > 0);
  out.push({ok: hasPkg, block:true, jump:'variants',
    t:'Every variant has a package',
    d: hasPkg
      ? e.variants.map(v => `${v.name||v.id} has ${v.packages.filter(Boolean).length}`).join(', ')
      : 'A variant has no package attached'});

  const aa = aaVariants(), dc = diffCount();
  if(aa.length && !e.aaAcknowledged){
    out.push({ok:false, warn:true, block:false, jump:'variants',
      t:'Variants are identical',
      d:`${aa.map(v=>v.name||v.id).join(', ')} matches ${e.variants[0].name||e.variants[0].id}. Valid as an A/A, confirm if intended.`});
  } else {
    out.push({ok:true, block:false, jump:'variants',
      t: aa.length ? 'A/A confirmed intentional' : 'Variants differ',
      d: aa.length
        ? 'Measuring noise rather than a change'
        : `${dc} of ${ATTRS.length} attributes diverge from the control`});
  }

  const splitOk = e.traffic > 0 && Math.abs(splitSum() - 100) <= 0.5;
  out.push({ok: splitOk, block:true, jump:'traffic',
    t:'Traffic allocated',
    d: e.traffic > 0
      ? `${e.traffic}% enrolled · ${e.evenSplit ? 'even split' : 'custom split'} · ${e.variants.map(v=>`${v.name||v.id} ${splitOf(v.id)}%`).join(', ')||'no arms'}`
      : 'Nobody is enrolled'});

  const d = daysToDetectNum(), fits = d <= e.lengthDays;
  out.push({ok: fits, warn: !fits, block:false, jump:'traffic',
    t:`${e.mde}% lift detectable within the run`,
    d: d === Infinity
      ? 'Not enough traffic to detect anything'
      : `About ${d} days at current traffic, against a ${e.lengthDays} day run`});

  out.push({ok: e.envs.length > 0, block:true, jump:'launch',
    t:'Publish destination chosen',
    d: e.envs.length ? e.envs.join(' and ') : 'Pick staging, production, or both'});

  return out;
}
function canPublish(){ return checklist().filter(c=>c.block).every(c=>c.ok); }

/* =====================================================================
   ACTIONS
   ===================================================================== */
function paintSaving(){
  document.querySelectorAll('.saving').forEach(el=>{
    el.className = 'saving' + (S.saving ? ' busy' : '');
    el.innerHTML = '<i></i>' + (S.saving ? 'Saving' : 'Saved');
  });
}
function save(){
  S.saving = true; paintSaving();
  clearTimeout(save._t);
  save._t = setTimeout(()=>{ S.saving = false; paintSaving(); }, 550);
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
const nextLetter = () => String.fromCharCode(65 + S.exp.variants.length);

function goStage(id){
  if(!reached(id)){ toast('Finish the earlier stages first.'); return; }
  S.activeSection = id; render();
  const t = document.getElementById('sec-'+id);
  if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
}
function goNext(from){
  const i = stageIdx(from), b = stageBlockers(from);
  if(b.length){ toast(b[0] + '.'); return; }
  const nx = STAGES[i+1];
  if(!nx) return;
  S.maxStage = Math.max(S.maxStage, i+1);
  S.activeSection = nx.id;
  render();
  const t = document.getElementById('sec-'+nx.id);
  if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
}

function addVariant(){
  const id = nextLetter();
  S.exp.variants.push({id, name:id, role:S.exp.variants.length?'test':'control', packages:[], inherits:null});
  ensureSplits();
  S.activeSection='variants'; save(); render();
  toast('Variant added. Traffic rebalanced.');
}
function cloneVariant(src){
  const id = nextLetter();
  S.exp.variants.push({id, name:id, role:'test', packages:[...src.packages], inherits:src.id});
  S.exp.aaAcknowledged = false;
  ensureSplits();
  S.activeSection='variants'; save(); render();
  toast(`Variant ${id} inherits ${src.name||src.id}. Traffic rebalanced.`);
}
function removeVariant(v){
  S.exp.variants = S.exp.variants.filter(x=>x!==v);
  S.exp.variants.forEach((x,i)=>{
    x.id = String.fromCharCode(65+i);
    if(!x.name || /^[A-Z]$/.test(x.name)) x.name = x.id;
    x.role = i?'test':'control';
  });
  ensureSplits();
  save(); render(); toast('Variant removed.');
}

function openPackagePicker(variant, slotIndex){ S.modal = {type:'pkg', variant, slotIndex}; render(); }
function attachPackage(variant, slotIndex, id){
  if(slotIndex >= variant.packages.length) variant.packages.push(id);
  else variant.packages[slotIndex] = id;
  library[id].uses = (library[id].uses||0)+1;
  S.exp.aaAcknowledged = false;
  S.modal = null; save(); render();
  toast(`${library[id].name} attached to ${variant.name||variant.id}.`);
}
function openRulePicker(){ S.modal = {type:'rule'}; S.ruleQuery=''; render(); }

/* =====================================================================
   PACKAGE BUILDER  (GTM slide-over, only when creating from an experiment)
   ===================================================================== */
function blankPlan(type){ return {type, mode:'flat', price:'', tiers:{}}; }

function openPackageBuilder(returnTo, existing){
  S.modal = null;
  if(existing){
    S.focus = {
      returnTo, editId:existing.id,
      name:existing.name, region:existing.region, vertical:existing.vertical, medication:existing.medication,

      vertical: inExp ? S.exp.audience.vertical : 'Weight loss',

function pkgIssues(f){
  f = f || S.focus;
  const out = [];
  if(!f.name.trim()) out.push('Name the package');
  if(!f.plans.filter(p => planPrices(p).length).length) out.push('Price at least one plan');
  const names = Object.values(library).filter(P => P.id !== f.editId).map(P => P.name.toLowerCase());
  if(f.name.trim() && names.includes(f.name.trim().toLowerCase())) out.push('A package already has this name');
  return out;
}

function persistPackage(f){
  const id = f.editId || ('pkg_' + Date.now());
  const wasEdit = !!f.editId;
  const prev = library[id];
  library[id] = {
    id, name:f.name.trim(), region:f.region, vertical:f.vertical, medication:f.medication,
    plans:f.plans.filter(p => planPrices(p).length).map(p=>({
      type:p.type, mode:p.mode,
      price: p.mode === 'flat' ? Number(p.price) : null,
      tiers: p.mode === 'tiered' ? Object.assign({}, p.tiers) : {}
    })),
    care:[...f.care],
    uses: prev ? prev.uses : 0,
    isNew: wasEdit ? prev.isNew : true
  };
  return {id, wasEdit};
}

function savePackage(){
  const f = S.focus, issues = pkgIssues();
  if(issues.length){ toast(issues[0] + '.'); return; }
  const {id, wasEdit} = persistPackage(f);
  const ret = f.returnTo;
  S.focus = null;

  if(ret && ret.variantId){
    const v = S.exp.variants.find(x => x.id === ret.variantId);
    const slot = ret.slotIndex;
    if(slot >= v.packages.length) v.packages.push(id); else v.packages[slot] = id;
    library[id].uses = Math.max(library[id].uses, 1);
    S.exp.aaAcknowledged = false;
    S.activeSection = 'variants';
    save(); render();
    toast(`Saved and attached to ${v.name||v.id}.`);
    return;
  }
  S.view = 'library'; S.libTab = 'packages'; S.libSel = id; render();
  toast(wasEdit ? `${library[id].name} updated.` : `${library[id].name} added.`);
}

function addPlan(){
  const used = S.focus.plans.map(p=>p.type);
  S.focus.plans.push(blankPlan(PLAN_TYPES.find(t => !used.includes(t)) || 'Monthly')); render();
}
function removePlan(i){ S.focus.plans.splice(i,1); render(); }
function setPlanMode(i, mode){
  const p = S.focus.plans[i];
  if(p.mode === mode) return;
  if(mode === 'tiered' && p.price !== ''){
    doses(S.focus.medication).forEach(d => p.tiers[d] = p.price);
  }
  if(mode === 'flat'){
    const ps = planPrices(p);
    if(ps.length && p.price === '') p.price = Math.min(...ps);
  }
  p.mode = mode; render();
}

   Each card stores a "true" absolute effect and a half-width at 95% CI.
   Other CI levels rescale the half-width. The observed mark is always
   the midpoint of the capsule, so the capsule always shrinks symmetrically.
   ===================================================================== */
const STATES = {
  win:  {tile:'t-win',   bar:'s-win',   label:'Significant improvement'},
  loss: {tile:'t-loss',  bar:'s-loss',  label:'Control winning'},
  flat: {tile:'t-flat',  bar:'s-flat',  label:'No significant difference'},
  early:{tile:'t-early', bar:'s-early', label:'Too early to read'},
  trend:{tile:'t-flat',  bar:'s-flat',  label:'Approaching significance'}
};

/* half-width multiplier relative to the 95% CI */
const CI_SCALE = {95:1, 90:0.84, 80:0.68};

/* derive CI bounds and status from the global confidence setting.
   Observed abs is always the midpoint of [lo, hi]. */
function cardStats(d){
  const scale = CI_SCALE[S.conf] || 1;
  const half = d.half95 * scale;
  const lo = d.abs - half;
  const hi = d.abs + half;
  const crosses = lo < 0 && hi > 0;
  // p-value roughly tracks whether the CI crosses zero at the chosen level
  const p = crosses
    ? Math.min(0.99, d.p95 * (S.conf === 95 ? 1 : S.conf === 90 ? 1.4 : 2.0))
    : Math.max(0.001, d.p95 * (S.conf === 95 ? 1 : S.conf === 90 ? 0.7 : 0.4));
  let state = d.state;
  if(d.state === 'early') state = 'early';
  else if(crosses) state = (d.state === 'trend' || Math.abs(d.abs) > half * 0.6) ? 'trend' : 'flat';
  else state = d.abs > 0 ? 'win' : 'loss';
  return {lo, hi, p, state, half};
}

function resultCard(d, i, kind){
  const st = cardStats(d);
  const state = STATES[st.state];
  // scale the track so the observed value sits at a readable position,
  // and the capsule is always centered on it
  const span = Math.max(Math.abs(d.abs) + st.half, 4) * 1.35;
  const dmin = -span, dmax = span;
  const pos = v => ((v - dmin) / (dmax - dmin)) * 100;
  const mid = pos(d.abs);
  const bandL = pos(st.lo), bandR = pos(st.hi);
  return `<div class="dc" data-act="open-run" data-k="${kind}" data-i="${i}">
    <div class="dc-h">
      <span class="brand" style="background:${d.bg}">M</span>
      <div style="min-width:0;flex:1">
        <div class="dct">${esc(d.t)}</div>
        <div class="k" style="margin-top:2px">${d.b} · day ${d.day} of ${d.of} · ${d.metric}</div>
      </div>
    </div>

    <div class="tiles">
      <div class="tile ${state.tile}"><div class="tv">${pc(d.rel)}</div><div class="tl">relative change</div></div>
      <div class="tile ${state.tile}"><div class="tv">${pc(d.abs,2)}</div><div class="tl">absolute change</div></div>
    </div>

    <div class="cih">${S.conf}% Confidence Interval
      <span class="info" data-t="The white capsule is the range of plausible values. The gray mark is the observed result, always at its centre. As more data arrives the capsule shrinks in from both sides.">i</span>
    </div>
    <div class="ciwrap">
      <div class="citrack">
        <span class="cipt" style="left:${mid}%">${pc(d.abs,2)}</span>
        <span class="cizl" style="left:${pos(0)}%">0%</span>
        <span class="cizero" style="left:${pos(0)}%"></span>
        <span class="ciband" style="left:${bandL}%;width:${(bandR-bandL).toFixed(2)}%"></span>
        <span class="cimark" style="left:${mid}%"></span>
      </div>
      <div class="ciends"><span>${pc(st.lo,2)}</span><span>${pc(st.hi,2)}</span></div>
    </div>

    <div class="statbar ${state.bar}">${state.label}</div>
    <div class="dcf">
      <span class="k">${d.weekly.toLocaleString()} / week</span>
      <span class="k mono">p = ${st.p.toFixed(3)}</span>
    </div>
  </div>`;
}

function libPlanEditor(p, i, f){
  const ds = doses(f.medication);
  const single = ds.length === 1;
  return `<div class="plan">
    <div class="plan-h">
      <select class="sel" data-ldpt="${i}">
        ${PLAN_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      ${single ? `<span class="chip out">single dose</span>` : `
        <div class="seg">
          <button class="${p.mode==='flat'?'on':''}" data-act="lib-plan-mode" data-i="${i}" data-m="flat">One price</button>
          <button class="${p.mode==='tiered'?'on':''}" data-act="lib-plan-mode" data-i="${i}" data-m="tiered">Per dose</button>
        </div>`}
      <span class="k" style="margin-left:auto">${esc(planLabel(p))}</span>
      ${f.plans.length > 1 ? `<button class="btn danger xs" data-act="lib-rm-plan" data-i="${i}">Remove</button>` : ''}

    ${(p.mode === 'tiered' && !single) ? `
      <div class="doses">${ds.map(d=>`<div class="dose">

      <div style="max-width:170px">
        <div class="flab">Price per month</div>
        <div class="pfx"><span>$</span>
          <input value="${esc(p.price)}" data-ldp="${i}" data-fid="ld-price-${i}" placeholder="429" inputmode="numeric"></div>
      </div>`}
  </div>`;
}

function libCareDetail(){

  const used = f.editId ? Object.values(library).filter(P=>P.care.includes(f.editId)).length : 0;
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <div class="k">${f.editId ? 'Editing care product' : 'New care product'}</div>
        <div style="font-size:16px;font-weight:650;margin-top:2px">${esc(f.name)||'Untitled care product'}</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${used > 1 ? `<span class="chip a">in ${used} packages</span>` : ''}

        <button class="btn pri" data-act="lib-save" ${issues.length?'disabled':''}>Save</button>
      </div>
    </div>
    <div class="card" style="padding:15px 16px;margin-bottom:12px">
      <div class="flab">Name</div>

      <div class="flab" style="margin-top:13px">Type</div>
      <div style="display:flex;gap:6px">
        ${['Consult','Product','Test'].map(k=>`<button class="chip pick ${f.kind===k?'on':''}"
          data-act="lib-kind" data-k="${k}">${k}</button>`).join('')}

    <div class="card" style="padding:15px 16px;margin-bottom:12px">
      <div class="flab">Pricing</div>
      <div style="display:flex;gap:6px;margin-bottom:11px">
        <button class="chip pick ${f.mode==='included'?'on':''}" data-act="lib-mode" data-m="included">Included in package</button>
        <button class="chip pick ${f.mode==='addon'?'on':''}" data-act="lib-mode" data-m="addon">Priced add-on</button>
      </div>
      ${f.mode==='addon' ? `
        <div style="max-width:150px">
          <div class="flab">Add-on price</div>
          <div class="pfx"><span>$</span>

/* ---------- experiment record ---------- */
function viewExperiment(){
  const e = S.exp;
  return `<div class="shell">${nav('exp')}
    <div class="stage">
      <div class="top">
        <div class="lhs">
          <h1>${e.name.trim() ? esc(e.name) : 'Untitled experiment'}
            ${S.published ? `<span class="chip g">Live on ${e.envs.join(' + ')}</span>` : `<span class="chip out">Draft</span>`}</h1>
          <div class="meta">
            <span class="mono">exp_${e.key}</span>
            <span>stage ${stageIdx(S.activeSection)+1} of ${STAGES.length}</span>
            <span class="saving ${S.saving?'busy':''}"><i></i>${S.saving?'Saving':'Saved'}</span>
          </div>
        </div>
        <div class="rhs">
          <button class="btn sec" data-act="go-dash">Save and exit</button>
        </div>
      </div>
      <div class="content"><div class="content-inner">
        <div class="doc-wrap">
          ${railView()}
          <div class="doc">
            ${STAGES.map((s,i)=> reached(s.id) ? sectionFor(s.id) : lockedSection(s, i)).join('')}
          </div>
        </div>
      </div></div>
    </div></div>`;
}

function railView(){
  const pct = Math.round((S.maxStage / (STAGES.length-1)) * 100);
  return `<div class="rail">
    <div class="prog"><i style="width:${pct}%"></i></div>
    ${STAGES.map((s,i)=>{
      const isLocked = !reached(s.id);
      const done = stageDone(s.id);
      const warn = s.id === 'variants' && aaVariants().length && !S.exp.aaAcknowledged;
      return `<a data-act="go-stage" data-s="${s.id}"
        class="${S.activeSection===s.id?'on':''} ${done?'done':''} ${isLocked?'locked':''}">
        <span class="num">${isLocked ? '' : (done ? '✓' : i+1)}</span>
        <span class="lbl">${s.label}</span>
        ${warn ? '<span class="warn">!</span>' : ''}
      </a>`;
    }).join('')}
    <div class="railnote">${S.maxStage < STAGES.length-1
      ? 'Later stages unlock as you complete each one.'
      : 'Every stage is unlocked. Move between them freely.'}</div>
  </div>`;
}

function lockedSection(s, i){
  const prev = STAGES[i-1];
  return `<div class="stg locked" id="sec-${s.id}">
    <div class="sec-h">
      <span class="nm"><span class="sn">${i+1}</span>${s.label}</span>
      <span class="chip out">complete ${prev.label} first</span>
    </div>
  </div>`;
}

function sectionFor(id){
  if(id === 'setup')    return secSetup();
  if(id === 'audience') return secAudience();
  if(id === 'variants') return secVariants();
  if(id === 'traffic')  return secTraffic();
  return secLaunch();
}

function nextLabel(id){
  const nx = STAGES[stageIdx(id)+1];
  if(!nx) return '';
  if(nx.id === 'launch') return 'Review details';
  return `Next: ${nx.label}`;
}

function secFoot(id){
  if(!showNext(id)) return '';
  const b = stageBlockers(id);
  return `<div class="sec-f">
    <button class="btn pri" data-act="next" data-s="${id}" ${b.length?'disabled':''}
      title="${b.length?b.join(' · '):''}">${nextLabel(id)}</button>
  </div>`;
}
function secHead(id, right){
  const i = stageIdx(id), s = STAGES[i];
  return `<div class="sec-h">
    <span class="nm"><span class="sn">${stageDone(id)?'✓':i+1}</span>${s.label}</span>
    <div class="rt" id="rt-${id}">${right||''}</div>
  </div>`;
}

const setupRight = () => S.exp.name.trim()
  ? '<span class="chip g">named</span>'
  : '<span class="chip out">1 required field</span>';

function secSetup(){
  const e = S.exp;
  return `<div class="stg ${S.activeSection==='setup'?'act':''}" id="sec-setup">
    ${secHead('setup', setupRight())}
    <div class="row" style="margin-bottom:13px">
      <div style="flex:2">
        <div class="flab">Experiment name</div>
        <input class="fld" data-f="name" data-fid="e-name" value="${esc(e.name)}"
          placeholder="Region Brand: what is being tested">
      </div>
      <div style="max-width:130px">
        <div class="flab">Key <span class="info" data-t="Stable ID used in Amplitude and GrowthBook.">i</span></div>
        <input class="fld mono" data-f="key" data-fid="e-key" value="${esc(e.key)}">
      </div>
    </div>
    <div>
      <div class="flab">Hypothesis <span class="chip out" style="font-size:10px;padding:1px 7px">optional</span></div>
      <input class="fld" data-f="hypothesis" data-fid="e-hyp" value="${esc(e.hypothesis)}"
        placeholder="Paste a Notion link, or describe what you expect">
    </div>
    ${secFoot('setup')}
  </div>`;
}

function secAudience(){
  const a = S.exp.audience;
  return `<div class="stg ${S.activeSection==='audience'?'act':''}" id="sec-audience">
    ${secHead('audience')}
    <div class="k" style="margin-bottom:13px">
      Set who is eligible before building variants. New packages inherit region and vertical from here.</div>
    <div style="display:flex;flex-direction:column;gap:11px">
      ${AUD_GROUPS.map(g=>`
        <div style="display:flex;gap:9px;align-items:center">
          <span class="k" style="width:74px;flex-shrink:0">${g.label}</span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${g.opts.map(o=>`<button class="chip pick ${a[g.id]===o?'on':''}"
              data-act="aud" data-g="${g.id}" data-o="${esc(o)}">${o}</button>`).join('')}
          </div>
        </div>`).join('')}
    </div>
    <div class="sep"></div>
    <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
      <span class="k" style="width:74px;flex-shrink:0">And</span>
      ${a.extra.map((x,i)=>`<button class="chip rm" data-act="rm-rule" data-i="${i}">
        ${esc(x)} <span class="x">×</span></button>`).join('')}
      <button class="chip out" style="cursor:pointer" data-act="add-rule">
        + add rule from ${EXTRA_PROPS.length} properties</button>
    </div>
    <div class="matchbox">
      <div>
        <div class="mv">${ELIGIBLE.toLocaleString()}</div>
        <div class="ml">match per week with this audience</div>
      </div>
    </div>
    ${secFoot('audience')}
  </div>`;
}

function secVariants(){
  const e = S.exp, n = e.variants.length, aa = aaVariants(), dc = diffCount();
  const gridable = n >= 2 && n <= 3;
  const showGrid = S.compare && gridable;

  let inner;
  if(n === 0){
    inner = `<button class="empty" data-act="add-variant">+ Add the first variant</button>`;
  } else if(showGrid){
    inner = gridView();
  } else {
    inner = e.variants.map(v=>cardView(v)).join('') +
      `<button class="empty" style="margin-top:4px" data-act="add-variant">+ Add variant</button>`;
  }

  const aaBanner = (aa.length && !e.aaAcknowledged) ? `
    <div class="banner a">
      <div style="flex:1">
        <div class="bt">Variant ${aa.map(v=>v.name||v.id).join(' and ')} ${aa.length>1?'are':'is'} identical to ${e.variants[0].name||e.variants[0].id}</div>
        <div class="bd">Valid as an A/A test. Confirm if intended, or add an override.</div>
      </div>
      <button class="btn sec sm" data-act="ack-aa">Intentional A/A</button>
    </div>` : '';

  return `<div class="stg ${S.activeSection==='variants'?'act':''}" id="sec-variants">
    ${secHead('variants', `
      ${n>=2 ? (dc ? `<span class="chip h">${dc} of ${ATTRS.length} attributes differ</span>`
                   : `<span class="chip a">no differences</span>`) : ''}
      ${gridable ? `<button class="btn sec sm" data-act="toggle-compare">
          ${showGrid?'Card view':'Compare view'}</button>` : ''}`)}
    ${aaBanner}
    ${inner}
    ${secFoot('variants')}
  </div>`;
}

function cardView(v){
  const isCtrl = v.role === 'control';
  const ov = overrideCount(v);
  const aa = !isCtrl && ov === 0 && !S.exp.aaAcknowledged;
  return `<div class="vcard ${isCtrl?'ctrl':(aa?'aa':(ov?'diff':''))}">
    <div class="vcard-h">
      <div style="display:flex;align-items:center;gap:9px">
        <input class="fld inline" data-vn="${v.id}" data-fid="vn-${v.id}" value="${esc(v.name||v.id)}"
          style="width:${Math.max(40,(v.name||v.id).length*10)}px">
        <span class="k">${isCtrl?'control':'test'}</span>
        ${v.inherits ? `<span class="chip ${ov?'h':'a'}">inherits ${v.inherits} · ${ov} override${ov===1?'':'s'}</span>`
                     : (isCtrl?'<span class="chip out">baseline</span>':'')}
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn sec xs" data-act="clone" data-v="${v.id}">Clone</button>
        ${!isCtrl?`<button class="btn danger xs" data-act="rm-variant" data-v="${v.id}">Remove</button>`:''}
      </div>
    </div>
    <div class="slots">
      ${v.packages.map((p,i)=>{
        const P = library[p];
        return `<button class="slot ${P&&P.isNew?'new':''}" data-act="pick" data-v="${v.id}" data-i="${i}">
          ${P?esc(P.name):'empty slot'}
          <span class="pm">${P?P.plans.map(x=>{const ps=planPrices(x);return ps.length?money(Math.min(...ps)):'';}).filter(Boolean).join(' / '):''}</span>
        </button>`;
      }).join('')}
      <button class="slot add" data-act="pick" data-v="${v.id}" data-i="${v.packages.length}">+ add package</button>
    </div>
  </div>`;
}

function gridView(){
  const vs = S.exp.variants;
  const rows = diffRows();
  const canAdd = vs.length < 3;
  const cols = `152px repeat(${vs.length}, minmax(180px,1fr))` + (canAdd ? ' 116px' : '');
  const bodyH = rows.length * 54;
  return `<div class="grid" style="grid-template-columns:${cols}">
    <div><div class="gh">Attribute</div>
      ${rows.map(r=>`<div class="gl">${r.differs?'<span class="dot"></span>':''}${r.attr.label}</div>`).join('')}
      <div class="grid-actions"></div>
    </div>
    ${vs.map((v,ci)=>{
      const ov = overrideCount(v);
      return `<div>
        <div class="colh">
          <input class="fld inline" data-vn="${v.id}" data-fid="vn-${v.id}" value="${esc(v.name||v.id)}"
            style="width:${Math.max(36,(v.name||v.id).length*10)}px">
          <span class="k" style="font-size:11px">${v.role}</span>
          ${ci===0
            ? `<button class="btn sec xs" data-act="clone" data-v="${v.id}">Clone</button>`
            : `<span class="chip ${ov?'h':'a'}" style="font-size:10.5px">${ov} override${ov===1?'':'s'}</span>`}
        </div>
        ${rows.map(r=>{
          const val = r.vals[ci];
          const same = ci>0 && val === r.base;
          const diff = ci>0 && val !== r.base;
          const cls = diff ? 'diff' : (same ? 'same' : (val===null ? 'none' : ''));
          return `<div class="cel ${cls}" title="${val===null?'none':esc(val)}">
            ${diff?'<span class="dot"></span>':''}<span class="txt">${val===null?'none':esc(val)}</span></div>`;
        }).join('')}
        <div class="grid-actions">
          <button class="slot add" style="font-size:11.5px;padding:5px 9px"
            data-act="pick" data-v="${v.id}" data-i="${v.packages.length}">+ package</button>
          ${v.role!=='control'?`<button class="btn danger xs" data-act="rm-variant" data-v="${v.id}">Remove</button>`:''}
        </div>
      </div>`;
    }).join('')}
    ${canAdd?`<div><div class="gh">&nbsp;</div>
      <button class="empty" style="height:${bodyH - 8}px;width:100%;display:flex;align-items:center;justify-content:center"
        data-act="add-variant">+ variant</button></div>`:''}
  </div>
  <div class="k" style="margin-top:6px">Dashed cells are identical to the control. Click a variant name to rename it.</div>`;
}

function funnelInner(){
  const e = S.exp;
  const rest = 100 - e.traffic;
  const shades = ['#0f6b52','#3d8a72','#6aa993','#97c8b5'];
  return e.variants.map((v,i)=>{
    const share = e.traffic * (splitOf(v.id)/100);
    return `<i style="flex:${Math.max(share,0.1)*10};background:${shades[i%4]}">
      ${share>=6?`${esc(v.name||v.id)} · ${share.toFixed(share%1?1:0)}%`:''}</i>`;
  }).join('')
    + (rest>0?`<i class="o" style="flex:${rest*10}">${rest>10?'Not enrolled · '+rest+'%':''}</i>`:'');
}

function secTraffic(){
  const e = S.exp;
  ensureSplits();
  const n = Math.max(e.variants.length,1);
  const d = daysToDetectNum();
  return `<div class="stg ${S.activeSection==='traffic'?'act':''}" id="sec-traffic">
    ${secHead('traffic', `<span class="chip out">${e.evenSplit?'even split':'custom split'} · ${n} arm${n===1?'':'s'}</span>`)}

    <div style="display:flex;gap:16px;align-items:center;margin-bottom:10px">
      <div style="flex:1">
        <div class="flab">Total enrolled traffic
          <span class="info" data-t="Share of eligible traffic that enters the experiment at all.">i</span></div>
        <input type="range" min="0" max="100" step="5" value="${e.traffic}" data-f="traffic" data-fid="e-traffic">
      </div>
      <div style="width:96px">
        <div class="flab">&nbsp;</div>
        <div class="fld lock" id="tPct" style="text-align:center;font-weight:650">${e.traffic}%</div>
      </div>
    </div>
    <div class="fun" id="tFun">${funnelInner()}</div>

    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;margin-bottom:6px">
      <span class="v" style="font-size:13px">Traffic per variant</span>
      <button class="chip pick ${e.evenSplit?'on':''}" data-act="toggle-even">
        ${e.evenSplit?'Even split · click to customise':'Custom split · click to rebalance evenly'}</button>
    </div>
    <div class="splits" id="tSplits">
      ${e.variants.map(v=>`<div class="splitrow">
        <span class="sl">${esc(v.name||v.id)}</span>
        <input type="range" min="0" max="100" step="1" value="${splitOf(v.id)}"
          data-split="${v.id}" data-fid="sp-${v.id}" ${e.evenSplit?'disabled':''}
          style="flex:1;opacity:${e.evenSplit?0.6:1}">
        <span class="sr" id="spv-${v.id}">${splitOf(v.id)}%</span>
        <span class="k" style="width:110px;text-align:right">${perVariantWeekly(v.id).toLocaleString()} / wk</span>
      </div>`).join('')}
      ${!e.evenSplit && Math.abs(splitSum()-100)>0.5
        ? `<div class="k" style="color:var(--hot)">Shares add to ${splitSum().toFixed(0)}%. They need to add to 100%.</div>` : ''}
    </div>

    <div class="mdebox">
      <div class="flab">Desired minimum detectable effect
        <span class="info" data-t="The smallest relative lift you want to be able to detect. Lower MDEs need more traffic or a longer run.">i</span></div>
      <div style="display:flex;gap:12px;align-items:center">
        <input type="range" min="1" max="20" step="1" value="${e.mde}" data-f="mde" data-fid="e-mde" style="flex:1">
        <div class="fld lock" id="mdePct" style="width:72px;text-align:center;font-weight:650">${e.mde}%</div>
      </div>
      <div class="mdeout">
        <div class="mo"><div class="mv" id="mdeDays">${d===Infinity?'—':d}</div>
          <div class="ml">days to detect a ${e.mde}% lift</div></div>
        <div class="mo"><div class="mv" id="mdeRun">${e.lengthDays}</div>
          <div class="ml">planned run length (days)</div></div>
        <div class="mo"><div class="mv" id="mdeFit" style="color:${d<=e.lengthDays?'var(--accent)':'var(--hot)'}">${d===Infinity?'No':(d<=e.lengthDays?'Fits':'Short')}</div>
          <div class="ml">${d===Infinity?'not enough traffic':(d<=e.lengthDays?'detectable within the run':'needs more traffic or time')}</div></div>
      </div>
    </div>
    ${secFoot('traffic')}
  </div>`;
}

function secLaunch(){
  const e = S.exp, cks = checklist(), ok = canPublish();
  const rows = diffRows().filter(r=>r.differs);
  const outstanding = cks.filter(c=>!c.ok).length;

  if(S.published){
    return `<div class="stg ${S.activeSection==='launch'?'act':''}" id="sec-launch">
      ${secHead('launch', `<span class="chip g">Live on ${e.envs.join(' + ')}</span>`)}
      <div class="banner g">
        <div style="flex:1">
          <div class="bt">Published to ${e.envs.join(' and ')}</div>
          <div class="bd">Amplitude schema payload emitted for dashboard generation.</div>
        </div>
      </div>
      <div class="ckl">${cks.map(c=>ckRow(c)).join('')}</div>
    </div>`;
  }

  return `<div class="stg ${S.activeSection==='launch'?'act':''}" id="sec-launch">
    ${secHead('launch', ok
      ? '<span class="chip g">ready to publish</span>'
      : `<span class="chip a">${outstanding} outstanding</span>`)}

    <div class="k" style="margin-bottom:11px">
      Every check below is derived from the stages above. Fix anything outstanding before publishing.</div>
    <div class="ckl">${cks.map(c=>ckRow(c)).join('')}</div>

              <span class="k">${r.base===null?'none':esc(r.base)} → <b style="color:var(--ink)">${val===null?'none':esc(val)}</b></span>

        ).join('') : `<div class="k">No differences. This is an A/A test.</div>`)}

    <div class="pubbox">

        <div class="v" style="margin-bottom:8px">Publish to</div>

          <button class="envchip ${e.envs.includes('staging')?'on':''}" data-act="env-tog" data-e="staging">

          </button>

      </div>

}

function ckRow(c){
  const cls = c.ok ? 'ok' : (c.warn ? 'warn' : 'no');
  return `<div class="ck ${cls}">
    <span class="cki">${c.ok ? '✓' : '!'}</span>
    <div class="ckb">
      <div class="ckt">${c.t}</div>
      <div class="ckd">${esc(c.d)}</div>
    </div>
    ${c.ok ? '' : `<button class="btn sec xs" data-act="go-stage" data-s="${c.jump}">Fix</button>`}
  </div>`;
}

function planEditor(p, i, f){
  const ds = doses(f.medication);
  const single = ds.length === 1;
  return `<div class="plan">
    <div class="plan-h">
      <select class="sel" data-fpt="${i}">
        ${PLAN_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
      ${single ? `<span class="chip out">single dose</span>` : `
        <div class="seg">
          <button class="${p.mode==='flat'?'on':''}" data-act="plan-mode" data-i="${i}" data-m="flat">One price</button>
          <button class="${p.mode==='tiered'?'on':''}" data-act="plan-mode" data-i="${i}" data-m="tiered">Per dose</button>
        </div>`}
      <span class="k" style="margin-left:auto">${esc(planLabel(p))}</span>
      ${f.plans.length > 1
        ? `<button class="btn danger xs" data-act="rm-plan" data-i="${i}">Remove</button>` : ''}
    </div>
    ${(p.mode === 'tiered' && !single) ? `
      <div class="doses">
        ${ds.map(d=>`<div class="dose">
          <div class="dl">${d}</div>
          <input value="${esc(p.tiers[d] ?? '')}" data-fd="${i}" data-d="${esc(d)}"
            data-fid="p-dose-${i}-${esc(d).replace(/\s/g,'_')}" placeholder="0" inputmode="numeric">
        </div>`).join('')}
      </div>` : `
      <div style="max-width:170px">
        <div class="flab">Price per month</div>
        <div class="pfx"><span>$</span>
          <input value="${esc(p.price)}" data-fp="${i}" data-fid="p-price-${i}"
            placeholder="429" inputmode="numeric"></div>
      </div>`}
  </div>`;
}

function pkgPreview(){
  const f = S.focus;
  const priced = f.plans.filter(p => planPrices(p).length);
  const inc = f.care.map(id=>CARE[id]).filter(c=>c && c.mode==='included');
  const add = f.care.map(id=>CARE[id]).filter(c=>c && c.mode==='addon');
  const cheapest = priced.length
    ? priced.reduce((a,b)=> Math.min(...planPrices(a)) <= Math.min(...planPrices(b)) ? a : b) : null;
  return `<div class="nub"></div>
    <div class="k" style="margin-bottom:11px">Checkout preview</div>
    ${priced.length ? priced.map(p=>{
      const ps = planPrices(p), lo = Math.min(...ps), hi = Math.max(...ps);
      const best = p === cheapest;
      return `<div class="pl ${best?'on':''}">
        <div class="pt"><span>${p.type}</span>${best&&priced.length>1?'<span class="chip g" style="font-size:9.5px">best value</span>':''}</div>
        <div class="pp">${money(lo)}<span>/mo</span></div>
        <div class="pm">${p.mode==='tiered'
          ? (lo===hi ? 'Same at every dose' : 'From ' + money(lo) + ' to ' + money(hi) + ' by dose')
          : 'One price at every dose'}</div>
      </div>`;
    }).join('') : `<div class="pl"><div class="pt">No priced plan yet</div>
        <div class="pm" style="margin-top:4px">Add a price to see the checkout.</div></div>`}
    ${inc.length ? `<div class="k" style="margin:11px 0 5px">Included</div>
      ${inc.map(c=>`<div style="font-size:12px;display:flex;gap:6px;margin-bottom:3px">
        <span style="color:var(--accent);font-weight:700">✓</span>${esc(c.name)}</div>`).join('')}` : ''}
    ${add.length ? `<div class="k" style="margin:11px 0 5px">Add to your plan</div>
      ${add.map(c=>`<div style="font-size:12px;display:flex;justify-content:space-between;margin-bottom:3px">
        <span>${esc(c.name)}</span><span class="k">+${money(c.price)}</span></div>`).join('')}` : ''}
    <button class="btn pri" style="width:100%;justify-content:center;margin-top:12px">Continue</button>`;
}
