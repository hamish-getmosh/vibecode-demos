}

function patchTraffic(){
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('tPct', S.exp.traffic + '%');
  set('tFun', funnelInner());
  S.exp.variants.forEach(v=>{
    const pct = splitOf(v.id);
    const wk = document.getElementById('spw-'+v.id);
    if(wk) wk.textContent = perVariantDaily(v.id).toLocaleString() + ' / day';
    document.querySelectorAll(`[data-split="${v.id}"], [data-splitn="${v.id}"]`).forEach(inp=>{
      if(document.activeElement !== inp) inp.value = pct;
    });
  });
  // keep the even-split chip label honest without a full re-render
  const chip = document.querySelector('[data-act="toggle-even"]');
  if(chip){
    chip.classList.toggle('on', S.exp.evenSplit);
    chip.textContent = S.exp.evenSplit ? 'Even split' : 'Rebalance evenly';
  }
  patchMde();
  patchGate();
}
function patchMde(){
  const e = S.exp, d = daysToDetectNum(), abs = absUplift(), g=metricOf();
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('mdeBase', formatMetricValue(goalBaseline(g),g));
  set('mdePct', e.mde + '%');
  set('mdeAbs', formatAbsEffect(abs,g));
  set('mdeAbsHint', 'Desired absolute · ' + formatMetricValue(goalBaseline(g),g) + ' to ' + formatMetricValue(goalBaseline(g)+abs,g));
  set('mdeDays', d===Infinity ? 'n/a' : String(d));
  const smallest = e.variants.length
    ? Math.min(...e.variants.map(v => perVariantWeekly(v.id)))
    : perVariantWeekly();
  set('mdeSample', d===Infinity ? 'n/a' : smallest.toLocaleString());
  const mdeRange = document.querySelector('[data-f="mde"]');
  if(mdeRange && document.activeElement !== mdeRange) mdeRange.value = e.mde;
}
function patchNamePreview(){
  const e = S.exp;
  const prev = document.getElementById('namePrev');
  if(!prev) return;
  const hasDesc = !!String(e.descriptor||'').trim();
  prev.innerHTML = `<span class="ok">[${esc(expCode(e))}]</span>
    <span class="dim"> - </span>
    <span class="${hasDesc?'ok':'dim'}">[${hasDesc?esc(e.descriptor):'Descriptor'}]</span>`;
  // live title in the page header while naming
  const h = document.querySelector('.page-head h1');
  if(h && S.activeSection === 'setup'){
    h.textContent = hasDesc ? composeExpName(e) : 'Untitled experiment';
  }
}
function patchCodeWarn(field){
  const inp = document.querySelector(`[data-code-inp="${field}"]`);
  const warnEl = document.getElementById('codewarn-' + field);
  if(!inp || !warnEl) return;
  const w = codeFieldWarning(field, S.exp.code[field]);
  warnEl.textContent = w;
  warnEl.style.display = w ? '' : 'none';
  inp.classList.toggle('codewarn', !!w);
  if(!w){
    inp.classList.remove('err');
    let tip = inp.parentElement && inp.parentElement.nextElementSibling;
    if(tip && tip.classList.contains('fielderr')) tip.remove();
    const sib = inp.nextElementSibling;
    if(sib && sib.classList.contains('fielderr')) sib.remove();
  }
  patchGate();
  patchNamePreview();
}
function patchGate(){
  document.querySelectorAll('[data-act="next"]').forEach(btn=>{
    const id = btn.dataset.s;
    const b = stageBlockers(id);
    btn.classList.toggle('is-off', b.length > 0);
    btn.setAttribute('aria-disabled', b.length ? 'true' : 'false');
    btn.title = b.length ? b.join(' · ') : '';
    btn.textContent = nextLabel(id);
  });
  const rt = document.getElementById('rt-setup');
  if(rt) rt.innerHTML = setupRight();
  const rg = document.getElementById('rt-goal');
  if(rg) rg.innerHTML = goalRight();
}
function patchBuilderGate(){
  if(S.focus){
    const is = focusIssues();
    const w = document.getElementById('pkgReady');
    if(w) w.innerHTML = readyChip(is);
    const b = document.querySelector('[data-act="focus-save"]');
    if(b){ b.disabled = is.length > 0; b.title = is.length ? is.join(' · ') : ''; }
  }
  if(S.libDraft){
    const is = S.libTab==='packages' ? pkgIssues(S.libDraft)
             : S.libTab==='goals'    ? goalIssues(S.libDraft)
             : careIssues(S.libDraft);
    const w = document.getElementById('libReady');
    if(w) w.innerHTML = readyChip(is);
    const b = document.querySelector('[data-act="lib-save"]');
    if(b){ b.disabled = is.length > 0; }
  }
}

function setupLocked(){ return S.published && S.setupEdit !== 'all'; }
const SETUP_MUTATE = new Set([
  'next','add-variant','clone','rm-variant','ack-aa','pick','pick-care','attach','attach-care',
  'rm-care','build-pkg','build-care','aud','aud-reset','add-rule','add-rule-do','rm-rule','toggle-even',
  'new-goal','code','env-tog','publish','toggle-compare'
]);

function bind(){
  document.querySelectorAll('[data-stop]').forEach(n=>n.addEventListener('click', ev=>ev.stopPropagation()));

  document.querySelectorAll('[data-act]').forEach(n=>{
    n.addEventListener('click', ev=>{
      const a = n.dataset.act;
      if(setupLocked() && SETUP_MUTATE.has(a)){
        toast('Setup is locked. Use Edit experiment to make changes.');
        return;
      }
      const V = id => S.exp.variants.find(v=>v.id===id);
      switch(a){
        case 'go-dash': S.view='dashboard'; S.modal=null; S.focus=null; render(); break;
        case 'draft-save-exit': saveDraftAndExit(); break;
        case 'resume-draft': resumeDraft(); break;
        case 'draft-abandon': S.modal={type:'abandon-draft'}; render(); break;
        case 'draft-abandon-confirm': abandonDraft(); break;
        case 'replace-draft-confirm':
          S.sessionDraft=null; S.hasDraft=false; S.modal=null; startNewExperiment(); break;
        case 'go-lib':
          S.view='library'; S.libTab=n.dataset.t||'packages';
          S.libSel=null; S.libDraft=null; S.modal=null; S.focus=null; render(); break;
        case 'dash-tab': S.dashTab = n.dataset.t; render(); break;
        case 'new': newExperimentFlow(); break;
        case 'open-run': openRun((n.dataset.k==='fin'?FINISHED:RUNS)[Number(n.dataset.i)]); break;
        case 'go-stage': goStage(n.dataset.s); break;
        case 'next': goNext(n.dataset.s); break;
        case 'lib-sel':
          S.libSel = n.dataset.id;
          S.libDraft = S.libTab==='packages' ? libPkgDraft(library[S.libSel])
            : S.libTab==='goals' ? libGoalDraft(GOALS[S.libSel])
            : libCareDraft(CARE[S.libSel]);
          render(); break;
        case 'lib-new':
          S.libSel = null;
          S.libDraft = S.libTab==='packages' ? blankLibPkg()
            : S.libTab==='goals' ? blankGoalDraft()
            : blankLibCare();
          render(); break;
        case 'lib-save': saveLibDetail(); break;
        case 'lib-add-plan': {
          const used = S.libDraft.plans.map(p=>p.type);
          S.libDraft.plans.push(blankPlan(PLAN_TYPES.find(t=>!used.includes(t))||'Monthly'));
          render(); break;
        }
        case 'lib-rm-plan': S.libDraft.plans.splice(Number(n.dataset.i),1); render(); break;
        case 'lib-plan-mode': {
          const p = S.libDraft.plans[Number(n.dataset.i)];
          const mode = n.dataset.m;
          if(p.mode !== mode){
            if(mode === 'tiered'){
              const seed = p.price !== '' && p.price != null ? p.price
                : (planPrices(p).length ? String(Math.min(...planPrices(p))) : '');
              doses(S.libDraft.medication).forEach(d=>{
                if(p.tiers[d] == null || p.tiers[d] === '') p.tiers[d] = seed;
              });
            }
            p.mode = mode;
          }
          render(); break;
        }
        case 'lib-care': {
          const c = n.dataset.c, f = S.libDraft;
          f.care = f.care.includes(c) ? f.care.filter(x=>x!==c) : [...f.care, c];
          render(); break;
        }
        case 'lib-kind': S.libDraft.kind = n.dataset.k; render(); break;
        case 'metric-kind': {
          const f=n.dataset.pfx==='gd'?S.focus:S.libDraft;
          if(f){ f.kind=n.dataset.k; if(f.kind==='continuous'&&!f.event) f.event='purchase'; render(); }
          break;
        }
        case 'lib-mode': S.libDraft.mode = n.dataset.m; render(); break;
        case 'add-plan': addPlan(); break;
        case 'rm-plan': removePlan(Number(n.dataset.i)); break;
        case 'plan-mode': setPlanMode(Number(n.dataset.i), n.dataset.m); break;
        case 'add-variant': addVariant(); break;
        case 'clone': cloneVariant(V(n.dataset.v)); break;
        case 'rm-variant': removeVariant(V(n.dataset.v)); break;
        case 'toggle-compare': S.compare = !S.compare; render(); break;
        case 'ack-aa': S.exp.aaAcknowledged = true; save(); render(); toast('A/A confirmed as intentional.'); break;
        case 'pick': openPackagePicker(V(n.dataset.v), Number(n.dataset.i), 'packages'); break;
        case 'pick-care': openPackagePicker(V(n.dataset.v), 0, 'care'); break;
        case 'pick-tab': S.modal.tab = n.dataset.t; render(); break;
        case 'attach': attachPackage(S.modal.variant, S.modal.slotIndex, n.dataset.p); break;
        case 'attach-care': attachCare(S.modal.variant, n.dataset.c); break;
        case 'rm-care': detachCare(n.dataset.v, n.dataset.c); break;
        case 'build-pkg': openPackageBuilder({variantId:S.modal.variant.id, slotIndex:S.modal.slotIndex}); break;
        case 'build-care': openCareBuilder({variantId:S.modal.variant.id}); break;
        case 'new-care-in-pkg': openCareBuilder({pkgDraft:S.focus}); break;
        case 'close-modal': S.modal=null; render(); break;
        case 'focus-cancel': {
          closeGtm(()=>{
            const ret = S.focus && S.focus.returnTo;
            S.focus = (ret && ret.pkgDraft) ? ret.pkgDraft : null;
            render(); toast('Discarded.');
          });
          break;
        }
        case 'focus-save':
          if(focusIssues().length){ toast(focusIssues()[0] + '.'); break; }
          closeGtm(()=> saveFocus());
          break;
        case 'gtm-scrim':
          if(ev.target === n) closeGtm(()=>{ S.focus = null; render(); });
          break;
        case 'go-phase':
          if(!phaseUnlocked(n.dataset.p)) break;
          if(S.setupEdit && n.dataset.p !== 'setup'){
            toast('Update the experiment or cancel changes before leaving setup.');
            break;
          }
          S.phase = n.dataset.p;
          if(S.phase === 'setup' && !S.activeSection) S.activeSection = 'setup';
          if(S.phase === 'live'){
            S.liveSec = (S.liveSec === 'audience' || S.liveSec === 'update' || S.liveSec === 'significance')
              ? 'controls' : (S.liveSec || 'controls');
          }
          if(S.phase === 'report') S.reportSec = S.reportSec || 'analysis';
          render(); break;
        case 'go-livesec': {
          const sid = n.dataset.s;
          S.liveSec = (sid === 'audience' || sid === 'update' || sid === 'significance') ? 'overview' : sid;
          render();
          const map = {controls:'live-reporting', overview:'live-overview', conversion:'live-conversion'};
          const t = document.getElementById(map[S.liveSec]);
          if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
          break;
        }
        case 'setup-edit': beginSetupEdit(); break;
        case 'variants-edit-confirm':
          S.modal = null; beginSetupEdit('variants'); break;
        case 'setup-cancel': cancelSetupEdit(); break;
        case 'setup-save': {
          const before=S.setupSnap&&S.setupSnap.exp;
          const risky=before&&(JSON.stringify(before.variants)!==JSON.stringify(S.exp.variants)
            || before.traffic!==S.exp.traffic || JSON.stringify(before.splits)!==JSON.stringify(S.exp.splits));
          if(risky){ S.modal={type:'live-update-confirm'}; render(); break; }
          commitSetupEdit(); break;
        }
        case 'setup-save-confirm':
          S.modal = null; commitSetupEdit(); break;
        case 'go-reportsec': {
          S.reportSec = n.dataset.s; render();
          const t = document.getElementById('report-' + S.reportSec);
          if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
          break;
        }
        case 'live-range': {
          if(n.dataset.r === 'custom'){
            // seed custom from the current selected window before switching mode
            const w = liveWindow();
            S.liveFrom = w.startIso;
            S.liveTo = w.endIso;
          }
          S.liveRange = n.dataset.r;
          render(); break;
        }
        case 'conv-chart':
          S.liveConvChart = n.dataset.m === 'cumulative' ? 'cumulative' : 'daily';
          render(); break;
        case 'live-compare':
          S.liveCompareIdx = Math.max(1, Number(n.dataset.i) || 1);
          render(); break;
        case 'live-ana-edit':
          S.liveAnaSnap = {conf:S.conf, power:S.power, mde:Number(S.exp.mde)||10};
          S.liveAnaEdit = true; render(); break;
        case 'live-ana-cancel':
          if(S.liveAnaSnap){
            S.conf = S.liveAnaSnap.conf;
            S.power = S.liveAnaSnap.power;
            S.exp.mde = S.liveAnaSnap.mde;
          }
          S.liveAnaEdit = false; S.liveAnaSnap = null; render(); break;
        case 'live-ana-save': {
          const confInp = document.querySelector('[data-live-ana-inp="conf"]');
          const powInp = document.querySelector('[data-live-ana-inp="power"]');
          const mdeInp = document.querySelector('[data-live-ana-inp="mde"]');
          const conf = Math.max(50, Math.min(99, Math.round(Number(confInp && confInp.value) || S.conf)));
          const power = Math.max(50, Math.min(99, Math.round(Number(powInp && powInp.value) || S.power)));
          const mde = Math.max(1, Math.min(50, Math.round(Number(mdeInp && mdeInp.value) || S.exp.mde)));
          S.conf = conf;
          S.power = power;
          S.exp.mde = mde;
          S.liveAnaEdit = false; S.liveAnaSnap = null;
          save(); render();
          toast(`Analysis saved: ${conf}% significance, ${power}% power, ${mde}% MDE.`);
          break;
        }
        case 'pause': pauseExperiment(); break;
        case 'regen-analysis': S.report.analysis = buildAnalysis(); render(); toast('Analysis regenerated.'); break;
        case 'share-copy': copyShareCanvas(n.dataset.k); break;
        case 'share-dl': downloadShareCanvas(n.dataset.k); break;
        case 'slack-copy':
          navigator.clipboard.writeText(slackBody()).then(()=>toast('Copied for Slack.')).catch(()=>toast('Copy failed.'));
          break;
        case 'slack-post':
          S.report.slackPosted = true; render();
          toast(`Posted to ${S.report.slackChannel} (simulated).`);
          break;
        case 'notion-sync':
          S.report.notionSynced = 'Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
          render(); toast('Notion page updated (simulated).'); break;
        case 'notion-open': toast('Would open the Notion experiment page.'); break;
        case 'focus-care-kind': S.focus.kind = n.dataset.k; render(); break;
        case 'focus-care-mode': S.focus.mode = n.dataset.m; render(); break;
        case 'care': {
          const c = n.dataset.c, f = S.focus;
          f.care = f.care.includes(c) ? f.care.filter(x=>x!==c) : [...f.care, c];
          render(); break;
        }
        case 'aud': S.exp.audience[n.dataset.g] = n.dataset.o; save(); render(); break;
        case 'add-rule': openRulePicker(); break;
        case 'add-rule-do': S.exp.audience.extra.push(n.dataset.r);
          save(); render(); toast('Rule layer added.'); break;
        case 'rm-rule': S.exp.audience.extra.splice(Number(n.dataset.i),1); save(); render(); break;
        case 'toggle-even':
          if(S.published && S.setupEdit !== 'all') break;
          rebalanceEven(); save(); render(); break;
        case 'new-goal': openGoalBuilder({setPrimary:true}); break;
        case 'code': {
          const f = n.dataset.f, v = n.dataset.v;
          ensureCodeCustom();
          if(v === '__custom__'){
            S.exp.codeCustom[f] = true;
            if(codePresetIds(f).includes(S.exp.code[f])) S.exp.code[f] = '';
            syncExpName({codeField:f});
          } else {
            S.exp.codeCustom[f] = false;
            S.exp.code[f] = v;
            syncExpName({codeField:f});
          }
          save(); render(); break;
        }
        case 'aud-reset':
          applyAudienceFromCode(); save(); render();
          toast('Audience reset to the name code.'); break;
        case 'env-tog': {
          const e = n.dataset.e;
          if(S.exp.envs.includes(e)) S.exp.envs = S.exp.envs.filter(x=>x!==e);
          else S.exp.envs = [...S.exp.envs, e];
          save(); render(); break;
        }
        case 'publish': publish(); break;
        case 'retire': retireExperiment(); break;
        case 'amp-create': createAmpDashboard(); break;
        case 'chat-open': S.chat.open = true; render(); break;
        case 'chat-close': S.chat.open = false; render(); break;
        case 'chat-reset': S.chat.msgs = []; S.chat.pending = null; S.chat.input = ''; render(); break;
        case 'chat-quick': S.chat.input = CHAT_QUICK[Number(n.dataset.i)]; chatSend(); break;
        case 'chat-send': chatSend(); break;
        case 'chat-apply': chatApply(); break;
        case 'chat-edit': chatEdit(); break;
        case 'chat-discard': S.chat.pending = null;
          S.chat.msgs.push({role:'ag', text:'Dropped it. Tell me what to change and I will draft another one.'});
          render(); break;
      }
    });
  });

  const ci = document.querySelector('[data-chat]');
  if(ci){
    ci.addEventListener('input', ()=>{ S.chat.input = ci.value; });
    ci.addEventListener('keydown', ev=>{
      if(ev.key === 'Enter' && !ev.shiftKey){ ev.preventDefault(); S.chat.input = ci.value; chatSend(); }
    });
  }
  const cb = document.getElementById('chatBody');
  if(cb) cb.scrollTop = cb.scrollHeight;

  document.querySelectorAll('[data-ana]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S[sel.dataset.ana] = Number(sel.value);
      if(S.phase === 'setup' && S.activeSection === 'traffic'){
        patchMde();
        toast(`Planning at ${S.conf}% significance, ${S.power}% power.`);
      } else {
        render();
        toast(`Analysis defaults: ${S.conf}% significance, ${S.power}% power.`);
      }
    });
  });
  document.querySelectorAll('[data-exp-mde]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S.exp.mde = Number(sel.value);
      save();
      if(S.phase === 'setup' && S.activeSection === 'traffic'){
        patchMde();
        toast(`Target MDE set to ${S.exp.mde}%.`);
      } else {
        render();
        toast(`Target MDE set to ${S.exp.mde}%.`);
      }
    });
  });

  document.querySelectorAll('[data-f]').forEach(inp=>{
    const f = inp.dataset.f;
    if(setupLocked() && f !== undefined){
      inp.addEventListener('input', ev=>{ ev.preventDefault(); });
      return;
    }
    if(f === 'traffic' || f === 'mde'){
      inp.addEventListener('input', ()=>{
        if(S.published && S.setupEdit !== 'all' && f === 'traffic') return;
        if(S.published && !S.setupEdit && f === 'mde') return;
        S.exp[f] = Number(inp.value);
        if(f === 'traffic') patchTraffic();
        else patchMde();
        save();
      });
      inp.addEventListener('change', ()=>{
        if(S.published && S.setupEdit !== 'all' && f === 'traffic') return;
        if(S.published && !S.setupEdit && f === 'mde') return;
        render();
      });
      return;
    }
    if(f === 'descriptor'){
      inp.addEventListener('input', ()=>{
        S.exp.descriptor = inp.value;
        syncExpName();
        patchNamePreview();
        patchGate();
        if(String(inp.value||'').trim()){
          inp.classList.remove('err');
          const tip = inp.nextElementSibling;
          if(tip && tip.classList.contains('fielderr')) tip.remove();
        }
        save();
      });
      return;
    }
    inp.addEventListener('input', ()=>{
      S.exp[f] = inp.value;
      patchGate();
      save();
    });
  });

  const trafficWritable = () => !S.published || S.setupEdit === 'all';
  document.querySelectorAll('[data-split]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(!trafficWritable()) return;
      setSplitLinked(inp.dataset.split, Number(inp.value));
      patchTraffic();
      save();
    });
    inp.addEventListener('change', ()=>{ if(trafficWritable()) render(); });
  });
  document.querySelectorAll('[data-splitn]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(!trafficWritable() || inp.value === '') return;
      setSplitLinked(inp.dataset.splitn, Number(inp.value));
      patchTraffic();
      save();
    });
    inp.addEventListener('blur', ()=>{ if(trafficWritable()) render(); });
    inp.addEventListener('keydown', ev=>{ if(ev.key === 'Enter') inp.blur(); });
  });
  document.querySelectorAll('[data-vn]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(setupLocked()) return;
      const v = S.exp.variants.find(x=>x.id===inp.dataset.vn);
      if(v){ v.name = inp.value; inp.style.width = Math.max(40, inp.value.length*10) + 'px'; }
      save();
    });
  });

  const liveFrom = document.querySelector('[data-livefrom]');
  if(liveFrom) liveFrom.addEventListener('change', ()=>{
    S.liveFrom = liveFrom.value; S.liveRange = 'custom'; render();
  });
  const liveTo = document.querySelector('[data-liveto]');
  if(liveTo) liveTo.addEventListener('change', ()=>{
    S.liveTo = liveTo.value; S.liveRange = 'custom'; render();
  });
  document.querySelectorAll('[data-code-inp]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const f = inp.dataset.codeInp;
      S.exp.code[f] = sanitizeCode(inp.value, f);
      if(document.activeElement === inp && inp.value !== S.exp.code[f]) inp.value = S.exp.code[f];
      syncExpName();
      patchCodeWarn(f);
      save();
    });
  });
  const analysis = document.querySelector('[data-analysis]');
  if(analysis) analysis.addEventListener('input', ()=>{ S.report.analysis = analysis.value; });
  const slackch = document.querySelector('[data-slackch]');
  if(slackch) slackch.addEventListener('change', ()=>{ S.report.slackChannel = slackch.value; });

  const num = s => String(s).replace(/[^0-9]/g,'');
  const repaintPkg = () => {
    const p = document.getElementById('pv'); if(p) p.innerHTML = pkgPreview();
    patchBuilderGate();
  };

  document.querySelectorAll('[data-ff]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const f = inp.dataset.ff;
      if(f === 'price') inp.value = num(inp.value);
      S.focus[f] = inp.value;
      repaintPkg();
    });
  });
  document.querySelectorAll('[data-fp]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      S.focus.plans[Number(inp.dataset.fp)].price = inp.value;
      repaintPkg();
    });
  });
  document.querySelectorAll('[data-fd]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      const p = S.focus.plans[Number(inp.dataset.fd)];
      if(inp.value === '') delete p.tiers[inp.dataset.d];
      else p.tiers[inp.dataset.d] = inp.value;
      repaintPkg();
    });
  });
  document.querySelectorAll('[data-fpt]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S.focus.plans[Number(sel.dataset.fpt)].type = sel.value; render();
    });
  });
  const med = document.querySelector('[data-fm]');
  if(med) med.addEventListener('change', ()=>{
    S.focus.medication = med.value;
    const valid = doses(med.value);
    S.focus.plans.forEach(p=>{
      const carried = planPrices(p);
      Object.keys(p.tiers).forEach(d=>{ if(!valid.includes(d)) delete p.tiers[d]; });
      if(valid.length === 1){
        if(p.price === '' && carried.length) p.price = String(Math.min(...carried));
        p.mode = 'flat';
      }
    });
    render();
  });

  document.querySelectorAll('[data-ld]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const f = inp.dataset.ld;
      if(f === 'price'){ inp.value = num(inp.value); S.libDraft.price = inp.value; }
      else S.libDraft[f] = inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-ldp]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      S.libDraft.plans[Number(inp.dataset.ldp)].price = inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-ldd]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      const p = S.libDraft.plans[Number(inp.dataset.ldd)];
      if(inp.value === '') delete p.tiers[inp.dataset.d];
      else p.tiers[inp.dataset.d] = inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-ldpt]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S.libDraft.plans[Number(sel.dataset.ldpt)].type = sel.value; render();
    });
  });
  document.querySelectorAll('[data-goal]').forEach(gsel=>{
    gsel.addEventListener('change', ()=>{
      const onLive = S.phase === 'live' && gsel.dataset.fid === 'live-goal';
      if(S.published && !onLive && S.setupEdit !== 'all') return;
      const prev = S.exp.goal;
      S.exp.goal = gsel.value || null;
      if(S.published && S.setupEdit === 'all' && !onLive){
        render();
        const g = goalOf();
        if(g) toast(`Measuring ${g.name}. Baseline ${formatMetricValue(goalBaseline(g),g)}.`);
        return;
      }
      if(S.published && onLive && prev && prev !== S.exp.goal){
        S.goalChanges = S.goalChanges || [];
        S.goalChanges.push({day: liveDayCount(), from: prev, to: S.exp.goal});
        if(S.report) S.report.analysis = '';
      }
      save(); render();
      const g = goalOf();
      if(g) toast(`Measuring ${g.name}. Baseline ${formatMetricValue(goalBaseline(g),g)}.`);
    });
  });

  /* goal editor fields, shared by the library detail (ldg) and the full page builder (gd) */
  const goalDraftFor = pfx => pfx === 'gd' ? S.focus : S.libDraft;
  ['ldg','gd'].forEach(pfx=>{
    const st = document.querySelector(`[data-${pfx}s]`);
    if(st) st.addEventListener('change', ()=>{
      const f = goalDraftFor(pfx); if(!f) return;
      f.start = st.value;
      if(stepIdx(f.event) <= stepIdx(f.start)){
        const nxt = FUNNEL[stepIdx(f.start)+1];
        if(nxt) f.event = nxt.id;
      }
      render();
    });
    const ev = document.querySelector(`[data-${pfx}e]`);
    if(ev) ev.addEventListener('change', ()=>{
      const f = goalDraftFor(pfx); if(!f) return;
      f.event = ev.value; render();
    });
      const win = document.querySelector(`[data-${pfx}w]`);
    if(win) win.addEventListener('input', ()=>{
      const f = goalDraftFor(pfx); if(!f) return;
      f.window = win.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-metric-field]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const f=inp.dataset.pfx==='gd'?S.focus:S.libDraft;
      if(!f) return;
      f[inp.dataset.metricField]=inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-gdf]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      if(!S.focus) return;
      S.focus[inp.dataset.gdf] = inp.value;
      patchBuilderGate();
    });
  });

  const ldm = document.querySelector('[data-ldm]');
  if(ldm) ldm.addEventListener('change', ()=>{ S.libDraft.medication = ldm.value; render(); });
  const ldr = document.querySelector('[data-ldr]');
  if(ldr) ldr.addEventListener('change', ()=>{ S.libDraft.region = ldr.value; render(); });

  const rq = document.querySelector('[data-rq]');
  if(rq) rq.addEventListener('input', ()=>{
    S.ruleQuery = rq.value;
    const list = document.getElementById('ruleList');
    if(list){ list.innerHTML = ruleListInner(); }
    const c = document.getElementById('ruleCount');
    if(c) c.textContent = `${ruleMatches().length} of ${EXTRA_PROPS.length} shown`;
    if(list) list.querySelectorAll('[data-act="add-rule-do"]').forEach(rowNode=>{
      rowNode.addEventListener('click', ()=>{
        S.exp.audience.extra.push(rowNode.dataset.r);
        save(); render(); toast('Rule layer added.');
      });
    });
  });
}

/* boot */
S.exp = newExperiment();
S.exp.key = nextExpKey();
syncExpName();
render();
</script>
</body>
</html>
