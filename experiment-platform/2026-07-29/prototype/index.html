<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment platform · clickable prototype</title>
<style>
:root{
  --ink:#16211d; --ink2:#54635d; --ink3:#8b9691;
  --line:#e3e8e6; --line2:#d2dad7;
  --bg:#f7f9f8; --panel:#fff;
  --accent:#0f6b52; --accent-d:#0b543f; --accent-s:#e4f0ec;
  --hot:#b8501c; --hot-s:#fdf1e8;
  --amber:#8a6a12; --amber-s:#fbf3dc;
  --blue:#2f62c4; --blue-s:#eef3fc;
  --purple:#6b3fa0; --purple-d:#542f82; --purple-s:#f3ecf9;
  --nav:#12211c;
  --r:10px;
  --sh:0 1px 2px rgba(18,33,28,.05);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}

/* ---------- shell ---------- */
.shell{display:flex;height:100vh;overflow:hidden}
.nav{width:198px;background:var(--nav);color:#a9c2b8;padding:16px 12px;flex-shrink:0;display:flex;flex-direction:column}
.nav .logo{color:#fff;font-weight:650;font-size:14px;margin-bottom:20px;padding:0 8px;display:flex;align-items:center;gap:8px}
.nav .logo i{width:20px;height:20px;border-radius:6px;background:var(--accent);display:block}
.nav .logo img{width:22px;height:22px;border-radius:6px;background:#fff;object-fit:contain;padding:1px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:7px;
  color:#9ab5aa;text-decoration:none;margin-bottom:2px;font-size:13px;cursor:pointer}
.nav a:hover{background:#1a2f28;color:#d3e3dc}
.nav a.on{background:#1e3830;color:#fff;font-weight:550}
.nav .grp{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#5d786e;margin:16px 0 6px;padding:0 9px;font-weight:700}
.nav .count{font-size:11px;color:#6f8b80}
.nav .foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:8px 9px;border-top:1px solid #1e332c;font-size:12px}
.nav .av{width:24px;height:24px;border-radius:99px;background:#2c4a3f;color:#cfe0d9;display:flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:700}

.stage{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);position:relative}
.content{flex:1;overflow-y:auto;padding:22px;position:relative}
.content-inner{max-width:1180px;margin:0 auto}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:7px 13px;font-size:13px;
  font-weight:550;border:1px solid transparent;background:transparent;color:var(--ink2);transition:.12s;white-space:nowrap}
.btn:hover{background:#eef1f0}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.pri:disabled,.btn.pri.is-off{background:#c8d4cf;color:#f2f6f4;cursor:not-allowed}
.btn.sec{background:#fff;border-color:var(--line2);color:var(--ink)}
.btn.sec:hover{background:#f4f7f6;border-color:#b9c4c0}
.btn.sec:disabled{color:var(--ink3);cursor:not-allowed;background:#f6f8f7}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.xs{padding:3px 7px;font-size:11px;border-radius:5px}
.btn.danger{color:#fff;background:var(--hot);border-color:var(--hot)}
.btn.danger:hover{background:#9a4014;border-color:#9a4014;color:#fff}
.btn.danger.xs{background:transparent;color:var(--hot);border-color:transparent}
.btn.danger.xs:hover{background:var(--hot-s);border-color:transparent;color:var(--hot)}
.btn.pub{background:var(--purple);color:#fff;font-size:15px;font-weight:650;padding:14px 28px;
  border-radius:10px;box-shadow:0 4px 14px rgba(107,63,160,.28)}
.btn.pub:hover{background:var(--purple-d)}
.btn.pub:disabled{background:#d4c6e4;color:#f7f2fb;cursor:not-allowed;box-shadow:none}
.btn.amp{background:#005ff9;color:#fff;font-weight:600;border-color:#005ff9}
.btn.amp:hover{background:#004fd1}
.btn.ampout{background:#005ff9;color:#fff;border-color:#005ff9;font-weight:600;text-decoration:none}
.btn.ampout:hover{background:#004fd1;text-decoration:none}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 10px;border-radius:99px;
  background:#edf1ef;color:var(--ink2);font-weight:550;white-space:nowrap;border:1px solid transparent;
  font-family:inherit;line-height:1.5}
.chip.g{background:var(--accent-s);color:var(--accent)}
.chip.h{background:var(--hot-s);color:var(--hot)}
.chip.a{background:var(--amber-s);color:var(--amber)}
.chip.b{background:var(--blue-s);color:var(--blue)}
.chip.p{background:var(--purple-s);color:var(--purple)}
.chip.out{background:transparent;border:1px dashed var(--line2);color:var(--ink3)}
.chip.pick{cursor:pointer;transition:.12s;border:1px solid var(--line2);background:#fff;color:var(--ink2)}
.chip.pick:hover{border-color:var(--ink3);background:#f4f7f6}
.chip.pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.rm{cursor:pointer}
.chip .x{opacity:.5;font-weight:700}
.chip .x:hover{opacity:1}

.dot{width:6px;height:6px;border-radius:99px;background:var(--hot);display:inline-block;flex-shrink:0}
.info{width:14px;height:14px;border-radius:99px;background:#e7ecea;color:var(--ink3);font-size:9px;
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;cursor:help;position:relative}
.info.down:hover::after{bottom:auto;top:130%}
.info:hover::after{content:attr(data-t);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);
  background:var(--nav);color:#e4ede9;padding:7px 10px;border-radius:7px;font-size:11.5px;font-weight:400;
  width:210px;line-height:1.45;z-index:200;letter-spacing:0;text-align:left;box-shadow:0 4px 14px rgba(0,0,0,.16)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.h5{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:0}
.k{font-size:12px;color:var(--ink3)}
.v{font-size:13.5px;font-weight:550}

.flab{font-size:11.5px;color:var(--ink3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.fld{width:100%;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:8px 11px;
  font-size:13.5px;color:var(--ink);outline:none;transition:.12s}
.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,82,.09)}
.fld::placeholder{color:#a8b2ae}
.fld.lock{background:#f2f5f4;color:var(--ink2);border-style:dashed}
.fld.ana-inp{width:52px;padding:4px 6px;font-size:12px;text-align:center;flex-shrink:0}
.fld.ana-inp:disabled{background:#f2f5f4;color:var(--ink2);cursor:default;opacity:1}
.fld.inline{border:1px solid transparent;background:transparent;padding:2px 6px;font-weight:650;font-size:13px;
  border-radius:6px;width:auto;min-width:40px;max-width:140px}
.fld.inline:hover{border-color:var(--line2);background:#fff}
.fld.inline:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(15,107,82,.09)}
.row{display:flex;gap:11px} .row>*{flex:1}
.sep{height:1px;background:var(--line);margin:12px 0}
.sel{background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font-size:13px;
  color:var(--ink);outline:none}
.sel:focus{border-color:var(--accent)}
.sel.sm{padding:3px 7px;font-size:11.5px;border-radius:6px}

/* ---------- global analysis bar ---------- */
.anabar{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;
  margin-bottom:14px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--sh)}
.anabar .al{font-size:11.5px;color:var(--ink3);font-weight:600}
.anabar .ag{display:flex;align-items:center;gap:7px}

/* ---------- document layout ---------- */
.doc-wrap{display:flex;gap:22px;align-items:flex-start}
.page-head{max-width:1180px;margin:0 auto 14px;display:flex;justify-content:space-between;
  align-items:center;gap:16px;padding:14px 17px;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh)}
.page-head .title{display:flex;align-items:flex-start;gap:11px;min-width:0}
.page-head h1{font-size:18px;margin:0;line-height:1.25;overflow-wrap:anywhere}
.page-head .meta{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.4}
.page-head .actions{display:flex;gap:8px;align-items:center;flex-shrink:0}
.lockban{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;
  background:#eef6f3;border:1px solid #c5ddd3;margin-bottom:14px}
.lockban .bt{font-size:13px;font-weight:650}
.lockban .bd{font-size:12px;color:var(--ink2);margin-top:2px}
.lockban.draftban,.lockban.liveeditban{background:#bfdbfe;border-color:#60a5fa}
.lockban.draftban .bt,.lockban.liveeditban .bt{color:#1e3a8a}
.lockban.draftban .btn.pri,.lockban.liveeditban .btn.pri{background:var(--blue);border-color:var(--blue)}
.lockban.draftban .btn.pri:hover,.lockban.liveeditban .btn.pri:hover{background:#254fa8;border-color:#254fa8}
.changelog{display:flex;flex-direction:column;gap:9px;margin-top:13px}
.changeitem{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fbfcfc}
.changeitem .ct{font-size:12.5px;font-weight:650}
.changeitem .cd{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.5}
.rail{width:206px;flex-shrink:0;position:sticky;top:0}
.rail a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:7px;
  font-size:13px;color:var(--ink2);text-decoration:none;margin-bottom:2px;cursor:pointer}
.rail a:hover{background:#ecf0ee}
.rail a.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--sh);border:1px solid var(--line)}
.rail a.locked{color:#b6bfbb;cursor:not-allowed}
.rail a.locked:hover{background:transparent}
.rail a .num{width:19px;height:19px;border-radius:99px;background:#e7ecea;color:var(--ink3);font-size:10px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.rail a.on .num{background:var(--accent);color:#fff}
.rail a.done .num{background:var(--accent-s);color:var(--accent)}
.rail a.locked .num{background:#f0f3f2;color:#c3ccc8}
.rail a .lbl{flex:1}
.rail a .warn{color:var(--amber);font-weight:700;font-size:12px}
.railnote{margin-top:12px;padding:0 3px;font-size:11.5px;color:var(--ink3);line-height:1.5}
.prog{height:4px;background:#e7ecea;border-radius:99px;margin:0 3px 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}

/* phase cards in the rail */
.phcard{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 11px;
  margin-bottom:8px;background:#fff;cursor:pointer;text-decoration:none;color:inherit;
  transition:.12s;box-shadow:var(--sh)}
.phcard:hover{border-color:#b3c8c0}
.phcard.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,82,.08)}
.phcard.locked{opacity:.45;cursor:not-allowed;background:#fbfcfc;box-shadow:none}
.phcard.locked:hover{border-color:var(--line)}
.phcard .phn{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:2px}
.phcard.on .phn{color:var(--accent)}
.phcard .pht{font-size:13px;font-weight:650;color:var(--ink)}
.phcard .phs{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.35}
.phcard .phlock{font-size:10.5px;color:var(--ink3);margin-top:5px}
.phsubs{margin:6px 0 2px;padding-left:2px}
.phsubs a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;
  font-size:12.5px;color:var(--ink2);text-decoration:none;margin-bottom:1px;cursor:pointer}
.phsubs a:hover{background:#ecf0ee}
.phsubs a.on{background:var(--accent-s);color:var(--accent);font-weight:600}
.phsubs a .dot{width:6px;height:6px;border-radius:99px;background:#c5cec9;flex-shrink:0}
.phsubs a.on .dot{background:var(--accent)}

.setupsum{display:flex;flex-direction:column;gap:10px}
.setupsum .rowline{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
.setupsum .lbl{width:74px;flex-shrink:0;font-size:12px;color:var(--ink3);padding-top:3px}
.stg.editing{border-color:#b3c8c0;box-shadow:0 0 0 3px rgba(15,107,82,.08)}

/* live board */
.livegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.livestat{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px 13px}
.livestat .k{font-size:11px;color:var(--ink3);font-weight:550}
.livestat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.livestat .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.ov-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ov-primary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
@media (max-width:1100px){.ov-primary{grid-template-columns:repeat(2,1fr)}}
.ov-primary .ovp{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 14px;box-shadow:var(--sh)}
.ov-primary .ovp .k{font-size:11.5px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ov-primary .ovp .v{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:6px;line-height:1.1}
.ov-primary .ovp .s{font-size:12px;color:var(--ink3);margin-top:6px}
.ov-secondary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:4px}
.ov-secondary .ovs{background:#fbfcfc;border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.ov-secondary .ovs .k{font-size:11px;color:var(--ink3);font-weight:550}
.ov-secondary .ovs .v{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.ov-secondary .ovs .s{font-size:11px;color:var(--ink3);margin-top:3px}
.ov-tertiary{display:flex;flex-wrap:wrap;gap:8px 20px;padding-top:14px;margin-top:14px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink3);line-height:1.5}
.ov-tertiary .ovt{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.ov-tertiary .ovt b{color:var(--ink2);font-weight:600;font-size:12.5px}
@media (max-width:900px){
  .ov-primary,.ov-secondary{grid-template-columns:1fr}
}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  margin-bottom:13px;box-shadow:var(--sh)}
.chartbox .ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.chartbox .ct{font-size:13.5px;font-weight:650}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.leg i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chartsvg{width:100%;height:220px;display:block}
.rangepick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rangepick button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;
  font:inherit;font-size:12px;color:var(--ink2);cursor:pointer}
.rangepick button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.livestatus{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--accent-s);border:1px solid #c5ddd4;border-radius:var(--r);padding:14px 16px;
  margin-bottom:13px;box-shadow:var(--sh)}
.livestatus .lhs{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.livestatus .rhs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.livestatus.paused{background:var(--amber-s);border-color:#e2cf93}
.livestatus.retired{background:#f3f5f4;border-color:var(--line)}
.reportctrl{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;
  margin-bottom:16px;box-shadow:var(--sh)}
.reportctrl .rch{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.reportctrl .rct{font-size:15px;font-weight:700;letter-spacing:-.01em}
.reportctrl .rcbody{display:flex;flex-direction:column;gap:14px}
.reportctrl .rcgoal{background:var(--accent-s);border:1px solid #c5ddd4;border-radius:10px;padding:13px 14px}
.reportctrl .rcgoal .flab{color:var(--accent);font-weight:700}
.livetool{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;
  margin-bottom:13px;box-shadow:var(--sh)}
.livetool .lhs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.livetool .rhs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datepair{display:flex;align-items:center;gap:6px}
.datepair input[type=date]{border:1px solid var(--line2);border-radius:8px;padding:5px 8px;
  font:inherit;font-size:12px;color:var(--ink)}
.btn.ampsolid{background:#005ff9;color:#fff;font-weight:600;border-color:#005ff9}
.btn.ampsolid:hover{background:#004fd1}
.btn.ampsolid .amplogo{width:14px;height:14px;display:inline-block;vertical-align:-2px}
.livesum{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:900px){.livesum{grid-template-columns:1fr}}
.livesum .nums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.livesum .num{background:#fbfcfc;border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.livesum .num .k{font-size:11px;color:var(--ink3);font-weight:550}
.livesum .num .v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.livesum .num .s{font-size:11.5px;color:var(--ink3);margin-top:2px}
.trafsum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trafsum .ts{background:#fbfcfc;border:1px solid var(--line);border-radius:9px;padding:11px 12px}
.trafsum .ts .k{font-size:11px;color:var(--ink3)}
.trafsum .ts .v{font-size:18px;font-weight:700;margin-top:3px}
.livetable{width:100%;border-collapse:collapse;font-size:13px;table-layout:auto}
.livetable th{text-align:left;font-size:11px;color:var(--ink3);font-weight:600;padding:0 10px 8px;
  border-bottom:1px solid var(--line);white-space:nowrap}
.livetable td{padding:10px;border-bottom:1px solid #eef1f0;vertical-align:middle;white-space:nowrap}
.livetable td.ci-cell{white-space:normal;width:100%;padding-right:16px}
.livetable th.ci-col{width:100%}
.livetable .ci-cell .ciwrap{padding-top:22px;margin:0}
.livetable .ci-cell .citrack{width:100%;min-width:160px}
.livetable tr:last-child td{border-bottom:0}
.swatch{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px}

/* reporting / share cards */
.sharegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sharecard{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;
  box-shadow:var(--sh)}
.sharecard canvas{width:100%;height:auto;display:block;background:#0f1f1a}
.sharecard .sa{padding:10px 12px;display:flex;gap:7px;align-items:center;border-top:1px solid var(--line)}
.slackprev{background:#1a1d21;color:#e8e8e8;border-radius:10px;padding:14px 16px;font-size:13px;
  line-height:1.55;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.notionmap{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}
.notionmap .nk{color:var(--ink3);font-weight:550}
.notionmap .nv{font-weight:600}

.doc{flex:1;min-width:0}
.stg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;
  margin-bottom:13px;box-shadow:var(--sh);scroll-margin-top:12px}
.stg.act{border-color:#b3c8c0;box-shadow:0 0 0 3px rgba(15,107,82,.055)}
.stg.locked{background:#fbfcfc;border-style:dashed;box-shadow:none;padding:14px 19px}
.stg.locked .nm{color:var(--ink3);font-weight:600}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.stg.locked .sec-h{margin-bottom:0}
.sec-h .nm{font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.sec-h .nm .sn{width:20px;height:20px;border-radius:99px;background:var(--accent-s);color:var(--accent);
  font-size:10.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.stg.locked .sec-h .nm .sn{background:#f0f3f2;color:#c3ccc8}
.sec-h .rt{display:flex;gap:7px;align-items:center}
.sec-f{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px;
  padding-top:14px;border-top:1px solid var(--line)}

/* ---------- variant cards ---------- */
.vcard{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:9px;background:#fff}
.vcard.ctrl{background:#fbfcfc}
.vcard.diff{border-color:#e5bb9c;background:#fffaf6}
.vcard.aa{border-color:#e2cf93;background:#fdfaf1}
.vcard-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.slots{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.slot{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;
  padding:6px 10px;font-size:12.5px;background:#fff;cursor:pointer;transition:.12s;
  font-family:inherit;color:var(--ink);text-align:left}
.slot:hover{border-color:var(--ink3);background:#f7f9f8}
.slot.new{border-color:#dda87f;background:var(--hot-s);color:var(--hot)}
.slot.add{border-style:dashed;color:var(--ink3)}
.slot .pm{font-size:11px;color:var(--ink3)}

/* ---------- compare grid ---------- */
.grid{display:grid;column-gap:8px;overflow-x:auto;align-items:start}
.gh,.colh{height:34px;display:flex;align-items:center;gap:7px;justify-content:space-between}
.gh{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.gl{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px;height:46px;margin-bottom:8px}
.cel{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 11px;height:46px;margin-bottom:8px;
  display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.3;overflow:hidden}
.cel .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.cel.same{background:#f5f8f7;border-style:dashed;color:#7b8985}
.cel.none{color:var(--ink3)}
.cel.diff{border-color:#dda87f;background:#fff8f3}
.grid-actions{height:34px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ---------- funnel / traffic ---------- */
.fun{display:flex;gap:2px;height:36px;border-radius:8px;overflow:hidden}
.fun i{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-style:normal;
  color:#fff;font-weight:600;transition:flex .25s ease;min-width:0;overflow:hidden;white-space:nowrap}
.fun .o{background:#e3e8e6;color:var(--ink3)}
input[type=range]{width:100%;accent-color:var(--accent);height:22px;cursor:grab;margin:0}
input[type=range]:active{cursor:grabbing}
.splits{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.splitrow{display:flex;align-items:center;gap:12px}
.splitrow .sl{width:72px;font-weight:600;font-size:13px}
.splitrow .sr{width:56px;text-align:right;font-weight:650}
.goalstrip{border:1px solid var(--line);border-radius:9px;padding:13px 15px;margin-top:10px;background:#fbfcfc}
.gsteps{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.gsteps .gs{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;
  font-size:12.5px;font-weight:600}
.gsteps .gs.on{border-color:var(--accent);color:var(--accent);background:var(--accent-s)}
.gsteps .garr{color:var(--ink3);font-size:13px}
.gfacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gfacts .gf .mv{font-size:17px;font-weight:650;letter-spacing:-.02em}
.gfacts .gf .ml{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.35}
.mdebox{border:1px solid var(--line);border-radius:9px;padding:16px 17px;margin-top:14px;background:#fbfcfc}
.mde-row{display:grid;grid-template-columns:1fr 1.15fr 1.15fr;gap:12px;margin:12px 0 10px}
.mde-row .mm{padding:4px 2px}
.mde-row .mm .mv{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.mde-row .mm .ml{font-size:11.5px;color:var(--ink3);margin-top:3px;font-weight:550}
.mde-row .mm.lock .mv{color:var(--ink2);font-size:22px;font-weight:650}
.mde-row .mm.lock .ml{color:var(--ink3)}
.mde-row .mm.want .mv{color:var(--ink)}
.mde-row .mm.want .ml{color:var(--ink2)}
.mde-row .mm input.fld{font-size:22px;font-weight:700;letter-spacing:-.03em;padding:4px 8px;width:100%}
.codeprev{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;font-weight:650;
  letter-spacing:-.01em;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:#fbfcfc;
  margin-top:12px;line-height:1.45}
.codeprev .dim{color:var(--ink3);font-weight:500}
.codewarn{font-size:11.5px;color:var(--amber);margin-top:5px;font-weight:550}
.fld.codewarn{border-color:#d4b86a;box-shadow:0 0 0 2px rgba(138,106,18,.1)}
.fld.err,.sel.err{border-color:#c45a3a !important;box-shadow:0 0 0 2px rgba(196,90,58,.14) !important}
.fielderr{font-size:11.5px;color:#c45a3a;margin-top:5px;font-weight:550}
.vcard.err{border-color:#c45a3a;box-shadow:0 0 0 2px rgba(196,90,58,.12)}
.slot.err,.empty.err{border-color:#c45a3a !important;color:#c45a3a}
.codecustom .k{font-size:11px;white-space:nowrap}
.codeprev .ok{color:var(--ink)}
.codegroup{margin-bottom:12px}
.codegroup .flab{margin-bottom:6px}
.mdeout{display:flex;gap:14px;margin-top:4px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.mdeout .mo{flex:1;min-width:120px}
.mdeout .mv{font-size:18px;font-weight:650;letter-spacing:-.02em;color:var(--ink2)}
.mdeout .ml{font-size:11.5px;color:var(--ink3);margin-top:2px}

/* ---------- launch checklist ---------- */
.ckl{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:13px}
.ck{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:#fff}
.ck:last-child{border-bottom:0}
.ck.no{background:#fffdf7}
.cki{width:20px;height:20px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0}
.ck.ok .cki{background:var(--accent-s);color:var(--accent)}
.ck.no .cki,.ck.warn .cki{background:var(--amber-s);color:var(--amber)}
.ckb{flex:1;min-width:0}
.ckt{font-size:13px;font-weight:550}
.ckd{font-size:11.5px;color:var(--ink3);margin-top:1px;line-height:1.45}
.pubbox{border:1px solid var(--line);border-radius:12px;padding:18px 20px;background:#fff;
  display:flex;flex-direction:column;gap:16px}
.pubbox .envs{display:flex;gap:10px;flex-wrap:wrap}
.envchip{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--line2);
  border-radius:9px;cursor:pointer;background:#fff;font-weight:550;font-size:13.5px;transition:.12s}
.envchip:hover{border-color:var(--ink3)}
.envchip.on{border-color:var(--purple);background:var(--purple-s);color:var(--purple)}
.envchip .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700}
.envchip.on .box{background:var(--purple);border-color:var(--purple);color:#fff}

/* ---------- popover ---------- */
.pop-bg{position:fixed;inset:0;background:rgba(18,33,28,.28);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px}
.pop{background:#fff;border-radius:14px;width:min(520px,100%);max-height:84vh;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(18,33,28,.28);overflow:hidden}
.pop-h{padding:15px 18px;border-bottom:1px solid var(--line);flex-shrink:0}
.pop-h .t{font-size:15px;font-weight:650}
.pop-b{padding:14px 18px;overflow-y:auto;flex:1;min-height:0}
.pop.wide{width:min(680px,100%)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;
  font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-s)}

/* live pulse, brand marks */
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:650;color:var(--accent);
  background:var(--accent-s);border:1px solid #c5ddd4;border-radius:99px;padding:7px 14px 7px 12px;white-space:nowrap}
.pulse i{width:9px;height:9px;border-radius:99px;background:var(--accent);position:relative;flex-shrink:0}
.pulse i::after{content:'';position:absolute;inset:-5px;border-radius:99px;border:1.5px solid var(--accent);
  opacity:.55;animation:ping 1.7s cubic-bezier(.2,.6,.3,1) infinite}
.pulse.off i{background:var(--ink3)}
.pulse.off i::after{display:none}
@keyframes ping{0%{transform:scale(.6);opacity:.6}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}
.bmark{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;
  object-fit:contain;padding:2px;flex-shrink:0}
.bmark.sm{width:22px;height:22px;border-radius:6px}

/* AI assistant in the nav */
.nav .ai{margin-top:10px;margin-bottom:4px;display:flex;align-items:flex-start;gap:8px;
  padding:10px 11px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;
  font-weight:600;cursor:pointer;border:0;width:100%;font:inherit;text-align:left}
.nav .ai:hover{filter:brightness(1.06)}
.nav .ai i{width:8px;height:8px;border-radius:99px;background:#7fd8b8;flex-shrink:0;
  box-shadow:0 0 0 3px rgba(127,216,184,.25)}
.nav .ai span{flex:1}
.nav .ai .sub{display:block;font-size:10.5px;font-weight:500;opacity:.8;margin-top:1px}

/* agent chat sidebar, sits beside .stage inside .shell and pushes content left */
.chat{width:min(400px,34vw);flex-shrink:0;background:#fff;border-left:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;height:100vh}
.chat-h{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-h .t{font-size:14px;font-weight:650}
.chat-b{flex:1;overflow-y:auto;padding:14px 15px;display:flex;flex-direction:column;gap:11px;background:#fbfcfc}
.msg{max-width:92%;font-size:13px;line-height:1.5;padding:9px 12px;border-radius:11px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:4px}
.msg.ag{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.tool{align-self:stretch;max-width:100%;background:#f3f6f5;border:1px dashed var(--line2);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--ink2);white-space:pre-wrap}
.propose{background:#fff;border:1px solid var(--accent);border-radius:11px;padding:12px 13px;align-self:stretch}
.propose .pt{font-size:12.5px;font-weight:650;margin-bottom:7px}
.propose .prow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0}
.propose .prow span:first-child{color:var(--ink3)}
.propose .prow span:last-child{font-weight:600;text-align:right}
.propose .pacts{display:flex;gap:7px;margin-top:10px}
.chat-f{border-top:1px solid var(--line);padding:11px 13px;background:#fff}
.chat-f .qk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.chat-f .qk button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;
  font:inherit;font-size:11.5px;color:var(--ink2);cursor:pointer}
.chat-f .qk button:hover{border-color:var(--accent);color:var(--accent)}
.chat-in{display:flex;gap:8px;align-items:flex-end}
.chat-in textarea{flex:1;resize:none;border:1px solid var(--line2);border-radius:9px;padding:9px 10px;
  font:inherit;font-size:13px;min-height:40px;max-height:120px;outline:none}
.chat-in textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,82,.08)}
.pop-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;background:#fafbfb;flex-shrink:0;gap:8px}
.pop-f .btn.pri{margin-left:auto}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s;background:#fff}
.opt:hover{border-color:var(--ink3);background:#f7f9f8}
.opt.dis{opacity:.5;cursor:not-allowed}
.opt .on{font-size:13.5px;font-weight:600}
.opt .od{font-size:11.5px;color:var(--ink3);margin-top:2px}
.opt.create{border-style:dashed;border-color:var(--accent);color:var(--accent);background:var(--accent-s)}
.opt.create .on{color:var(--accent)}
.scrollist{max-height:404px;overflow-y:auto;padding-right:5px;margin-right:-5px}
.scrollist .opt{margin-bottom:8px}
.scrollist .opt:last-child{margin-bottom:0}

/* ---------- GTM overlay: dark scrim on the left, panel fills the rest ---------- */
.gtm{position:absolute;inset:0;z-index:50;display:flex;justify-content:flex-end;
  background:rgba(18,33,28,.55);animation:gfade .18s ease}
.gtm.out{animation:gfadeout .18s ease forwards}
.gtm-panel{background:var(--bg);height:100%;display:flex;flex-direction:column;width:calc(100% - 64px);
  box-shadow:-12px 0 40px rgba(18,33,28,.28);animation:gin .2s cubic-bezier(.2,.85,.25,1)}
.gtm.out .gtm-panel{animation:gout .18s cubic-bezier(.2,.85,.25,1) forwards}
@keyframes gin{from{transform:translateX(48px);opacity:.4}to{transform:none;opacity:1}}
@keyframes gout{from{transform:none;opacity:1}to{transform:translateX(48px);opacity:.2}}
@keyframes gfade{from{background:rgba(18,33,28,0)}to{background:rgba(18,33,28,.55)}}
@keyframes gfadeout{from{background:rgba(18,33,28,.55)}to{background:rgba(18,33,28,0)}}
.gtm-top{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;
  justify-content:space-between;align-items:center;gap:16px;flex-shrink:0}
.gtm-body{flex:1;overflow-y:auto;padding:20px}
.gtm-inner{max-width:1060px;margin:0 auto;display:flex;gap:18px;align-items:flex-start}
.gtm-inner.solo{max-width:760px;display:block}
.crumb{font-size:11.5px;color:var(--ink3);display:flex;gap:6px;align-items:center;margin-bottom:3px}
.crumb b{color:var(--ink2);font-weight:600}

.phone{width:230px;flex-shrink:0;background:#fff;border:1px solid var(--line2);border-radius:22px;
  padding:16px 14px 18px;box-shadow:0 6px 22px rgba(18,33,28,.08);position:sticky;top:0}
.phone .nub{width:52px;height:4px;background:#e0e5e3;border-radius:9px;margin:0 auto 14px}
.pl{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:9px;transition:.15s}
.pl.on{border-color:var(--accent);background:var(--accent-s);box-shadow:0 0 0 2px rgba(15,107,82,.08)}
.pl .pt{font-size:12.5px;font-weight:650;display:flex;justify-content:space-between;align-items:center;gap:6px}
.pl .pp{font-size:19px;font-weight:700;letter-spacing:-.02em;margin-top:3px}
.pl .pp span{font-size:11.5px;font-weight:500;color:var(--ink3)}
.pl .pm{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.4}

/* ---------- plan editor ---------- */
.plan{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-bottom:9px;background:#fff}
.plan-h{display:flex;gap:9px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.doses{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px}
.dose .dl{font-size:11px;color:var(--ink3);margin-bottom:4px}
.dose input{width:100%;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;
  font-size:13px;outline:none;text-align:right}
.dose input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,107,82,.09)}
.sfx{position:relative;flex-shrink:0}
.sfx span{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:12.5px;
  pointer-events:none}
.sfx input{padding-right:23px;text-align:right;width:100%;font-weight:650}
.sfx input::-webkit-outer-spin-button,.sfx input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.pfx{position:relative}
.pfx span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px}
.pfx input{padding-left:22px;text-align:left}
.seg{display:inline-flex;background:#eef1f0;border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink3);font-size:12px;font-weight:600;
  padding:5px 11px;border-radius:6px;transition:.12s}
.seg button:hover{color:var(--ink2)}
.seg button.on{background:#fff;color:var(--accent);
  box-shadow:0 1px 2px rgba(18,33,28,.12),0 0 0 1px rgba(18,33,28,.07)}

/* ---------- library master-detail ---------- */
.lib-split{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;min-height:520px}
.lib-list{width:340px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.lib-list-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.lib-rows{flex:1;overflow-y:auto}
.lib-row{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
.lib-row:hover{background:#f7f9f8}
.lib-row.on{background:var(--accent-s);border-left:3px solid var(--accent);padding-left:11px}
.lib-row .rn{font-weight:600;font-size:13.5px}
.lib-row .rm{font-size:11.5px;color:var(--ink3);margin-top:2px}
.lib-detail{flex:1;min-width:0;overflow-y:auto;padding:18px 20px;background:#fbfcfc}
.lib-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink3);
  font-size:13px;text-align:center;padding:40px;line-height:1.6}

/* ---------- tables (legacy bits) ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;padding:0 12px 9px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .nmc{font-weight:600}

/* ---------- dashboard result cards ---------- */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(332px,1fr));gap:14px}
.dc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;box-shadow:var(--sh);
  cursor:pointer;transition:.14s;display:flex;flex-direction:column}
.dc:hover{border-color:#b9c4c0;box-shadow:0 4px 14px rgba(18,33,28,.07);transform:translateY(-1px)}
.brand{width:24px;height:24px;border-radius:7px;color:#fff;font-size:10px;display:inline-flex;
  align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.dc-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:13px}
.dct{font-size:14px;font-weight:650;line-height:1.3;letter-spacing:-.005em}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:15px}
.tile{border-radius:9px;padding:13px 10px;text-align:center}
.tile .tv{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.tile .tl{font-size:11px;color:var(--ink3);margin-top:4px}
.t-win{background:var(--accent-s)}   .t-win .tv{color:var(--accent)}
.t-loss{background:var(--hot-s)}     .t-loss .tv{color:var(--hot)}
.t-flat{background:var(--blue-s)}    .t-flat .tv{color:var(--blue)}
.t-early{background:var(--amber-s)}  .t-early .tv{color:var(--amber)}

<body>

<div id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* =====================================================================
   REFERENCE DATA
   ===================================================================== */
let CARE = {
  dietitian:{id:'dietitian', name:'Dietitian consult', kind:'Consult', mode:'included', price:0,
    note:'30 minutes, monthly'},
  longevity:{id:'longevity', name:'Longevity consult', kind:'Consult', mode:'addon', price:79,
    note:'One off, practitioner led'},
  shake:{id:'shake', name:'Protein shake', kind:'Product', mode:'addon', price:39,
    note:'Shipped monthly with treatment'},
  bloods:{id:'bloods', name:'Blood panel', kind:'Test', mode:'included', price:0,
    note:'Baseline and month three'}
};

const DOSES = {
  'Semaglutide':['0.25 mg','0.5 mg','1.0 mg','1.7 mg','2.4 mg'],
  'Tirzepatide':['2.5 mg','5 mg','7.5 mg','10 mg'],
  'Contrave':['Standard']
};
const PLAN_TYPES = ['Monthly','3-month','6-month','12-month'];
const flat = (type, price) => ({type, mode:'flat', price, tiers:{}});

let library = {
  pkg_basic:{id:'pkg_basic', name:'AU Semaglutide Basic', region:'AU', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('3-month',349), flat('Monthly',399)], care:[], uses:6},
  pkg_maint:{id:'pkg_maint', name:'AU Semaglutide Maintenance', region:'AU', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('3-month',289), flat('Monthly',329)], care:['dietitian'], uses:2},
  pkg_contrave:{id:'pkg_contrave', name:'AU Contrave Standard', region:'AU', vertical:'Weight loss',
    medication:'Contrave', plans:[flat('3-month',219), flat('Monthly',249)], care:[], uses:3},
  pkg_nz:{id:'pkg_nz', name:'NZ Semaglutide Standard', region:'NZ', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('3-month',379), flat('Monthly',419)], care:['bloods'], uses:2},
  pkg_my:{id:'pkg_my', name:'MY Semaglutide Starter', region:'MY', vertical:'Weight loss',
    medication:'Semaglutide', plans:[flat('Monthly',289)], care:[], uses:1}
};

const AUD_GROUPS = [
  {id:'country', label:'Country', opts:['AU','NZ','MY']},
  {id:'brand',   label:'Brand',   opts:['Moshy','Mosh','Mapped']},
  {id:'vertical',label:'Vertical',opts:['Weight loss','Sex','Hair','Skin']},
  {id:'customer',label:'Customer',opts:['New','Returning','Any']}
];

const EXTRA_PROPS = [
  'Device is iOS','Device is Android','Device is desktop','Browser is Safari','Browser is Chrome',
  'Session count is 1','Session count > 1','Session count > 5',
  'Referrer is paid search','Referrer is paid social','Referrer is organic','Referrer is email','Referrer is direct',
  'Has abandoned cart','Has started quiz','Has completed quiz','Quiz outcome is eligible','Quiz outcome is ineligible',
  'Age band 18-24','Age band 25-34','Age band 35-44','Age band 45-54','Age band 55 plus',
  'State is VIC','State is NSW','State is QLD','State is WA','State is SA',
  'Landed on pricing page','Landed on homepage','Landed on product page','Viewed practitioner page',
  'BMI band 25 to 30','BMI band 30 to 35','BMI band 35 plus',
  'Has active subscription','Previously cancelled','Previously paused',
  'Lifetime orders > 3','Lifetime value > $1000','Opted into marketing','Has referral code'
];

/* funnel steps, in order. A conversion goal is one step to a later step.
   wk = observed volume per week across the whole funnel, last 28 days. */
const FUNNEL = [
  {id:'lp_view',    label:'Landing page view',       wk:16700},
  {id:'quiz_start', label:'Consult started',         wk:7100},
  {id:'quiz_done',  label:'Consult submitted',       wk:4200},
  {id:'outcome',    label:'Eligibility outcome sent', wk:3600},
  {id:'plan_view',  label:'Plan assigned',           wk:3100},
  {id:'checkout',   label:'Checkout started',        wk:1400},
  {id:'purchase',   label:'Purchase',                wk:980},
  {id:'activated',  label:'Subscription activated',  wk:910}
];
const stepIdx  = id => FUNNEL.findIndex(f => f.id === id);
const funnelStep = id => FUNNEL[stepIdx(id)] || FUNNEL[0];

let GOALS = {
  goal_lp_purchase:{id:'goal_lp_purchase', name:'Landing page to purchase',
    kind:'binary', start:'lp_view', event:'purchase', window:14, baseline:null, uses:6,
    note:'Default acquisition goal for landing page and quiz entry tests'},
  goal_lp_plan:{id:'goal_lp_plan', name:'Landing page to plan assigned',
    kind:'binary', start:'lp_view', event:'plan_view', window:7, baseline:null, uses:4,
    note:'Faster read, stops short of revenue'},
  goal_quiz:{id:'goal_quiz', name:'Consult start to submitted',
    kind:'binary', start:'quiz_start', event:'quiz_done', window:3, baseline:null, uses:3,
    note:'Screener completion only'},
  goal_plan_purchase:{id:'goal_plan_purchase', name:'Plan assigned to purchase',
    kind:'binary', start:'plan_view', event:'purchase', window:14, baseline:null, uses:2,
    note:'For tests that only change the plan page'},
  goal_aov:{id:'goal_aov', name:'Average order value',
    kind:'continuous', aggregation:'mean', event:'purchase', population:'purchase',
    unit:'AUD', baselineMean:349, baselineSd:118, weeklyObservations:980, uses:2,
    note:'Mean purchase value in AUD'}
};

/* =====================================================================
   STAGES
   ===================================================================== */
const STAGES = [
  {id:'setup',    label:'Name'},
  {id:'goal',     label:'Metric'},
  {id:'audience', label:'Audience'},
  {id:'variants', label:'Variants'},
  {id:'traffic',  label:'Traffic'},
  {id:'launch',   label:'Review'}
];
const stageIdx = id => STAGES.findIndex(s => s.id === id);

const PHASES = [
  {id:'setup',  label:'Experiment setup',     sub:'Name, metric, audience, variants, traffic'},
  {id:'live',   label:'Experiment live',      sub:'Reporting controls, overview, metric trends'},
  {id:'report', label:'Experiment reporting', sub:'Analysis, share cards, Notion'}
];
const LIVE_SECS = [
  {id:'controls',     label:'Reporting controls'},
  {id:'overview',     label:'Overview'},
  {id:'conversion',   label:'Metric trends'}
];
const REPORT_SECS = [
  {id:'analysis', label:'Analysis'},
  {id:'share',    label:'Share cards'},
  {id:'slack',    label:'Slack'},
  {id:'notion',   label:'Notion'}
];
const VAR_COLORS = ['#22c55e', '#ef4444', '#3b82f6', '#f59e0b', '#a855f7', '#06b6d4'];
const phaseUnlocked = id => id === 'setup' || (id === 'live' && S.published) || (id === 'report' && S.retired);

/* shorthand used in the experiment code: [005-MSY-AU-WL-LP] - [Redirect Test] */
const CODE_BRAND = [
  {id:'MSY', label:'Moshy', brand:'Moshy'},
  {id:'MSH', label:'Mosh', brand:'Mosh'},
  {id:'MPD', label:'Mapped', brand:'Mapped'}
];
const CODE_GEO = [
  {id:'AU', label:'Australia'},
  {id:'NZ', label:'New Zealand'},
  {id:'MY', label:'Malaysia'}
];
const CODE_VERT = [
  {id:'WL', label:'Weight loss', vertical:'Weight loss'},
  {id:'SX', label:'Sex', vertical:'Sex'},
  {id:'HL', label:'Hair', vertical:'Hair'},
  {id:'SK', label:'Skin', vertical:'Skin'}
];
const CODE_LOC = [
  {id:'LP', label:'Landing page'},
  {id:'QZ', label:'Quiz'},
  {id:'CK', label:'Checkout'}
];
const CODE_PRESETS = {brand: CODE_BRAND, country: CODE_GEO, vertical: CODE_VERT, location: CODE_LOC};
const CODE_RULES = {
  brand:    {exact: 3, hint:'Exactly 3 letters'},
  country:  {exact: 2, hint:'Exactly 2 letters'},
  vertical: {max: 2,   hint:'Up to 2 letters'},
  location: {max: 2,   hint:'Up to 2 letters'}
};
const CODE_LABELS = {brand:'Brand', country:'Geo', vertical:'Vertical', location:'Location'};
function codePresetIds(field){ return (CODE_PRESETS[field]||[]).map(o=>o.id); }
function ensureCodeCustom(){
  if(!S.exp.codeCustom){
    S.exp.codeCustom = {brand:false, country:false, vertical:false, location:false};
  }
  ['brand','country','vertical','location'].forEach(f=>{
    if(S.exp.codeCustom[f] == null){
      S.exp.codeCustom[f] = !codePresetIds(f).includes(S.exp.code[f]);
    }
  });
}
function sanitizeCode(val, field){
  const r = CODE_RULES[field];
  let s = String(val||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const cap = r.exact || r.max || 2;
  return s.slice(0, cap);
}
function codeFieldWarning(field, val){
  const r = CODE_RULES[field];
  const v = sanitizeCode(val, field);
  if(!v) return 'Enter a code';
  if(r.exact && v.length !== r.exact) return `Must be exactly ${r.exact} characters`;
  return '';
}
function codeSetupIssues(){
  ensureCodeCustom();
  const out = [];
  ['brand','country','vertical','location'].forEach(f=>{
    if(S.exp.codeCustom[f]){
      const w = codeFieldWarning(f, S.exp.code[f]);
      if(w) out.push(`${CODE_LABELS[f]}: ${w}`);
    }
  });
  return out;
}
function expCode(e){
  const c = e.code || {};
  return `${e.key}-${c.brand}-${c.country}-${c.vertical}-${c.location}`;
}
function composeExpName(e){
  const desc = String(e.descriptor || '').trim();
  return desc ? `[${expCode(e)}] - [${desc}]` : '';
}
function expectedAudienceFromCode(){
  ensureCodeCustom();
  const out = {};
  if(!S.exp.codeCustom.brand){
    const brand = CODE_BRAND.find(x => x.id === S.exp.code.brand);
    if(brand && brand.brand) out.brand = brand.brand;
  }
  if(!S.exp.codeCustom.country && S.exp.code.country){
    out.country = S.exp.code.country;
  }
  if(!S.exp.codeCustom.vertical){
    const vert = CODE_VERT.find(x => x.id === S.exp.code.vertical);
    if(vert) out.vertical = vert.vertical;
  }
  return out;
}
function audienceMismatches(){
  const expected = expectedAudienceFromCode();
  const a = S.exp.audience;
  return ['country','brand','vertical']
    .filter(k => expected[k] != null && a[k] !== expected[k])
    .map(k => ({field:k, current:a[k], expected:expected[k], label:k === 'country' ? 'Country' : (k === 'brand' ? 'Brand' : 'Vertical')}));
}
function customCodeAudienceNotes(){
  ensureCodeCustom();
  const notes = [];
  if(S.exp.codeCustom.brand) notes.push('Brand');
  if(S.exp.codeCustom.country) notes.push('Geo');
  if(S.exp.codeCustom.vertical) notes.push('Vertical');
  return notes;
}
function codeFieldToAudience(field){
  if(field === 'brand') return 'brand';
  if(field === 'country') return 'country';
  if(field === 'vertical') return 'vertical';
  return null;
}
function applyAudienceFromCode(fields){
  const expected = expectedAudienceFromCode();
  (fields || Object.keys(expected)).forEach(k=>{
    if(expected[k] != null) S.exp.audience[k] = expected[k];
  });
}
function syncExpName(opts){
  ensureCodeCustom();
  S.exp.name = composeExpName(S.exp);
  // sync only the audience field tied to the changed code, if any
  if(opts && opts.codeField){
    const aud = codeFieldToAudience(opts.codeField);
    if(aud) applyAudienceFromCode([aud]);
  } else if(opts && opts.syncAudience){
    applyAudienceFromCode();
  }
}
function audienceWarningHtml(){
  const mismatches = audienceMismatches();
  const customNotes = customCodeAudienceNotes();
  let html = '';
  if(mismatches.length){
    html += `<div class="banner a" style="margin:12px 0">
      <div style="flex:1">
        <div class="bt">Audience differs from the experiment name code</div>
        <div class="bd">${mismatches.map(m =>
          `${m.label} is <b>${esc(m.current)}</b>, name code expects <b>${esc(m.expected)}</b>`).join(' · ')}.
          Allowed, but keep an eye on reporting filters.</div>
      </div>
      <button class="btn sec sm" data-act="aud-reset">Reset to name code</button>
    </div>`;
  }
  if(customNotes.length){
    html += `<div class="banner" style="margin:12px 0;background:#f3f6f5;border:1px solid var(--line)">
      <div style="flex:1">
        <div class="bt">Custom name code cannot set audience</div>
        <div class="bd">${customNotes.join(', ')} ${customNotes.length===1?'is':'are'} custom in the name.
          Pick a standard audience value separately.</div>
      </div>
    </div>`;
  }
  return html;
}

let S = {
  view:'dashboard',
  dashTab:'running',
  libTab:'packages',
  libSel:null,
  libDraft:null,                // selected package or care product id in master-detail
  focus:null,                 // package draft, only when creating from experiment
  activeSection:'setup',
  maxStage:0,
  phase:'setup',              // setup | live | report
  liveSec:'overview',
  reportSec:'analysis',
  paused:false,
  liveRange:'full',           // 7 | 14 | full | custom
  liveConvChart:'daily',      // daily | cumulative
  liveCompareIdx:1,           // stats index for vs-control comparison
  liveFrom:null,              // day index or ISO date string for custom
  liveTo:null,
  trafficEdit:false,
  trafficSnap:null,
  setupEdit:null,             // setup section id being edited while published
  setupSnap:null,             // full live setup snapshot for cancel
  setupGoalPrev:null,         // previous goal id when starting a goal edit
  sessionDraft:null,          // one in-memory draft slot, never persisted
  hasDraft:false,
  changelog:[],
  liveAnaEdit:false,
  liveAnaSnap:null,
  goalChanges:[],             // {day, from, to} markers on the conversion chart
  report:{analysis:'', slackChannel:'#cro-experiments', slackPosted:false, notionSynced:null},
  compare:true,
  ruleQuery:'',
  saving:false,
  modal:null,
  exp:null,
  published:false,
  retired:false,
  chat:{open:false, input:'', msgs:[], pending:null},
  // global analysis settings: drive every result card
  conf:95,                    // significance / confidence level
  power:80
};

function newExperiment(){
  return {
    key:'005',                // overwritten by nextExpKey() when creating a new draft
    descriptor:'',
    code:{brand:'MSY', country:'AU', vertical:'WL', location:'LP'},
    codeCustom:{brand:false, country:false, vertical:false, location:false},
    name:'',                  // composed from key + code + descriptor
    variants:[],
    audience:{country:'AU', brand:'Moshy', vertical:'Weight loss', customer:'New', extra:[]},
    goal:null,                // set in the Goal stage
    traffic:100,
    evenSplit:true,
    splits:{},                // variantId -> share of enrolled traffic
    baselineCR:null,          // always inherits the goal's observed baseline
    mde:10,                   // desired relative uplift, %
    lengthDays:21,
    envs:['staging'],         // can be staging, production, or both
    aaAcknowledged:false,
    amp:{created:false, id:null}   // Amplitude dashboard for the analysis
  };
}

/* =====================================================================
   DERIVATIONS
   ===================================================================== */
function pkg(id){ return library[id]; }
function doses(med){ return DOSES[med] || DOSES['Semaglutide']; }

function planPrices(p){
  if(p.mode === 'tiered'){
    return Object.values(p.tiers||{}).filter(x => x !== '' && x != null).map(Number);
  }
  return (p.price === '' || p.price == null) ? [] : [Number(p.price)];
}
function pkgPrices(P){ return P ? P.plans.flatMap(planPrices) : []; }
function money(n){ return '$' + Number(n).toLocaleString(); }
function planLabel(p){
  const ps = planPrices(p);
  if(!ps.length) return p.type + ' unpriced';
  const lo = Math.min(...ps), hi = Math.max(...ps);
  return p.type + ' ' + (lo === hi ? money(lo) : money(lo)+' to '+money(hi));
}

function priceRange(v){
  const ps = v.packages.filter(Boolean).flatMap(id => pkgPrices(pkg(id)));
  if(!ps.length) return null;
  const lo = Math.min(...ps), hi = Math.max(...ps);
  return lo === hi ? money(lo) : money(lo) + ' to ' + money(hi);
}
function planTypes(v){
  const t = [...new Set(v.packages.filter(Boolean).flatMap(id => pkg(id) ? pkg(id).plans.map(p=>p.type) : []))];
  return t.length ? t.join(', ') : null;
}
function pkgCareIds(v){
  return [...new Set(v.packages.filter(Boolean).flatMap(id => pkg(id) ? pkg(id).care : []))];
}
/* everything the customer gets: inside the packages plus anything attached straight to the variant */
function careList(v){
  const c = [...new Set([...pkgCareIds(v), ...(v.care||[])])];
  return c.length ? c.map(id => CARE[id] ? CARE[id].name : id).join(', ') : null;
}
function directCareList(v){
  const c = (v.care||[]).filter(id => CARE[id]);
  return c.length ? c.map(id => CARE[id].name).join(', ') : null;
}
function pricingShape(v){
  const ps = v.packages.filter(Boolean).map(pkg).filter(Boolean);
  if(!ps.length) return null;
  return ps.some(P => P.plans.some(p => p.mode === 'tiered')) ? 'Per dose' : 'One price per plan';
}
const ATTRS = [
  {id:'pkg1',  label:'Package 1',     get:v=> v.packages[0] ? pkg(v.packages[0]).name : null},
  {id:'pkg2',  label:'Package 2',     get:v=> v.packages[1] ? pkg(v.packages[1]).name : null},
  {id:'plans', label:'Plans',         get:v=> planTypes(v)},
  {id:'price', label:'Price range',   get:v=> priceRange(v)},
  {id:'shape', label:'Pricing model', get:v=> pricingShape(v)},
  {id:'care',  label:'Care products', get:v=> careList(v)},
  {id:'careAdd', label:'Attached directly', get:v=> directCareList(v)}
];

function diffRows(){
  const vs = S.exp.variants;
  if(vs.length < 2) return [];
  const ctrl = vs[0];
  return ATTRS.map(a => {
    const base = a.get(ctrl);
    const vals = vs.map(v => a.get(v));
    return {attr:a, base, vals, differs: vals.some(x => x !== base)};
  });
}
function overrideCount(v){
  const ctrl = S.exp.variants[0];
  if(!ctrl || v === ctrl) return 0;
  return ATTRS.filter(a => a.get(v) !== a.get(ctrl)).length;
}
function diffCount(){ return diffRows().filter(r=>r.differs).length; }
function aaVariants(){ return S.exp.variants.slice(1).filter(v => overrideCount(v) === 0); }

const ELIGIBLE = 16700;

/* --- conversion goals --- */
function goalOf(id){ return GOALS[id || S.exp.goal] || null; }
function metricOf(id){ return goalOf(id); }
function metricKind(g){ return (g && g.kind) || 'binary'; }
function currencySymbol(unit){
  const u = String(unit||'').toUpperCase();
  if(u === 'AUD' || u === 'USD' || u === 'NZD' || u === '$') return '$';
  if(u === 'EUR') return '€';
  if(u === 'GBP') return '£';
  return '';
}
function formatContinuousNumber(v, metric){
  const n = Number(v);
  const sym = currencySymbol(metric && metric.unit);
  if(sym) return sym + n.toFixed(2);
  const unit = metric && metric.unit ? String(metric.unit) : '';
  return unit ? n.toFixed(2) + ' ' + unit : n.toFixed(2);
}
function formatMetricValue(v, metric){
  if(v == null || !Number.isFinite(Number(v))) return 'n/a';
  if(metricKind(metric) === 'continuous') return formatContinuousNumber(v, metric);
  return Number(v).toFixed(2) + '%';
}
function formatAbsEffect(v, metric){
  if(v == null || !Number.isFinite(Number(v))) return 'n/a';

/* keep splits in sync with the variant list; always sum to 100 */
function ensureSplits(){
  const e = S.exp, vs = e.variants;
  if(!vs.length){ e.splits = {}; return; }
  if(e.evenSplit || !Object.keys(e.splits).length){
    rebalanceEven();
    return;
  }
  vs.forEach(v=>{ if(e.splits[v.id] == null) e.splits[v.id] = 0; });
  Object.keys(e.splits).forEach(id=>{ if(!vs.find(v=>v.id===id)) delete e.splits[id]; });
  // normalise any drift so the sum is always exactly 100
  const ids = vs.map(v=>v.id);
  const sum = ids.reduce((a,id)=>a+Number(e.splits[id]||0),0);
  if(Math.abs(sum - 100) > 0.01 && ids.length){
    if(sum <= 0){ rebalanceEven(); return; }
    ids.forEach((id,i)=>{
      e.splits[id] = i === ids.length-1
        ? Math.round((100 - ids.slice(0,-1).reduce((a,x)=>a+Number(e.splits[x]||0),0))*10)/10
        : Math.round((Number(e.splits[id])/sum*100)*10)/10;
    });
  }
}
function rebalanceEven(){
  const e = S.exp, vs = e.variants;
  if(!vs.length){ e.splits = {}; return; }
  const each = Math.round((100 / vs.length) * 10) / 10;
  const out = {};
  vs.forEach((v,i)=>{
    out[v.id] = i === vs.length-1
      ? Math.round((100 - each*(vs.length-1))*10)/10
      : each;
  });
  e.splits = out;
  e.evenSplit = true;
}
/* drag one arm; the others absorb the remainder so the sum stays 100 */
function setSplitLinked(id, value){
  const e = S.exp, vs = e.variants;
  if(!vs.length) return;
  e.evenSplit = false;
  const others = vs.filter(v => v.id !== id);
  const clamped = Math.max(0, Math.min(100, Math.round(Number(value))));
  e.splits[id] = clamped;
  const remain = 100 - clamped;
  if(!others.length) return;
  const prior = others.reduce((a,v)=>a+Number(e.splits[v.id]||0),0);
  if(prior <= 0){
    const each = Math.round((remain / others.length) * 10) / 10;
    others.forEach((v,i)=>{
      e.splits[v.id] = i === others.length-1
        ? Math.round((remain - each*(others.length-1))*10)/10
        : each;
    });
  } else {
    others.forEach((v,i)=>{
      e.splits[v.id] = i === others.length-1
        ? Math.round((remain - others.slice(0,-1).reduce((a,x)=>a+Number(e.splits[x.id]||0),0))*10)/10
        : Math.round((Number(e.splits[v.id])/prior*remain)*10)/10;
    });
  }
}
function splitOf(id){ return S.exp.splits[id] ?? 0; }
function splitSum(){ return Object.values(S.exp.splits).reduce((a,b)=>a+Number(b||0),0); }
function absUplift(){
  const m = Number(S.exp.mde);
  return +((goalBaseline(metricOf()) * (Number.isFinite(m) ? m : 0) / 100).toFixed(2));
}

function perVariantWeekly(id){
  const share = id ? splitOf(id) : (100 / Math.max(S.exp.variants.length,1));
  return Math.round(entrantsWeekly() * (S.exp.traffic/100) * (share/100));
}
const perVariantDaily = id => Math.round(perVariantWeekly(id) / 7);
/* days to detect the desired relative uplift at current traffic, for the smallest arm */
function daysToDetectNum(mde){
  const m = mde == null ? S.exp.mde : mde;
  const metric = metricOf();
  const n = Math.min(...(S.exp.variants.length
    ? S.exp.variants.map(v => perVariantWeekly(v.id))
    : [perVariantWeekly()]));
  if(!n || !m) return Infinity;
  const zA = zConf(S.conf);
  const zP = zPow(S.power);
  if(metricKind(metric) === 'continuous'){
    const mean = Number(metric.baselineMean) || 0;
    const sd = Number(metric.baselineSd) || 0;
    const delta = mean * (m/100);
    if(!mean || !sd || delta <= 0) return Infinity;
    const needed = Math.ceil(2 * Math.pow(zA+zP,2) * Math.pow(sd,2) / Math.pow(delta,2));
    return Math.max(1, Math.ceil(needed / n * 7));
  }
  const p = baseCR() / 100;
  if(!p) return Infinity;
  const delta = p * (m/100);
  if(delta <= 0) return Infinity;
  const needed = Math.round(Math.pow(zA+zP,2) * 2 * p * (1-p) / Math.pow(delta,2));
  return Math.max(1, Math.ceil(needed / n * 7));
}
function daysToDetect(mde){
  const d = daysToDetectNum(mde);
  return d === Infinity ? 'not enough traffic' : d + ' days';
}

/* ---------- live board math (deterministic fake data) ---------- */
function hashStr(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function seeded(seed){
  let s = seed|0;
  return () => { s = (Math.imul(s, 1664525) + 1013904223) | 0; return (s >>> 0) / 4294967296; };
}
function erfApprox(x){
  const sign = x < 0 ? -1 : 1;
  const ax = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * ax);
  const y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592)*t * Math.exp(-ax*ax);
  return sign * y;
}
function normalCdf(x){ return 0.5 * (1 + erfApprox(x / Math.SQRT2)); }
function zInterp(x, pts){
  x = Math.max(pts[0][0], Math.min(pts[pts.length-1][0], x));
  for(let i=0;i<pts.length-1;i++){
    if(x <= pts[i+1][0]){
      const [x0,y0]=pts[i], [x1,y1]=pts[i+1];
      return y0 + (y1-y0)*(x-x0)/(x1-x0);
    }
  }
  return pts[pts.length-1][1];
}
function zConf(conf){ return zInterp(Number(conf == null ? S.conf : conf), [[80,1.28],[90,1.645],[95,1.96]]); }
function zPow(pow){ return zInterp(Number(pow == null ? S.power : pow), [[70,0.52],[80,0.84],[90,1.28]]); }
function zAlpha(){ return zConf(S.conf); }
function zPower(){ return zPow(S.power); }

function liveDayCount(){
  const of = S.exp.lengthDays || 21;
  if(S.retired) return of;
  // stable "current day" from the key; keep runs long enough that Last 7 ≠ Full
  const n = Number(S.exp.key) || 5;
  return Math.max(14, Math.min(of, 10 + ((n * 5) % Math.max(1, of - 9))));
}
function liveSeries(){
  const days = liveDayCount();
  const metric = metricOf();
  const continuous = metricKind(metric) === 'continuous';
  const base = continuous ? Number(metric.baselineMean)||0 : baseCR() / 100;
  return S.exp.variants.map((v, i) => {
    const rng = seeded(hashStr(S.exp.key + ':' + v.id));
    const trueRel = i === 0 ? 0 : (Number(S.exp.mde) || 10) / 100 * (0.55 + 0.2 * i);
    const trueP = continuous ? base * (1 + trueRel) : Math.min(0.9, Math.max(0.001, base * (1 + trueRel)));
    const dailyN = Math.max(8, perVariantDaily(v.id));
    const pts = [];
    for(let d=1; d<=days; d++){
      const n = Math.max(1, Math.round(dailyN * (0.88 + rng() * 0.24)));
      if(continuous){
        const popSd = Number(metric.baselineSd)||1;
        const mean = trueP + (rng()-0.5) * popSd / Math.sqrt(n) * 2.2;
        const sd = popSd * (0.9 + rng()*0.2);
        pts.push({day:d, n, mean:+mean.toFixed(3), sd:+sd.toFixed(3), sum:+(mean*n).toFixed(2)});
      } else {
        const noise = 0.82 + rng() * 0.36;
        const p = Math.min(0.95, Math.max(0.001, trueP * noise));
        const sd = Math.sqrt(Math.max(0.25, n * p * (1-p)));
        const conv = Math.max(0, Math.min(n, Math.round(n * p + (rng() - 0.5) * sd * 2)));
        pts.push({day:d, n, c:conv, cr: n ? +(conv/n*100).toFixed(3) : 0});
      }
    }
    return {id:v.id, name:v.name||v.id, color:VAR_COLORS[i % VAR_COLORS.length], role:v.role, pts};
  });
}
function pad2(n){ return String(n).padStart(2,'0'); }
function isoDate(d){
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function parseIso(s){
  const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return null;
  return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
}
function addDays(d, n){
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() + n);
  return x;
}
/* stable fake launch date from the experiment key so custom dates stay consistent */
function experimentStartDate(){
  const n = Number(S.exp.key) || 5;
  return new Date(2026, 5, 1 + ((n * 3) % 20)); // June 2026
}
function dayToIso(day){
  return isoDate(addDays(experimentStartDate(), day - 1));
}
function isoToDay(iso, days){
  const start = experimentStartDate();
  const d = parseIso(iso);
  if(!d) return 1;
  const diff = Math.round((d - start) / 86400000) + 1;
  return Math.max(1, Math.min(days, diff));
}
function liveWindow(){
  const days = liveDayCount();
  let start = 1, end = days;
  if(S.liveRange === '7') start = Math.max(1, days - 6);
  else if(S.liveRange === '14') start = Math.max(1, days - 13);
  else if(S.liveRange === 'custom'){
    if(typeof S.liveFrom === 'string' && S.liveFrom.includes('-')){
      start = isoToDay(S.liveFrom, days);
      end = isoToDay(S.liveTo || S.liveFrom, days);
    } else {
      start = Math.max(1, Math.min(days, Number(S.liveFrom) || 1));
      end = Math.max(start, Math.min(days, Number(S.liveTo) || days));
    }
    if(end < start){ const t = start; start = end; end = t; }
  }
  return {start, end, days, startIso: dayToIso(start), endIso: dayToIso(end),
    minIso: dayToIso(1), maxIso: dayToIso(days)};
}
function liveStats(){
  const series = liveSeries();
  const metric = metricOf();
  const continuous = metricKind(metric) === 'continuous';
  const {start, end} = liveWindow();
  const zCrit = zAlpha();
  const arms = series.map(s => {
    const slice = s.pts.filter(p => p.day >= start && p.day <= end);
    const n = slice.reduce((a,p)=>a+p.n, 0);
    if(continuous){
      const mean = n ? slice.reduce((a,p)=>a+(p.mean*p.n),0)/n : 0;
      const ss = slice.reduce((a,p)=>a + Math.max(0,p.n-1)*p.sd*p.sd + p.n*Math.pow(p.mean-mean,2),0);
      const sd = n>1 ? Math.sqrt(ss/(n-1)) : 0;
      return {...s, n, mean:+mean.toFixed(2), sd:+sd.toFixed(2), value:+mean.toFixed(2), slice};
    }
    const c = slice.reduce((a,p)=>a+p.c, 0);
    return {...s, n, c, cr: n ? +(c/n*100).toFixed(2) : 0, value:n ? +(c/n*100).toFixed(2) : 0, slice};
  });
  const ctrl = arms[0] || {n:0, c:0, cr:0};
  return arms.map((a, i) => {
    if(i === 0) return {...a, abs:0, rel:0, half:0, lo:0, hi:0, p:1, state:'flat'};
    if(continuous){
      const abs = +(a.mean-ctrl.mean).toFixed(2);
      const rel = ctrl.mean ? +(abs/ctrl.mean*100).toFixed(1) : 0;
      const se = Math.sqrt(ctrl.sd*ctrl.sd/Math.max(1,ctrl.n) + a.sd*a.sd/Math.max(1,a.n));
      const t = se ? abs/se : 0;
      const p = Math.max(0.0001, Math.min(0.999, 2*(1-normalCdf(Math.abs(t)))));
      const half = +(zCrit*se).toFixed(2);
      const lo = +(abs-half).toFixed(2), hi = +(abs+half).toFixed(2);
      const crosses = lo < 0 && hi > 0;
      let state = ctrl.n+a.n < 120 ? 'early' : crosses ? (Math.abs(abs)>half*.55?'trend':'flat') : abs>0?'win':'loss';
      return {...a, abs, rel, half, lo, hi, p, state};
    }
    const p1 = ctrl.n ? ctrl.c / ctrl.n : 0;
    const p2 = a.n ? a.c / a.n : 0;
    const abs = +((p2 - p1) * 100).toFixed(2);
    const rel = p1 ? +(((p2 - p1) / p1) * 100).toFixed(1) : 0;
    const pooled = (ctrl.c + a.c) / Math.max(1, ctrl.n + a.n);
    const se = Math.sqrt(Math.max(1e-12, pooled * (1-pooled) * (1/Math.max(1,ctrl.n) + 1/Math.max(1,a.n))));
    const z = se > 0 ? (p2 - p1) / se : 0;
    const p = Math.max(0.0001, Math.min(0.999, 2 * (1 - normalCdf(Math.abs(z)))));
    const seDiff = Math.sqrt(Math.max(1e-12, p1*(1-p1)/Math.max(1,ctrl.n) + p2*(1-p2)/Math.max(1,a.n)));
    const half = +(zCrit * seDiff * 100).toFixed(2);
    const lo = +(abs - half).toFixed(2), hi = +(abs + half).toFixed(2);
    const crosses = lo < 0 && hi > 0;
    let state = 'flat';
    if(ctrl.n + a.n < 400) state = 'early';
    else if(crosses) state = Math.abs(abs) > half * 0.55 ? 'trend' : 'flat';
    else state = abs > 0 ? 'win' : 'loss';
    return {...a, abs, rel, half, lo, hi, p, state};
  });
}

function detectableMdeAt(nPerArm){
  const metric = metricOf();
  if(metricKind(metric) === 'continuous'){
    const mean = Number(metric.baselineMean)||0, sd = Number(metric.baselineSd)||0;
    if(!nPerArm || !mean || !sd) return Infinity;

/* --- stage gating --- */
function stageBlockers(id){
  const e = S.exp;
  if(id === 'setup'){
    const out = [];
    if(!String(e.descriptor||'').trim()) out.push('Add a short descriptor');
    out.push(...codeSetupIssues());
    return out;
  }
  if(id === 'goal') return goalOf() ? [] : ['Pick a primary metric'];
  if(id === 'audience') return [];
  if(id === 'variants'){
    const out = [];
    if(e.variants.length < 2) out.push('Add at least two variants');
    else if(e.variants.some(v => !v.packages.filter(Boolean).length)) out.push('Every variant needs a package');
    return out;
  }
  if(id === 'traffic')  return e.traffic > 0 ? [] : ['Allocate some traffic'];
  return [];
}
function stageDone(id){
  if(id === 'launch') return S.published;
  return stageBlockers(id).length === 0 && stageIdx(id) < S.maxStage;
}
const reached = id => stageIdx(id) <= S.maxStage;
/* Next is a one-time unlock control: hide once the following stage is open */
const showNext = id => stageIdx(id) === S.maxStage && stageIdx(id) < STAGES.length - 1;

function checklist(){
  const e = S.exp, out = [];
  const aud = [e.audience.country, e.audience.brand, e.audience.vertical,
    e.audience.customer + ' customer', ...e.audience.extra].join(' · ');

  out.push({ok: !!String(e.descriptor||'').trim(), block:true, jump:'setup',
    t:'Named and keyed',
    d: String(e.descriptor||'').trim()
      ? `${composeExpName(e)}`
      : 'Add a short descriptor so the experiment has a name'});

  const g = goalOf();
  out.push({ok: !!g, block:true, jump:'goal',
    t:'Primary metric set',
    d: g
      ? `${g.name} · ${goalPath(g)} · baseline ${formatMetricValue(goalBaseline(g),g)}${metricKind(g)==='binary'?' · '+g.window+' day conversion window':''}`
      : 'Without a primary metric there is no outcome to analyse'});

  out.push({ok:true, block:false, jump:'audience',
    t:'Audience defined',
    d: `${aud} · ${ELIGIBLE.toLocaleString()} match per week`});

  out.push({ok: e.variants.length >= 2, block:true, jump:'variants',
    t:'At least two variants',
    d: e.variants.length >= 2
      ? `${e.variants.map(v=>v.name||v.id).join(', ')} · ${e.variants.length} arms`
      : 'A test needs a control and at least one variant'});

  const hasPkg = e.variants.length > 0 && e.variants.every(v => v.packages.filter(Boolean).length > 0);
  out.push({ok: hasPkg, block:true, jump:'variants',
    t:'Every variant has a package',
    d: hasPkg
      ? e.variants.map(v => `${v.name||v.id} has ${v.packages.filter(Boolean).length}`).join(', ')
      : 'A variant has no package attached'});

  const aa = aaVariants(), dc = diffCount();
  if(aa.length && !e.aaAcknowledged){
    out.push({ok:false, warn:true, block:false, jump:'variants',
      t:'Variants are identical',
      d:`${aa.map(v=>v.name||v.id).join(', ')} matches ${e.variants[0].name||e.variants[0].id}. Valid as an A/A, confirm if intended.`});
  } else {
    out.push({ok:true, block:false, jump:'variants',
      t: aa.length ? 'A/A confirmed intentional' : 'Variants differ',
      d: aa.length
        ? 'Measuring noise rather than a change'
        : `${dc} of ${ATTRS.length} attributes diverge from the control`});
  }

  out.push({ok: e.traffic > 0, block:true, jump:'traffic',
    t:'Traffic allocated',
    d: e.traffic > 0
      ? `${e.traffic}% enrolled · ${e.evenSplit ? 'even split' : 'custom split'} · ${e.variants.map(v=>`${v.name||v.id} ${splitOf(v.id)}%`).join(', ')||'no arms'}`
      : 'Nobody is enrolled'});

  const d = daysToDetectNum();
  out.push({ok: d !== Infinity, warn: d === Infinity || d > e.lengthDays, block:false, jump:'traffic',
    t:`Days needed to detect a ${e.mde}% lift`,
    d: d === Infinity
      ? 'Not enough traffic to detect anything'
      : `${d} days at current traffic · baseline ${formatMetricValue(goalBaseline(g),g)} · ${formatAbsEffect(absUplift(),g)} absolute`});

  out.push({ok: e.envs.length > 0, block:true, jump:'launch',
    t:'Publish destination chosen',
    d: e.envs.length ? e.envs.join(' and ') : 'Pick staging, production, or both'});

  return out;
}
function canPublish(){ return checklist().filter(c=>c.block).every(c=>c.ok); }

function paintSaving(){
  document.querySelectorAll('.saving').forEach(el=>{
    el.className = 'saving' + (S.saving ? ' busy' : '');

  });
}
function save(){
  S.saving = true; paintSaving();
  clearTimeout(save._t);
  save._t = setTimeout(()=>{ S.saving = false; paintSaving(); }, 550);
}
function toast(msg){
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 2600);
}
const nextLetter = () => String.fromCharCode(65 + S.exp.variants.length);

function goStage(id){
  if(!reached(id)){ toast('Finish the earlier stages first.'); return; }
  S.activeSection = id; render();
  const t = document.getElementById('sec-'+id);
  if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
}
function clearFieldErrors(){
  document.querySelectorAll('.fld.err, .sel.err, .vcard.err, .empty.err, .slot.err').forEach(el=>{
    el.classList.remove('err');
  });
  document.querySelectorAll('.fielderr').forEach(el=>el.remove());
}
function markErr(el, msg){
  if(!el) return null;
  el.classList.add('err');
  if(msg){
    const tip = document.createElement('div');
    tip.className = 'fielderr';
    tip.textContent = msg;
    el.insertAdjacentElement('afterend', tip);
  }
  return el;
}
function flashStageErrors(id){
  clearFieldErrors();
  const hits = [];
  if(id === 'setup'){
    if(!String(S.exp.descriptor||'').trim()){
      hits.push(markErr(document.querySelector('[data-fid="e-desc"]'), 'Add a short descriptor'));
    }
    ensureCodeCustom();
    ['brand','country','vertical','location'].forEach(f=>{
      if(!S.exp.codeCustom[f]) return;
      const w = codeFieldWarning(f, S.exp.code[f]);
      if(w) hits.push(markErr(document.querySelector(`[data-fid="code-${f}"]`), w));
    });
  }
  if(id === 'goal' && !goalOf()){
    hits.push(markErr(document.querySelector('#sec-goal [data-goal]'), 'Pick a primary metric'));
  }
  if(id === 'variants'){
    if(S.exp.variants.length < 2){
      const empty = document.querySelector('#sec-variants .empty');
      if(empty){
        empty.classList.add('err');
        hits.push(markErr(empty, 'Add at least two variants'));
      }
    } else {
      S.exp.variants.forEach(v=>{
        if(v.packages.filter(Boolean).length) return;
        const card = document.querySelector(`[data-vid="${v.id}"]`);
        if(card){
          card.classList.add('err');
          hits.push(card);
          const slot = card.querySelector('.slot.add') || card.querySelector('.slot');
          if(slot){
            slot.classList.add('err');
            const tip = document.createElement('div');
            tip.className = 'fielderr';
            tip.textContent = 'Every variant needs a package';
            slot.parentElement.insertAdjacentElement('afterend', tip);
          }
        }
      });
    }
  }
  if(id === 'traffic' && !(S.exp.traffic > 0)){
    hits.push(markErr(document.querySelector('[data-fid="e-traffic"]'), 'Allocate some traffic'));
  }
  const first = hits.find(Boolean);
  if(first){
    const content = document.querySelector('.content');
    if(content && first.scrollIntoView){
      first.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }
  toast(stageBlockers(id)[0] + '.');
}
function goNext(from){
  const i = stageIdx(from), b = stageBlockers(from);
  if(b.length){ flashStageErrors(from); return; }
  if(from === 'setup'){
    syncExpName();
    save();
    toast(`Named ${S.exp.name}.`);
  }
  const nx = STAGES[i+1];
  if(!nx) return;
  S.maxStage = Math.max(S.maxStage, i+1);
  S.activeSection = nx.id;
  render();
  const t = document.getElementById('sec-'+nx.id);
  if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
}

function addVariant(){
  const id = nextLetter();
  S.exp.variants.push({id, name:id, role:S.exp.variants.length?'test':'control', packages:[], care:[], inherits:null});
  ensureSplits();
  S.activeSection='variants'; save(); render();
  toast('Variant added. Traffic rebalanced.');
}
function cloneVariant(src){
  const id = nextLetter();
  S.exp.variants.push({id, name:id, role:'test', packages:[...src.packages], care:[...(src.care||[])], inherits:src.id});
  S.exp.aaAcknowledged = false;
  ensureSplits();
  S.activeSection='variants'; save(); render();
  toast(`Variant ${id} inherits ${src.name||src.id}. Traffic rebalanced.`);
}
function removeVariant(v){
  S.exp.variants = S.exp.variants.filter(x=>x!==v);
  S.exp.variants.forEach((x,i)=>{
    x.id = String.fromCharCode(65+i);
    if(!x.name || /^[A-Z]$/.test(x.name)) x.name = x.id;
    x.role = i?'test':'control';
  });

function focusIssues(){
  const f = S.focus;
  if(!f) return [];
  if(f.builder === 'care') return careIssues(f);
  if(f.builder === 'goal') return goalIssues(f);
  return pkgIssues(f);

function saveFocus(){

function saveCareFocus(){
  const f = S.focus, issues = careIssues(f);
  if(issues.length){ toast(issues[0] + '.'); return; }
  const id = f.editId || ('care_' + Date.now());
  const prev = CARE[id];
  CARE[id] = {id, name:f.name.trim(), kind:f.kind || 'Consult', mode:f.mode,
    price: f.mode === 'addon' ? Number(f.price||0) : 0, note:(f.note||'').trim(),
    isNew: prev ? prev.isNew : true};
  const ret = f.returnTo;
  S.focus = null;
  if(ret && ret.variantId){
    const v = S.exp.variants.find(x => x.id === ret.variantId);
    if(v){
      v.care = v.care || [];
      if(!v.care.includes(id)) v.care.push(id);
      S.exp.aaAcknowledged = false;
      S.activeSection = 'variants';
      save(); render();
      toast(`Saved and attached to ${v.name||v.id}.`);
      return;
    }
  }
  if(ret && ret.pkgDraft){
    // came from the package builder: hand the draft back with the product ticked
    S.focus = ret.pkgDraft;
    if(!S.focus.care.includes(id)) S.focus.care.push(id);
    render(); toast(`${CARE[id].name} created and added to the package.`);
    return;
