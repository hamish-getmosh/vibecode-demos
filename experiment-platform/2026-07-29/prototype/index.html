  const m = S.modal;
  if(m.type === 'pkg'){
    const used = m.variant.packages.filter(Boolean);
    return `<div class="pop-bg" data-act="close-modal"><div class="pop" data-stop>
      <div class="pop-h">
        <div class="t">Attach a package to ${esc(m.variant.name||m.variant.id)}</div>
        <div class="k" style="margin-top:3px">Pick from the library, or create a new one.</div>
      </div>
      <div class="pop-b">
        <div class="scrollist">
        ${Object.values(library).map(p=>{
          const dis = used.includes(p.id);
          return `<div class="opt ${dis?'dis':''}" ${dis?'':`data-act="attach" data-p="${p.id}"`}>
            <div><div class="on">${esc(p.name)}</div>
              <div class="od">${p.plans.map(x=>esc(planLabel(x))).join(' · ')}
                ${dis?' · already attached':` · used in ${p.uses||0} experiments`}</div></div>
            ${dis?'<span class="chip out">attached</span>':'<span class="chip">Attach</span>'}
          </div>`;
        }).join('')}
        </div>
        <div class="opt create" data-act="build-pkg" style="margin-top:8px;margin-bottom:0">
          <div><div class="on">+ Create a new package</div>
            <div class="od" style="color:var(--accent)">Opens over the experiment, saves and attaches</div></div>
        </div>
      </div>
      <div class="pop-f">
        <span class="k">${Object.keys(library).length} packages in the library</span>
        <button class="btn sec" data-act="close-modal">Cancel</button>
      </div>
    </div></div>`;
  }

  if(m.type === 'rule'){
    return `<div class="pop-bg" data-act="close-modal"><div class="pop" data-stop>
      <div class="pop-h"><div class="t">Add a rule layer</div>
        <div class="k" style="margin-top:3px">All ${EXTRA_PROPS.length} properties live here.</div>
        <input class="fld" data-rq data-fid="q-rule" value="${esc(S.ruleQuery)}"
          placeholder="Filter properties" style="margin-top:11px">
      </div>
      <div class="pop-b" style="overflow:hidden">
        <div class="scrollist" id="ruleList">${ruleListInner()}</div>
      </div>
      <div class="pop-f"><span class="k" id="ruleCount">${ruleMatches().length} of ${EXTRA_PROPS.length} shown</span>
        <button class="btn sec" data-act="close-modal">Done</button></div>
    </div></div>`;
  }
  return '';
}

function ruleMatches(){
  const q = S.ruleQuery.trim().toLowerCase();
  return q ? EXTRA_PROPS.filter(p => p.toLowerCase().includes(q)) : EXTRA_PROPS;
}
function ruleListInner(){
  const cur = S.exp.audience.extra;
  const list = ruleMatches();
  if(!list.length) return `<div class="blank" style="padding:34px 10px">No property matches that.</div>`;
  return list.map(p=>{
    const dis = cur.includes(p);
    return `<div class="opt ${dis?'dis':''}" ${dis?'':`data-act="add-rule-do" data-r="${esc(p)}"`}>
      <div class="on">${esc(p)}</div>
      ${dis?'<span class="chip out">added</span>':'<span class="chip">Add</span>'}</div>`;
  }).join('');
}

function patchTraffic(){
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('tPct', S.exp.traffic + '%');
  set('tFun', funnelInner());
  S.exp.variants.forEach(v=>{
    const el = document.getElementById('spv-'+v.id);
    if(el) el.textContent = splitOf(v.id) + '%';
  });
  patchMde();
  patchGate();
}
function patchMde(){
  const d = daysToDetectNum();
  const set = (id, html) => { const el = document.getElementById(id); if(el) el.innerHTML = html; };
  set('mdePct', S.exp.mde + '%');
  set('mdeDays', d===Infinity?'—':String(d));
  const fit = document.getElementById('mdeFit');
  if(fit){
    fit.textContent = d===Infinity?'No':(d<=S.exp.lengthDays?'Fits':'Short');
    fit.style.color = d!==Infinity && d<=S.exp.lengthDays ? 'var(--accent)' : 'var(--hot)';
  }
  document.querySelectorAll('[data-split]').forEach(inp=>{
    const row = inp.closest('.splitrow');
    if(!row) return;
    const k = row.querySelector('.k');
    if(k) k.textContent = perVariantWeekly(inp.dataset.split).toLocaleString() + ' / wk';
  });
}
function patchGate(){
  document.querySelectorAll('[data-act="next"]').forEach(btn=>{
    const id = btn.dataset.s;
    const b = stageBlockers(id);
    btn.disabled = b.length > 0;
    btn.title = b.length ? b.join(' · ') : '';
    btn.textContent = nextLabel(id);
  });
  const rt = document.getElementById('rt-setup');
  if(rt) rt.innerHTML = setupRight();
}
function patchBuilderGate(){
  if(S.focus){
    const is = pkgIssues();
    const w = document.getElementById('pkgReady');
    if(w) w.innerHTML = readyChip(is);
    const b = document.querySelector('[data-act="focus-save"]');
    if(b){ b.disabled = is.length > 0; b.title = is.length ? is.join(' · ') : ''; }
  }
  if(S.libDraft){
    const is = S.libTab==='packages' ? pkgIssues(S.libDraft) : careIssues(S.libDraft);
    const w = document.getElementById('libReady');
    if(w) w.innerHTML = readyChip(is);
    const b = document.querySelector('[data-act="lib-save"]');
    if(b){ b.disabled = is.length > 0; }
  }
}

function bind(){
  document.querySelectorAll('[data-stop]').forEach(n=>n.addEventListener('click', ev=>ev.stopPropagation()));

  document.querySelectorAll('[data-act]').forEach(n=>{
    n.addEventListener('click', ev=>{
      const a = n.dataset.act;
      const V = id => S.exp.variants.find(v=>v.id===id);
      switch(a){
        case 'go-dash': S.view='dashboard'; S.modal=null; S.focus=null; render(); break;
        case 'go-lib':
          S.view='library'; S.libTab=n.dataset.t||'packages';
          S.libSel=null; S.libDraft=null; S.modal=null; S.focus=null; render(); break;
        case 'dash-tab': S.dashTab = n.dataset.t; render(); break;
        case 'new': newExperimentFlow(); break;
        case 'open-run': openRun((n.dataset.k==='fin'?FINISHED:RUNS)[Number(n.dataset.i)]); break;
        case 'go-stage': goStage(n.dataset.s); break;
        case 'next': goNext(n.dataset.s); break;
        case 'lib-sel':
          S.libSel = n.dataset.id;
          S.libDraft = S.libTab==='packages'
            ? libPkgDraft(library[S.libSel])
            : libCareDraft(CARE[S.libSel]);
          render(); break;
        case 'lib-new':
          S.libSel = null;
          S.libDraft = S.libTab==='packages' ? blankLibPkg() : blankLibCare();
          render(); break;
        case 'lib-save': saveLibDetail(); break;
        case 'lib-add-plan': {
          const used = S.libDraft.plans.map(p=>p.type);
          S.libDraft.plans.push(blankPlan(PLAN_TYPES.find(t=>!used.includes(t))||'Monthly'));
          render(); break;
        }
        case 'lib-rm-plan': S.libDraft.plans.splice(Number(n.dataset.i),1); render(); break;
        case 'lib-plan-mode': {
          const p = S.libDraft.plans[Number(n.dataset.i)];
          p.mode = n.dataset.m; render(); break;
        }
        case 'lib-care': {
          const c = n.dataset.c, f = S.libDraft;
          f.care = f.care.includes(c) ? f.care.filter(x=>x!==c) : [...f.care, c];
          render(); break;
        }
        case 'lib-kind': S.libDraft.kind = n.dataset.k; render(); break;
        case 'lib-mode': S.libDraft.mode = n.dataset.m; render(); break;
        case 'add-plan': addPlan(); break;
        case 'rm-plan': removePlan(Number(n.dataset.i)); break;
        case 'plan-mode': setPlanMode(Number(n.dataset.i), n.dataset.m); break;
        case 'add-variant': addVariant(); break;
        case 'clone': cloneVariant(V(n.dataset.v)); break;
        case 'rm-variant': removeVariant(V(n.dataset.v)); break;
        case 'toggle-compare': S.compare = !S.compare; render(); break;
        case 'ack-aa': S.exp.aaAcknowledged = true; save(); render(); toast('A/A confirmed as intentional.'); break;
        case 'pick': openPackagePicker(V(n.dataset.v), Number(n.dataset.i)); break;
        case 'attach': attachPackage(S.modal.variant, S.modal.slotIndex, n.dataset.p); break;
        case 'build-pkg': openPackageBuilder({variantId:S.modal.variant.id, slotIndex:S.modal.slotIndex}); break;
        case 'close-modal': S.modal=null; render(); break;
        case 'focus-cancel': S.focus=null; render(); toast('Discarded.'); break;
        case 'focus-save': savePackage(); break;
        case 'care': {
          const c = n.dataset.c, f = S.focus;
          f.care = f.care.includes(c) ? f.care.filter(x=>x!==c) : [...f.care, c];
          render(); break;
        }
        case 'aud': S.exp.audience[n.dataset.g] = n.dataset.o; save(); render(); break;
        case 'add-rule': openRulePicker(); break;
        case 'add-rule-do': S.exp.audience.extra.push(n.dataset.r);
          save(); render(); toast('Rule layer added.'); break;
        case 'rm-rule': S.exp.audience.extra.splice(Number(n.dataset.i),1); save(); render(); break;
        case 'toggle-even':
          S.exp.evenSplit = !S.exp.evenSplit;
          ensureSplits(); save(); render(); break;
        case 'env-tog': {
          const e = n.dataset.e;
          if(S.exp.envs.includes(e)) S.exp.envs = S.exp.envs.filter(x=>x!==e);
          else S.exp.envs = [...S.exp.envs, e];
          save(); render(); break;
        }
        case 'publish': publish(); break;
      }
    });
  });

  document.querySelectorAll('[data-ana]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S[sel.dataset.ana] = Number(sel.value);
      render();
      toast(`Analysis defaults: ${S.conf}% significance, ${S.power}% power.`);
    });
  });

  document.querySelectorAll('[data-f]').forEach(inp=>{
    const f = inp.dataset.f;
    if(f === 'traffic' || f === 'mde'){
      inp.addEventListener('input', ()=>{
        S.exp[f] = Number(inp.value);
        if(f==='traffic') patchTraffic(); else patchMde();
        save();
      });
      inp.addEventListener('change', ()=>render());
      return;
    }
    inp.addEventListener('input', ()=>{
      S.exp[f] = inp.value;
      if(f === 'name'){
        const h = document.querySelector('.top h1');
        if(h) h.childNodes[0].nodeValue = inp.value.trim() || 'Untitled experiment';
      }
      patchGate();
      save();
    });
  });

  document.querySelectorAll('[data-split]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      S.exp.evenSplit = false;
      S.exp.splits[inp.dataset.split] = Number(inp.value);
      patchTraffic();
      save();
    });
    inp.addEventListener('change', ()=>render());
  });

  document.querySelectorAll('[data-vn]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const v = S.exp.variants.find(x=>x.id===inp.dataset.vn);
      if(v){ v.name = inp.value; inp.style.width = Math.max(40, inp.value.length*10) + 'px'; }
      save();
    });
  });

  const num = s => String(s).replace(/[^0-9]/g,'');
  const repaintPkg = () => {
    const p = document.getElementById('pv'); if(p) p.innerHTML = pkgPreview();
    patchBuilderGate();
  };

  document.querySelectorAll('[data-ff]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ S.focus[inp.dataset.ff] = inp.value; repaintPkg(); });
  });
  document.querySelectorAll('[data-fp]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      S.focus.plans[Number(inp.dataset.fp)].price = inp.value;
      repaintPkg();
    });
  });
  document.querySelectorAll('[data-fd]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      const p = S.focus.plans[Number(inp.dataset.fd)];
      if(inp.value === '') delete p.tiers[inp.dataset.d];
      else p.tiers[inp.dataset.d] = inp.value;
      repaintPkg();
    });
  });
  document.querySelectorAll('[data-fpt]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S.focus.plans[Number(sel.dataset.fpt)].type = sel.value; render();
    });
  });
  const med = document.querySelector('[data-fm]');
  if(med) med.addEventListener('change', ()=>{
    S.focus.medication = med.value;
    const valid = doses(med.value);
    S.focus.plans.forEach(p=>{
      const carried = planPrices(p);
      Object.keys(p.tiers).forEach(d=>{ if(!valid.includes(d)) delete p.tiers[d]; });
      if(valid.length === 1){
        if(p.price === '' && carried.length) p.price = String(Math.min(...carried));
        p.mode = 'flat';
      }
    });
    render();
  });

  document.querySelectorAll('[data-ld]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const f = inp.dataset.ld;
      if(f === 'price'){ inp.value = num(inp.value); S.libDraft.price = inp.value; }
      else S.libDraft[f] = inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-ldp]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      S.libDraft.plans[Number(inp.dataset.ldp)].price = inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-ldd]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      inp.value = num(inp.value);
      const p = S.libDraft.plans[Number(inp.dataset.ldd)];
      if(inp.value === '') delete p.tiers[inp.dataset.d];
      else p.tiers[inp.dataset.d] = inp.value;
      patchBuilderGate();
    });
  });
  document.querySelectorAll('[data-ldpt]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      S.libDraft.plans[Number(sel.dataset.ldpt)].type = sel.value; render();
    });
  });
  const ldm = document.querySelector('[data-ldm]');
  if(ldm) ldm.addEventListener('change', ()=>{ S.libDraft.medication = ldm.value; render(); });
  const ldr = document.querySelector('[data-ldr]');
  if(ldr) ldr.addEventListener('change', ()=>{ S.libDraft.region = ldr.value; render(); });

  const rq = document.querySelector('[data-rq]');
  if(rq) rq.addEventListener('input', ()=>{
    S.ruleQuery = rq.value;
    const list = document.getElementById('ruleList');
    if(list){ list.innerHTML = ruleListInner(); }
    const c = document.getElementById('ruleCount');
    if(c) c.textContent = `${ruleMatches().length} of ${EXTRA_PROPS.length} shown`;
    if(list) list.querySelectorAll('[data-act="add-rule-do"]').forEach(rowNode=>{
      rowNode.addEventListener('click', ()=>{
        S.exp.audience.extra.push(rowNode.dataset.r);
        save(); render(); toast('Rule layer added.');
      });
    });
  });
}

/* boot */
S.exp = newExperiment();
render();
</script>
</body>
</html>
