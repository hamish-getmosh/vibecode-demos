function saveGoalFocus(){
  const f = S.focus, issues = goalIssues(f);
  if(issues.length){ toast(issues[0] + '.'); return; }
  const {id} = persistGoal(f);
  const ret = f.returnTo;
  S.focus = null;
  if(ret && ret.setPrimary){
    GOALS[id].uses = Math.max(GOALS[id].uses, 1);
    S.exp.goal = id;
    S.activeSection = 'goal';
    save(); render();
    toast(`${GOALS[id].name} created and set as the primary goal.`);
    return;
  }
  S.view = 'library'; S.libTab = 'goals'; S.libSel = id; S.libDraft = libGoalDraft(GOALS[id]);
  render(); toast(`${GOALS[id].name} saved.`);
}

function pkgIssues(f){
  f = f || S.focus;
  const out = [];
  if(!f.name.trim()) out.push('Name the package');
  if(!f.plans.filter(p => planPrices(p).length).length) out.push('Price at least one plan');
  const names = Object.values(library).filter(P => P.id !== f.editId).map(P => P.name.toLowerCase());
  if(f.name.trim() && names.includes(f.name.trim().toLowerCase())) out.push('A package already has this name');
  return out;
}

function persistPackage(f){
  const id = f.editId || ('pkg_' + Date.now());
  const wasEdit = !!f.editId;
  const prev = library[id];
  library[id] = {
    id, name:f.name.trim(), region:f.region, vertical:f.vertical, medication:f.medication,
    plans:f.plans.filter(p => planPrices(p).length).map(p=>({
      type:p.type, mode:p.mode,
      price: p.mode === 'flat' ? Number(p.price) : null,
      tiers: p.mode === 'tiered' ? Object.assign({}, p.tiers) : {}
    })),
    care:[...f.care],
    uses: prev ? prev.uses : 0,
    isNew: wasEdit ? prev.isNew : true
  };
  return {id, wasEdit};
}

function savePackage(){
  const f = S.focus, issues = pkgIssues();
  if(issues.length){ toast(issues[0] + '.'); return; }
  const {id, wasEdit} = persistPackage(f);
  const ret = f.returnTo;
  S.focus = null;

  if(ret && ret.variantId){
    const v = S.exp.variants.find(x => x.id === ret.variantId);
    const slot = ret.slotIndex;
    if(slot >= v.packages.length) v.packages.push(id); else v.packages[slot] = id;
    library[id].uses = Math.max(library[id].uses, 1);
    S.exp.aaAcknowledged = false;
    S.activeSection = 'variants';
    save(); render();
    toast(`Saved and attached to ${v.name||v.id}.`);
    return;
  }
  S.view = 'library'; S.libTab = 'packages'; S.libSel = id; render();
  toast(wasEdit ? `${library[id].name} updated.` : `${library[id].name} added.`);
}

function addPlan(){
  const used = S.focus.plans.map(p=>p.type);
  S.focus.plans.push(blankPlan(PLAN_TYPES.find(t => !used.includes(t)) || 'Monthly')); render();
}
function removePlan(i){ S.focus.plans.splice(i,1); render(); }
function setPlanMode(i, mode){
  const p = S.focus.plans[i];
  if(p.mode === mode) return;
  if(mode === 'tiered'){
    const seed = p.price !== '' && p.price != null ? p.price
      : (planPrices(p).length ? String(Math.min(...planPrices(p))) : '');
    doses(S.focus.medication).forEach(d => {
      if(p.tiers[d] == null || p.tiers[d] === '') p.tiers[d] = seed;
    });
  }
  if(mode === 'flat'){
    const ps = planPrices(p);
    if(ps.length && (p.price === '' || p.price == null)) p.price = Math.min(...ps);
  }
  p.mode = mode; render();
}

function careIssues(f){

/* =====================================================================

   Each card stores a "true" absolute effect and a half-width at 95% CI.
   Other CI levels rescale the half-width. The observed mark is always
   the midpoint of the capsule, so the capsule always shrinks symmetrically.
   ===================================================================== */
const STATES = {
  win:  {tile:'t-win',   bar:'s-win',   label:'Significant improvement'},
  loss: {tile:'t-loss',  bar:'s-loss',  label:'Control winning'},
  flat: {tile:'t-flat',  bar:'s-flat',  label:'No significant difference'},
  early:{tile:'t-early', bar:'s-early', label:'Too early to read'},
  trend:{tile:'t-flat',  bar:'s-flat',  label:'Approaching significance'}
};

/* half-width multiplier relative to the 95% CI */
const CI_SCALE = {95:1, 90:0.84, 80:0.68};

/* derive CI bounds and status from the global confidence setting.
   Observed abs is always the midpoint of [lo, hi]. */
function cardStats(d){
  const scale = CI_SCALE[S.conf] || 1;
  const half = d.half95 * scale;
  const lo = d.abs - half;
  const hi = d.abs + half;
  const crosses = lo < 0 && hi > 0;
  // p-value roughly tracks whether the CI crosses zero at the chosen level
  const p = crosses
    ? Math.min(0.99, d.p95 * (S.conf === 95 ? 1 : S.conf === 90 ? 1.4 : 2.0))
    : Math.max(0.001, d.p95 * (S.conf === 95 ? 1 : S.conf === 90 ? 0.7 : 0.4));
  let state = d.state;
  if(d.state === 'early') state = 'early';
  else if(crosses) state = (d.state === 'trend' || Math.abs(d.abs) > half * 0.6) ? 'trend' : 'flat';
  else state = d.abs > 0 ? 'win' : 'loss';
  return {lo, hi, p, state, half};
}

function resultCard(d, i, kind){
  const st = cardStats(d);
  const state = STATES[st.state];
  // scale the track so the observed value sits at a readable position,
  // and the capsule is always centered on it
  const span = Math.max(Math.abs(d.abs) + st.half, 4) * 1.35;
  const dmin = -span, dmax = span;
  const pos = v => ((v - dmin) / (dmax - dmin)) * 100;
  const mid = pos(d.abs);
  const bandL = pos(st.lo), bandR = pos(st.hi);
  const live = kind !== 'fin';
  const daily = Math.round(d.weekly / 7);
  return `<div class="dc" data-act="open-run" data-k="${kind}" data-i="${i}">
    <div class="dc-h">
      ${brandMark(d.bk)}
      <div style="min-width:0;flex:1">
        <div class="dct">${esc(d.t)}</div>
        <div class="k" style="margin-top:2px">${d.b} · day ${d.day} of ${d.of} · ${d.metric}</div>
      </div>
      <span class="pulse ${live?'':'off'}" title="${live?'Enrolling now':'Finished'}">
        <i></i>${daily.toLocaleString()} / day</span>
    </div>

    <div class="tiles">
      <div class="tile ${state.tile}"><div class="tv">${pc(d.rel)}</div><div class="tl">relative change</div></div>
      <div class="tile ${state.tile}"><div class="tv">${pc(d.abs,2)}</div><div class="tl">absolute change</div></div>
    </div>

    <div class="cih">${S.conf}% Confidence Interval
      <span class="info" data-t="The white capsule is the range of plausible values. The gray mark is the observed result, always at its centre. As more data arrives the capsule shrinks in from both sides.">i</span>
    </div>
    <div class="ciwrap">
      <div class="citrack">
        <span class="cipt" style="left:${mid}%">${pc(d.abs,2)}</span>
        <span class="cizl" style="left:${pos(0)}%">0%</span>
        <span class="cizero" style="left:${pos(0)}%"></span>
        <span class="ciband" style="left:${bandL}%;width:${(bandR-bandL).toFixed(2)}%"></span>
        <span class="cimark" style="left:${mid}%"></span>
      </div>
      <div class="ciends"><span>${pc(st.lo,2)}</span><span>${pc(st.hi,2)}</span></div>
    </div>

    <div class="statbar ${state.bar}">${state.label}</div>
    <div class="dcf">
      <span class="k">${live ? 'Enrolling · ' : 'Closed · '}${d.traffic || 25}% of traffic</span>
      <span class="k mono">p = ${st.p.toFixed(3)}</span>
    </div>
  </div>`;
}

function goalFields(f, pfx){
  // pfx keeps field ids unique between the library editor and the in-experiment modal
  const startWk = funnelStep(f.start).wk, evWk = funnelStep(f.event).wk;
  const observed = stepIdx(f.event) > stepIdx(f.start) && startWk
    ? +((evWk / startWk) * 100).toFixed(2) : null;
  const scaled = Math.round(ELIGIBLE * (startWk / FUNNEL[0].wk));
  const binary = (f.kind||'binary') === 'binary';
  return `
    <div style="display:flex;gap:7px;margin-bottom:14px">
      <button class="chip pick ${binary?'on':''}" data-act="metric-kind" data-pfx="${pfx}" data-k="binary">Binary conversion</button>
      <button class="chip pick ${binary?'':'on'}" data-act="metric-kind" data-pfx="${pfx}" data-k="continuous">Continuous mean</button>
    </div>
    ${binary ? `
    <div class="row" style="margin-bottom:12px">
      <div style="flex:1">
        <div class="flab">Start point
          <span class="info" data-t="The denominator. Only people who reach this step can convert, so it also sets how many people per week are measurable.">i</span></div>
        <select class="sel" data-${pfx}s style="width:100%">
          ${FUNNEL.map(s=>`<option value="${s.id}" ${f.start===s.id?'selected':''}>${esc(s.label)}</option>`).join('')}
        </select>
      </div>
      <div style="flex:1">
        <div class="flab">Goal event
          <span class="info" data-t="The numerator. The step you want more people to reach.">i</span></div>
        <select class="sel" data-${pfx}e style="width:100%">
          ${FUNNEL.map(s=>`<option value="${s.id}" ${f.event===s.id?'selected':''}>${esc(s.label)}</option>`).join('')}
        </select>
      </div>
      <div style="max-width:140px">
        <div class="flab">Conversion window</div>
        <div style="display:flex;align-items:center;gap:6px">
          <input class="fld" type="number" min="1" max="90" step="1" value="${esc(f.window)}"
            data-${pfx}w data-fid="${pfx}-win" style="width:72px">
          <span class="k">days</span>
        </div>
      </div>
    </div>
    <div class="goalstrip" style="margin-top:0">
      <div class="gsteps">
        <span class="gs">Start · ${esc(funnelStep(f.start).label)}</span>
        <span class="garr">→</span>
        <span class="gs ${observed!==null?'on':''}">Goal · ${esc(funnelStep(f.event).label)}</span>
      </div>
      <div class="gfacts">
        <div class="gf"><div class="mv">${scaled.toLocaleString()}</div>
          <div class="ml">reach the start point each week</div></div>
        <div class="gf"><div class="mv">${observed===null?'n/a':observed+'%'}</div>
          <div class="ml">observed CR, last 28 days</div></div>
        <div class="gf"><div class="mv">${String(f.baseline||'').trim()!=='' ? f.baseline+'%' : 'observed'}</div>
          <div class="ml">baseline used for planning</div></div>
      </div>
      ${observed===null?`<div class="k" style="margin-top:9px;color:var(--hot)">
        The goal event needs to sit after the start point in the funnel.</div>`:''}
    </div>` : `
    <div class="row" style="margin-bottom:12px">
      <div style="flex:1"><div class="flab">Observation event</div>
        <select class="sel" data-${pfx}e style="width:100%">
          ${FUNNEL.map(s=>`<option value="${s.id}" ${f.event===s.id?'selected':''}>${esc(s.label)}</option>`).join('')}
        </select></div>
      <div><div class="flab">Aggregation</div><div class="fld lock">Mean</div></div>
      <div><div class="flab">Unit</div><input class="fld" data-metric-field="unit" data-pfx="${pfx}" value="${esc(f.unit||'AUD')}"></div>
    </div>
    <div class="row">
      <div><div class="flab">Baseline mean</div><input class="fld" type="number" min="0.01" step="0.01" data-metric-field="baselineMean" data-pfx="${pfx}" value="${esc(f.baselineMean)}"></div>
      <div><div class="flab">Baseline standard deviation</div><input class="fld" type="number" min="0.01" step="0.01" data-metric-field="baselineSd" data-pfx="${pfx}" value="${esc(f.baselineSd)}"></div>
      <div><div class="flab">Weekly observations</div><input class="fld" type="number" min="1" step="1" data-metric-field="weeklyObservations" data-pfx="${pfx}" value="${esc(f.weeklyObservations)}"></div>
    </div>
    <div class="goalstrip"><div class="gsteps"><span class="gs on">Mean · ${esc(funnelStep(f.event).label)}</span></div>
      <div class="gfacts">
        <div class="gf"><div class="mv">${f.baselineMean||'n/a'}</div><div class="ml">baseline mean</div></div>
        <div class="gf"><div class="mv">${f.baselineSd||'n/a'}</div><div class="ml">baseline SD</div></div>
        <div class="gf"><div class="mv">${f.weeklyObservations||'n/a'}</div><div class="ml">observations per week</div></div>
      </div>
    </div>`}`;
}

  const single = ds.length === 1;
  return `<div class="plan">
    <div class="plan-h">
      <select class="sel" data-ldpt="${i}">
        ${PLAN_TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}

      ${single ? `<span class="chip out">single dose</span>` : `
        <div class="seg">
          <button class="${p.mode==='flat'?'on':''}" data-act="lib-plan-mode" data-i="${i}" data-m="flat">One price</button>

      <span class="k" style="margin-left:auto">${esc(planLabel(p))}</span>

          data-fid="ld-dose-${i}-${esc(d).replace(/\s/g,'_')}" placeholder="0" inputmode="numeric">

function viewExperiment(){
  const e = S.exp;
  const statusChip = S.retired
    ? '<span class="chip">Retired</span>'
    : (S.paused ? '<span class="chip a">Paused</span>'
      : (S.published ? `<span class="chip g">Live on ${e.envs.join(' + ')}</span>` : '<span class="chip out">Draft</span>'));
  return `<div class="shell">${nav('exp')}
    <div class="stage">
      <div class="content"><div class="content-inner">
        <div class="page-head">
          <div class="title">
          ${brandMark(e.audience.brand)}
          <div>
            <h1>${e.name.trim() ? esc(e.name) : 'Untitled experiment'}</h1>
          </div>
          </div>
          ${statusChip}
        </div>
        <div class="doc-wrap">
          ${railView()}
          ${S.phase === 'live' ? docLive() : S.phase === 'report' ? docReport() : docSetup()}
        </div>
      </div></div>
    </div></div>`;
}

  return `<div class="doc">
    ${!S.published ? `<div class="lockban draftban">
      <div style="flex:1">

      <button class="btn pri" data-act="draft-save-exit">Save and exit</button>

function liveOverview(){
  const stats = liveStats();
  const {days} = liveWindow();
  const totalN = stats.reduce((a,s)=>a+s.n,0);
  const daily = Math.round(stats.reduce((a,s)=>a + (s.slice.reduce((x,p)=>x+p.n,0) / Math.max(1,s.slice.length)), 0));
  const e = S.exp;
  const metric = metricOf();
  const a = e.audience;
  const ctrl = stats[0];
  const arm = liveCompareArm();
  const testVariants = stats.slice(1);
  const compareIdx = getLiveCompareIdx();
  const smallest = Math.min(...stats.map(s => Math.round(s.n / Math.max(1, liveWindow().end - liveWindow().start + 1) * 7)));
  const nArm = Math.min(...stats.map(s => s.n));
  const curMde = detectableMdeAt(nArm);
  const daysLeft = daysToDetectNum();

  let body = `<div class="k" style="margin-top:4px">Add a second variant to see observed results and predictions.</div>`;
  if(arm){
    const st = STATES[arm.state] || STATES.flat;
    const chipCls = arm.state==='win'?'g':arm.state==='loss'?'h':arm.state==='early'?'a':'out';
    body = `
      ${testVariants.length > 1 ? `<div class="ov-head">
        <div class="rangepick">${testVariants.map((v,i)=>{
          const idx = i + 1;
          return `<button data-act="live-compare" data-i="${idx}" class="${compareIdx===idx?'on':''}">${esc(v.name)} vs ${esc(ctrl.name)}</button>`;
        }).join('')}</div>
        <span class="k">${S.conf}% significance · ${S.power}% power · ${S.exp.mde}% target MDE</span>
      </div>` : `<div class="ov-head"><span class="k">${esc(arm.name)} vs ${esc(ctrl.name)} · ${S.conf}% significance · ${S.power}% power · ${S.exp.mde}% target MDE</span></div>`}
      <div class="ov-primary">
        <div class="ovp">
          <div class="k">${metricKind(metric)==='continuous' ? (esc(metric.name)||'Observed mean') : 'Observed conversion rate'}</div>
          <div class="v">${formatMetricValue(arm.value,metric)}</div>
          <div class="s">Control ${formatMetricValue(ctrl.value,metric)}</div>
        </div>
        <div class="ovp">
          <div class="k">Observed relative change</div>
          <div class="v">${formatRelEffect(arm.rel)}</div>
          <div class="s">${esc(arm.name)} vs ${esc(ctrl.name)}</div>
        </div>
        <div class="ovp">
          <div class="k">Observed absolute change</div>
          <div class="v">${formatAbsEffect(arm.abs,metric)}</div>
          <div class="s">${formatMetricValue(ctrl.value,metric)} → ${formatMetricValue(arm.value,metric)}</div>
        </div>
        <div class="ovp">
          <div class="k">Status</div>
          <div class="v" style="font-size:18px;margin-top:10px"><span class="chip ${chipCls}">${st.label}</span></div>
          <div class="s">At ${S.conf}% significance and ${S.power}% power</div>
        </div>
      </div>
      <div class="ov-secondary">
        <div class="ovs">
          <div class="k">Currently detectable MDE</div>
          <div class="v">${curMde===Infinity?'n/a':curMde+'%'}</div>
          <div class="s">n=${nArm.toLocaleString()} per arm</div>
        </div>
        <div class="ovs">
          <div class="k">Days to hit target MDE</div>
          <div class="v">${daysLeft===Infinity?'n/a':daysLeft}</div>
          <div class="s">Target ${S.exp.mde}% · ~${smallest.toLocaleString()} / week in smallest arm</div>
        </div>
        <div class="ovs">
          <div class="k">Observed p-value</div>
          <div class="v" style="font-size:22px">${arm.p < 0.001 ? '<0.001' : arm.p.toFixed(3)}</div>
          <div class="s">${esc(arm.name)} vs ${esc(ctrl.name)}</div>
        </div>
      </div>`;
  }

  return `<div class="stg ${S.liveSec==='overview'?'act':''}" id="live-overview">
    <div class="sec-h">
      <span class="nm">Overview</span>
      <div class="rt"><span class="chip out">Day ${days} of ${e.lengthDays} · ${e.envs.join(' + ')}</span></div>
    </div>
    ${body}
    <div class="ov-tertiary">
      <span class="ovt"><b>Enrolled in range</b> ${totalN.toLocaleString()} · ~${daily.toLocaleString()} / day</span>
      <span class="ovt"><b>Traffic enrolled</b> ${e.traffic}% · ${e.evenSplit?'Even':'Custom'} split · ${stats.map(s=>`${s.name} ${splitOf(s.id)}%`).join(' · ')}</span>

function convSeriesPts(series, mode){
  const continuous = metricKind(metricOf()) === 'continuous';
  const {start, end} = liveWindow();
  return series.map(s => {
    const slice = s.pts.filter(p => p.day >= start && p.day <= end);
    if(mode !== 'cumulative') return {...s, chartPts: slice.map(p => ({day:p.day, v:continuous?p.mean:p.cr}))};
    if(continuous){
      let runN=0, runSum=0;
      return {...s, chartPts:slice.map(p=>{ runN+=p.n; runSum+=p.mean*p.n; return {day:p.day,v:runN?runSum/runN:0}; })};
    }
    let runN = 0, runC = 0;
    const chartPts = slice.map(p => {
      runN += p.n;
      runC += p.c;
      return {day:p.day, v: runN ? +(runC / runN * 100).toFixed(3) : 0};
    });
    return {...s, chartPts};
  });
}

function convChartSvg(series, mode){
  const metric = metricOf();
  const {start, end} = liveWindow();
  const chartSeries = convSeriesPts(series, mode);
  const W = 720, H = 220, pad = {t:16, r:16, b:28, l:40};
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const all = chartSeries.flatMap(s => s.chartPts.map(p => p.v));
  const baseline = goalBaseline(metric);
  const ymin = Math.max(0, Math.min(...all, baseline) * 0.7);
  const ymax = Math.max(...all, baseline) * 1.15 || 10;
  const x = d => pad.l + ((d - start) / Math.max(1, end - start)) * iw;
  const y = v => pad.t + ih - ((v - ymin) / Math.max(0.001, ymax - ymin)) * ih;
  const paths = chartSeries.map(s => {
    const pts = s.chartPts;
    if(!pts.length) return '';
    const d = pts.map((p,i) => `${i?'L':'M'}${x(p.day).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`
      + pts.map(p => `<circle cx="${x(p.day).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="#fff" stroke="${s.color}" stroke-width="2.2"/>`).join('');
  }).join('');
  const ySuffix = metricKind(metric)==='binary' ? '%' : (metric.unit==='AUD'?' AUD':'');
  const markers = (S.goalChanges||[]).filter(g => g.day >= start && g.day <= end).map(g =>
    `<line x1="${x(g.day).toFixed(1)}" x2="${x(g.day).toFixed(1)}" y1="${pad.t}" y2="${pad.t+ih}"
      stroke="#c47a1a" stroke-dasharray="3 3" stroke-width="1.2"/>
     <text x="${x(g.day).toFixed(1)}" y="${pad.t+10}" text-anchor="middle" font-size="9" fill="#c47a1a">goal</text>`
  ).join('');
  const yTicks = [ymin, (ymin+ymax)/2, ymax].map(v =>
    `<text x="${pad.l-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="#7a8781">${v.toFixed(1)}${ySuffix}</text>
     <line x1="${pad.l}" x2="${pad.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#eef1f0" stroke-width="1"/>`
  ).join('');
  const xTicks = [start, Math.round((start+end)/2), end].map(d =>
    `<text x="${x(d).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#7a8781">D${d}</text>`
  ).join('');
  return `<svg class="chartsvg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${yTicks}${paths}${markers}${xTicks}</svg>`;
}

function ciPlotScale(stats){
  const test = stats.filter((_,i)=>i>0);
  if(!test.length) return null;
  const span = Math.max(...test.map(s => Math.max(Math.abs(s.abs) + s.half, 1.5)), 2) * 1.35;
  const dmin = -span, dmax = span;
  const pos = v => Math.max(0, Math.min(100, ((v - dmin) / (dmax - dmin)) * 100));
  return {dmin, dmax, pos};
}
function ciPlotHtml(s, scale){
  if(!scale || !s) return 'n/a';
  const mid = scale.pos(s.abs);
  const bandL = scale.pos(s.lo), bandR = scale.pos(s.hi);
  const zero = scale.pos(0);
  return `<div class="ciwrap">
    <div class="citrack">
      <span class="cipt" style="left:${mid.toFixed(1)}%">${formatAbsEffect(s.abs,metricOf())}</span>
      <span class="cizl" style="left:${zero.toFixed(1)}%">0</span>
      <span class="cizero" style="left:${zero.toFixed(1)}%"></span>
      <span class="ciband" style="left:${bandL.toFixed(1)}%;width:${Math.max(2, bandR-bandL).toFixed(1)}%"></span>
      <span class="cimark" style="left:${mid.toFixed(1)}%"></span>
    </div>
    <div class="ciends"><span>${formatAbsEffect(s.lo,metricOf())}</span><span>${formatAbsEffect(s.hi,metricOf())}</span></div>
  </div>`;
}

function buildAnalysis(){
  const stats = liveStats();
  const primary = liveCompareArm();
  const g = goalOf();
  const st = primary ? (STATES[primary.state] || STATES.flat) : null;
  if(!primary){
    return `Experiment ${S.exp.name || S.exp.key} does not have a comparison arm yet.`;
  }
  const verdict = primary.state === 'win'
    ? `Variant ${primary.name} beat control on ${g?g.name:'the primary goal'}.`
    : primary.state === 'loss'
      ? `Control beat variant ${primary.name} on ${g?g.name:'the primary goal'}.`
      : primary.state === 'early'
        ? `Too early to call. Sample is still building.`
        : `No significant difference between ${primary.name} and control at ${S.conf}% significance.`;
  const move = `Observed absolute effect ${formatAbsEffect(primary.abs,g)} `
    + `(${formatRelEffect(primary.rel)} relative), ${S.conf}% CI [${formatAbsEffect(primary.lo,g)}, ${formatAbsEffect(primary.hi,g)}], p=${primary.p.toFixed(3)}.`;
  const driver = primary.state === 'win'
    ? 'Likely driver: the variant change set improved conversion along the measured path. Confirm in Amplitude before shipping.'
    : primary.state === 'loss'
      ? 'Likely driver: the variant change set reduced conversion. Prefer holding or iterating rather than shipping.'
      : 'Signal is weak relative to noise. Extend the run or raise traffic if the decision is still open.';
  const rec = primary.state === 'win' ? 'Recommendation: ship the variant and document the change set.'
    : primary.state === 'loss' ? 'Recommendation: keep control. Capture the learning in Notion.'
    : primary.state === 'early' ? 'Recommendation: keep running until the detectable MDE reaches the target.'
    : 'Recommendation: hold. Do not ship on a flat or trending result.';
  return `${verdict}\n\n${move}\n\n${driver}\n\n${rec}\n\nStatus: ${st.label}. Enrolled ${stats.reduce((a,s)=>a+s.n,0).toLocaleString()} people over ${liveDayCount()} days.`;
}

function paintShareCards(){
  const stats = liveStats();
  const primary = stats[1];
  const g = goalOf();
  const name = S.exp.name || ('exp_' + S.exp.key);
  const draw = (id, fn) => {
    const c = document.getElementById(id);
    if(!c) return;
    const ctx = c.getContext('2d');
    fn(ctx, c.width, c.height);
  };
  const bg = (ctx, w, h) => {
    const grd = ctx.createLinearGradient(0,0,w,h);
    grd.addColorStop(0, '#0f1f1a'); grd.addColorStop(1, '#16352b');
    ctx.fillStyle = grd; ctx.fillRect(0,0,w,h);
  };
  const brand = (ctx) => {
    ctx.fillStyle = '#7fd8b8'; ctx.font = '600 22px Inter, system-ui, sans-serif';
    ctx.fillText('MOSHY · Experiment', 56, 64);
  };
  draw('share-result', (ctx,w,h) => {
    bg(ctx,w,h); brand(ctx);
    ctx.fillStyle = '#fff'; ctx.font = '700 54px Inter, system-ui, sans-serif';
    const verdict = !primary ? 'No comparison'
      : primary.state==='win' ? 'Significant win'
      : primary.state==='loss' ? 'Control held'
      : primary.state==='early' ? 'Too early'
      : 'No clear winner';
    ctx.fillText(verdict, 56, 160);
    ctx.fillStyle = '#a9c2b8'; ctx.font = '500 28px Inter, system-ui, sans-serif';
    ctx.fillText(name.slice(0, 48), 56, 220);
    ctx.fillStyle = '#fff'; ctx.font = '700 72px Inter, system-ui, sans-serif';
    ctx.fillText(primary ? formatAbsEffect(primary.abs,g) : 'n/a', 56, 340);
    ctx.fillStyle = '#a9c2b8'; ctx.font = '500 26px Inter, system-ui, sans-serif';
    ctx.fillText(primary ? `${formatRelEffect(primary.rel)} relative · ${g?g.name:''}` : '', 56, 390);
    ctx.fillText(`${S.conf}% CI ${primary?`[${formatAbsEffect(primary.lo,g)}, ${formatAbsEffect(primary.hi,g)}]`:''} · p=${primary?primary.p.toFixed(3):'n/a'}`, 56, 440);
  });
  draw('share-compare', (ctx,w,h) => {
    bg(ctx,w,h); brand(ctx);
    ctx.fillStyle = '#fff'; ctx.font = '700 40px Inter, system-ui, sans-serif';
    ctx.fillText('Variant comparison', 56, 140);
    stats.forEach((s,i) => {
      const y = 210 + i * 120;
      ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(70, y-10, 10, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '650 32px Inter, system-ui, sans-serif';
      ctx.fillText(`${s.name}${i===0?' (control)':''}`, 100, y);
      ctx.fillStyle = '#a9c2b8'; ctx.font = '500 24px Inter, system-ui, sans-serif';
      ctx.fillText(`${formatMetricValue(s.value,g)} · ${s.n.toLocaleString()} observations`
        + (i?` · ${formatRelEffect(s.rel)}` : ''), 100, y+36);
    });
  });
  draw('share-timeline', (ctx,w,h) => {
    bg(ctx,w,h); brand(ctx);
    ctx.fillStyle = '#fff'; ctx.font = '700 40px Inter, system-ui, sans-serif';
    ctx.fillText('Run timeline', 56, 140);
    const days = liveDayCount();
    ctx.fillStyle = '#a9c2b8'; ctx.font = '500 26px Inter, system-ui, sans-serif';
    ctx.fillText(`Day ${days} of ${S.exp.lengthDays} · ${S.exp.traffic}% traffic · ${S.exp.envs.join(' + ')}`, 56, 200);
    const series = liveSeries();
    const padL=56, padR=56, padT=260, padB=80;
    const iw = w-padL-padR, ih = h-padT-padB;
    const continuous = metricKind(g)==='continuous';
    const all = series.flatMap(s=>s.pts.map(p=>continuous?p.mean:p.cr));
    const ymin = Math.min(...all)*0.8, ymax = Math.max(...all)*1.15;
    series.forEach(s => {
      ctx.strokeStyle = s.color; ctx.lineWidth = 4; ctx.beginPath();
      s.pts.forEach((p,i) => {
        const x = padL + ((p.day-1)/Math.max(1,days-1))*iw;
        const val = continuous?p.mean:p.cr;
        const y = padT + ih - ((val-ymin)/Math.max(0.001,ymax-ymin))*ih;
        if(i) ctx.lineTo(x,y); else ctx.moveTo(x,y);
      });
      ctx.stroke();
    });
  });
}

          <div class="phn">Phase ${i+1}</div>
          <div class="pht">${p.label}</div>

      </div>`;
    }).join('')}

      ? 'Publish from Review to unlock the live board.'

        : 'All phases unlocked. Edit setup sections if needed.')}</div>
  </div>`;
}

function lockedSection(s, i){
  const prev = STAGES[i-1];
  return `<div class="stg locked" id="sec-${s.id}">
    <div class="sec-h">
      <span class="nm"><span class="sn">${i+1}</span>${s.label}</span>
      <span class="chip out">complete ${prev.label} first</span>
    </div>
  </div>`;
}

function sectionFor(id){
  if(id === 'setup')    return secSetup();
  if(id === 'goal')     return secGoal();
  if(id === 'audience') return secAudience();
  if(id === 'variants') return secVariants();
  if(id === 'traffic')  return secTraffic();
  return secLaunch();
}

function nextLabel(id){
  const nx = STAGES[stageIdx(id)+1];
  if(!nx) return '';
  if(id === 'setup') return 'Next: Goal';
  if(nx.id === 'launch') return 'Review details';
  return `Next: ${nx.label}`;
}

function secFoot(id){
  if(!showNext(id)) return '';
  const b = stageBlockers(id);
  return `<div class="sec-f">
    <button class="btn pri ${b.length?'is-off':''}" data-act="next" data-s="${id}"
      aria-disabled="${b.length?'true':'false'}"
      title="${b.length?b.join(' · '):''}">${nextLabel(id)}</button>
  </div>`;
}
function secHead(id, right){
  const i = stageIdx(id), s = STAGES[i];
  return `<div class="sec-h">
    <span class="nm"><span class="sn">${stageDone(id)?'✓':i+1}</span>${s.label}</span>
    <div class="rt" id="rt-${id}">${right||''}</div>
  </div>`;
}

const setupRight = () => {
  const b = stageBlockers('setup');
  return b.length
    ? `<span class="chip out">${b.length} required field${b.length===1?'':'s'}</span>`
    : '<span class="chip g">ready to name</span>';
};
const goalRight = () => goalOf()
  ? '<span class="chip g">goal set</span>'
  : '<span class="chip out">1 required field</span>';

function codeToggleRow(label, opts, field, tip){
  ensureCodeCustom();
  const cur = S.exp.code[field];
  const customOn = S.exp.codeCustom[field];
  const rule = CODE_RULES[field];
  const warn = customOn ? codeFieldWarning(field, cur) : '';
  const maxLen = rule.exact || rule.max;
  return `<div class="codegroup" id="codegrp-${field}">
    <div class="flab">${label}${tip?` <span class="info" data-t="${tip}">i</span>`:''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${opts.map(o=>`<button class="chip pick ${!customOn && cur===o.id?'on':''}"
        data-act="code" data-f="${field}" data-v="${o.id}">${esc(o.label)}
        <span class="k" style="margin-left:2px">${o.id}</span></button>`).join('')}
      <button class="chip pick ${customOn?'on':''}" data-act="code" data-f="${field}" data-v="__custom__">Custom</button>
    </div>
    ${customOn ? `<div class="codecustom" style="margin-top:8px">
      <div style="display:flex;gap:8px;align-items:center;max-width:260px">
        <input class="fld mono ${warn?'codewarn':''}" data-code-inp="${field}" data-fid="code-${field}"
          value="${esc(cur)}" placeholder="${'X'.repeat(maxLen)}" maxlength="${maxLen}"
          autocapitalize="characters" spellcheck="false">
        <span class="k">${rule.hint}</span>
      </div>
      <div class="codewarn" id="codewarn-${field}" ${warn?'':'style="display:none"'}>${esc(warn)}</div>
    </div>` : ''}
  </div>`;
}

    <div class="rowline"><span class="lbl">Vertical</span>
      <span class="chip">${esc(vert?vert.label:e.code.vertical)} <span class="k">${esc(e.code.vertical)}</span></span></div>

function secSetup(){

  return `
    <div class="k" style="margin-bottom:13px">
      Pick the primary measure for this experiment. Metrics can be binary conversions or continuous means.</div>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="sel" data-goal data-fid="e-goal" style="flex:1">

      </select>
      <button class="btn sec" data-act="new-goal">New metric</button>
    </div>
    ${g && metricKind(g)==='binary' ? `<div class="goalstrip">

      <div><div class="mv">${ELIGIBLE.toLocaleString()}</div>
        <div class="ml">match per week with this audience</div></div>
    </div>
  </div>`;
}
function secAudience(){
  const summary = setupSummaryMode('audience');
  const editing = setupEditing('audience');
  const right = S.published ? setupEditActions('audience', 'Edit audience attributes') : '';
  return `<div class="stg ${S.activeSection==='audience'?'act':''} ${editing?'editing':''}" id="sec-audience">
    ${secHead('audience', right)}
    ${summary ? audienceSummaryHtml() : `
    <div class="k" style="margin-bottom:13px">

}

function variantsSummaryHtml(){
  const e = S.exp;
  if(!e.variants.length) return `<div class="k">No variants yet.</div>`;
  return `<div class="setupsum">${e.variants.map(v=>{
    const pkgs = v.packages.filter(Boolean).map(id => library[id]?.name || id);
    const care = (v.care||[]).map(id => CARE[id]?.name || id);
    return `<div class="rowline" style="align-items:flex-start">
      <span class="lbl">${esc(v.name||v.id)}</span>
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="chip ${v.role==='control'?'out':''}">${v.role}</span>
        <div class="k">${pkgs.length ? pkgs.map(esc).join(' · ') : 'No packages'}
          ${care.length ? ' · ' + care.map(esc).join(', ') : ''}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}
function secVariants(){
  const e = S.exp, n = e.variants.length, aa = aaVariants(), dc = diffCount();
  const gridable = n >= 2 && n <= 3;
  const showGrid = S.compare && gridable;
  const summary = setupSummaryMode('variants');
  const editing = setupEditing('variants');

  let inner;
  if(n === 0){
    inner = `<button class="empty" data-act="add-variant">+ Add the first variant</button>`;
  } else if(showGrid){
    inner = gridView();
  } else {
    inner = e.variants.map(v=>cardView(v)).join('') +
      `<button class="empty" style="margin-top:4px" data-act="add-variant">+ Add variant</button>`;
  }

  const aaBanner = (aa.length && !e.aaAcknowledged) ? `
    <div class="banner a">
      <div style="flex:1">
        <div class="bt">Variant ${aa.map(v=>v.name||v.id).join(' and ')} ${aa.length>1?'are':'is'} identical to ${e.variants[0].name||e.variants[0].id}</div>
        <div class="bd">Valid as an A/A test. Confirm if intended, or add an override.</div>
      </div>
      <button class="btn sec sm" data-act="ack-aa">Intentional A/A</button>
    </div>` : '';

  const chips = `${n>=2 ? (dc ? `<span class="chip h">${dc} of ${ATTRS.length} attributes differ</span>`
                   : `<span class="chip a">no differences</span>`) : ''}`;
  const right = S.published
    ? `${chips}${setupEditActions('variants', 'Edit variants')}`
    : `${chips}${gridable ? `<button class="btn sec sm" data-act="toggle-compare">
          ${showGrid?'Card view':'Compare view'}</button>` : ''}`;

  return `<div class="stg ${S.activeSection==='variants'?'act':''} ${editing?'editing':''}" id="sec-variants">
    ${secHead('variants', right)}
    ${summary ? variantsSummaryHtml() : `
    ${!S.published && gridable ? '' : (editing && gridable ? `<div style="margin-bottom:10px">
      <button class="btn sec sm" data-act="toggle-compare">${showGrid?'Card view':'Compare view'}</button>
    </div>` : '')}
    ${aaBanner}
    ${inner}
    ${secFoot('variants')}`}
  </div>`;
}

function cardView(v){
  const isCtrl = v.role === 'control';
  const ov = overrideCount(v);
  const aa = !isCtrl && ov === 0 && !S.exp.aaAcknowledged;
  return `<div class="vcard ${isCtrl?'ctrl':(aa?'aa':(ov?'diff':''))}" data-vid="${v.id}">
    <div class="vcard-h">
      <div style="display:flex;align-items:center;gap:9px">
        <input class="fld inline" data-vn="${v.id}" data-fid="vn-${v.id}" value="${esc(v.name||v.id)}"
          style="width:${Math.max(40,(v.name||v.id).length*10)}px">
        <span class="k">${isCtrl?'control':'test'}</span>
        ${v.inherits ? `<span class="chip ${ov?'h':'a'}">inherits ${v.inherits} · ${ov} override${ov===1?'':'s'}</span>`
                     : (isCtrl?'<span class="chip out">baseline</span>':'')}
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn sec xs" data-act="clone" data-v="${v.id}">Clone</button>
        ${!isCtrl?`<button class="btn danger xs" data-act="rm-variant" data-v="${v.id}">Remove</button>`:''}
      </div>
    </div>
    <div class="slots">
      ${v.packages.map((p,i)=>{
        const P = library[p];
        return `<button class="slot ${P&&P.isNew?'new':''}" data-act="pick" data-v="${v.id}" data-i="${i}">
          ${P?esc(P.name):'empty slot'}
          <span class="pm">${P?P.plans.map(x=>{const ps=planPrices(x);return ps.length?money(Math.min(...ps)):'';}).filter(Boolean).join(' / '):''}</span>
        </button>`;
      }).join('')}
      <button class="slot add" data-act="pick" data-v="${v.id}" data-i="${v.packages.length}">+ add package</button>
    </div>
    ${careRow(v)}
  </div>`;
}

/* care products attached straight to a variant, on top of whatever the packages include */
function careRow(v){
  const direct = (v.care||[]).filter(id => CARE[id]);
  const inherited = pkgCareIds(v).filter(id => CARE[id] && !direct.includes(id));
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px;
    padding-top:10px;border-top:1px dashed var(--line)">
    <span class="k" style="margin-right:2px">Care products</span>
    ${direct.map(id=>`<button class="chip rm" data-act="rm-care" data-v="${v.id}" data-c="${id}">
      ${esc(CARE[id].name)} <span class="x">×</span></button>`).join('')}
    ${inherited.map(id=>`<span class="chip out" title="Comes with an attached package">
      ${esc(CARE[id].name)} · in package</span>`).join('')}
    <button class="chip out" style="cursor:pointer" data-act="pick-care" data-v="${v.id}">+ add care product</button>
  </div>`;
}

function gridView(){
  const vs = S.exp.variants;
  const rows = diffRows();
  const canAdd = vs.length < 3;
  const cols = `152px repeat(${vs.length}, minmax(180px,1fr))` + (canAdd ? ' 116px' : '');
  const bodyH = rows.length * 54;
  return `<div class="grid" style="grid-template-columns:${cols}">
    <div><div class="gh">Attribute</div>
      ${rows.map(r=>`<div class="gl">${r.differs?'<span class="dot"></span>':''}${r.attr.label}</div>`).join('')}
      <div class="grid-actions"></div>
    </div>
    ${vs.map((v,ci)=>{
      const ov = overrideCount(v);
      return `<div>
        <div class="colh">
          <input class="fld inline" data-vn="${v.id}" data-fid="vn-${v.id}" value="${esc(v.name||v.id)}"
            style="width:${Math.max(36,(v.name||v.id).length*10)}px">
          <span class="k" style="font-size:11px">${v.role}</span>
          ${ci===0
            ? `<button class="btn sec xs" data-act="clone" data-v="${v.id}">Clone</button>`
            : `<span class="chip ${ov?'h':'a'}" style="font-size:10.5px">${ov} override${ov===1?'':'s'}</span>`}
        </div>
        ${rows.map(r=>{
          const val = r.vals[ci];
          const same = ci>0 && val === r.base;
          const diff = ci>0 && val !== r.base;
          const cls = diff ? 'diff' : (same ? 'same' : (val===null ? 'none' : ''));
          return `<div class="cel ${cls}" title="${val===null?'none':esc(val)}">
            ${diff?'<span class="dot"></span>':''}<span class="txt">${val===null?'none':esc(val)}</span></div>`;
        }).join('')}
        <div class="grid-actions">
          <button class="slot add" style="font-size:11.5px;padding:5px 9px"
            data-act="pick" data-v="${v.id}" data-i="${v.packages.length}">+ package</button>
          <button class="slot add" style="font-size:11.5px;padding:5px 9px"
            data-act="pick-care" data-v="${v.id}">+ care product</button>
          ${v.role!=='control'?`<button class="btn danger xs" data-act="rm-variant" data-v="${v.id}">Remove</button>`:''}
        </div>
      </div>`;
    }).join('')}
    ${canAdd?`<div><div class="gh">&nbsp;</div>
      <button class="empty" style="height:${bodyH - 8}px;width:100%;display:flex;align-items:center;justify-content:center"
        data-act="add-variant">+ variant</button></div>`:''}
  </div>
  <div class="k" style="margin-top:6px">Dashed cells are identical to the control. Click a variant name to rename it.</div>`;
}

function funnelInner(){
  const e = S.exp;
  const rest = 100 - e.traffic;
  const shades = ['#0f6b52','#3d8a72','#6aa993','#97c8b5'];
  return e.variants.map((v,i)=>{
    const share = e.traffic * (splitOf(v.id)/100);
    return `<i style="flex:${Math.max(share,0.1)*10};background:${shades[i%4]}">
      ${share>=6?`${esc(v.name||v.id)} · ${share.toFixed(share%1?1:0)}%`:''}</i>`;
  }).join('')
    + (rest>0?`<i class="o" style="flex:${rest*10}">${rest>10?'Not enrolled · '+rest+'%':''}</i>`:'');
}

function ckRow(c){

  return `<div class="ck ${cls}">

    <div class="ckb">
      <div class="ckt">${c.t}</div>

    </div>
    ${c.ok ? '' : `<button class="btn sec xs" data-act="go-stage" data-s="${c.jump}">Fix</button>`}

}

/* one shell, three bodies. Dark scrim strip on the left, panel fills the rest */
function gtmShell({crumb, title, issues, saveLabel, body, solo}){
  return `<div class="gtm" data-act="gtm-scrim">

function builderCrumb(what){
  const ret = S.focus.returnTo;
  if(ret && ret.variantId){
    const v = S.exp.variants.find(x=>x.id===ret.variantId) || {};
    return `Variant <b>${esc(v.name||ret.variantId)}</b> · new ${what}`;
  }
  if(ret && ret.setPrimary) return `Experiment <b>${esc(S.exp.name.trim()||'untitled')}</b> · new ${what}`;
  if(ret && ret.pkgDraft) return `Care package <b>${esc(ret.pkgDraft.name||'untitled')}</b> · new ${what}`;
  if(ret && ret.fromChat) return `Assistant · new ${what}`;
  return `Library · new ${what}`;
}
const focusSaveLabel = () => {
  const ret = S.focus.returnTo;
  if(ret && ret.variantId) return 'Save and attach';
  if(ret && ret.setPrimary) return 'Save and use';
  if(ret && ret.pkgDraft) return 'Save and add';
  return 'Save';
};

function pkgPreview(){
  const f = S.focus;
  const priced = f.plans.filter(p => planPrices(p).length);
  const inc = f.care.map(id=>CARE[id]).filter(c=>c && c.mode==='included');
  const add = f.care.map(id=>CARE[id]).filter(c=>c && c.mode==='addon');
  const cheapest = priced.length
    ? priced.reduce((a,b)=> Math.min(...planPrices(a)) <= Math.min(...planPrices(b)) ? a : b) : null;
  return `<div class="nub"></div>
    <div class="k" style="margin-bottom:11px">Checkout preview</div>
    ${priced.length ? priced.map(p=>{
      const ps = planPrices(p), lo = Math.min(...ps), hi = Math.max(...ps);
      const best = p === cheapest;
      return `<div class="pl ${best?'on':''}">
        <div class="pt"><span>${p.type}</span>${best&&priced.length>1?'<span class="chip g" style="font-size:9.5px">best value</span>':''}</div>
        <div class="pp">${money(lo)}<span>/mo</span></div>
        <div class="pm">${p.mode==='tiered'
          ? (lo===hi ? 'Same at every dose' : 'From ' + money(lo) + ' to ' + money(hi) + ' by dose')
          : 'One price at every dose'}</div>
      </div>`;
    }).join('') : `<div class="pl"><div class="pt">No priced plan yet</div>
        <div class="pm" style="margin-top:4px">Add a price to see the checkout.</div></div>`}
    ${inc.length ? `<div class="k" style="margin:11px 0 5px">Included</div>
      ${inc.map(c=>`<div style="font-size:12px;display:flex;gap:6px;margin-bottom:3px">

    ${add.length ? `<div class="k" style="margin:11px 0 5px">Add to your plan</div>
      ${add.map(c=>`<div style="font-size:12px;display:flex;justify-content:space-between;margin-bottom:3px">

}

        <button class="btn danger" data-act="replace-draft-confirm">Replace draft</button></div>
    </div></div>`;
  }
  if(m.type === 'live-update-confirm'){
    return `<div class="pop-bg" data-act="close-modal"><div class="pop" data-stop style="max-width:440px">
      <div class="pop-h"><div class="t">Update live allocation?</div>
        <div class="k" style="margin-top:6px">Variants or traffic changed. New visitors will use the updated allocation, while existing enrolments keep their assignment.</div></div>
      <div class="pop-f"><button class="btn sec" data-act="close-modal">Review changes</button>
        <button class="btn pri" data-act="setup-save-confirm">Update experiment</button></div>
    </div></div>`;
  }
  if(m.type === 'traffic-confirm'){
    return `<div class="pop-bg" data-act="close-modal"><div class="pop" data-stop style="max-width:420px">
      <div class="pop-h">
        <div class="t">Update live traffic?</div>
        <div class="k" style="margin-top:6px">This experiment is live. Changing traffic will alter how new visitors are enrolled from now on. Existing enrolled users stay on their assigned variants.</div>
      </div>
      <div class="pop-f">
        <button class="btn sec" data-act="close-modal">Cancel</button>
        <button class="btn pri" data-act="setup-save-confirm">Save changes</button>
      </div>
    </div></div>`;
  }
  if(m.type === 'variants-confirm'){
    return `<div class="pop-bg" data-act="close-modal"><div class="pop" data-stop style="max-width:440px">
      <div class="pop-h">

  return '';

/* --- tiny intent parser: enough to feel real without pretending to be an LLM --- */
function parseChat(text){
  const t = text.toLowerCase();
  const money = [...t.matchAll(/\$\s?(\d[\d,]*)/g)].map(m=>Number(m[1].replace(/,/g,'')));
  const region = (t.match(/\b(au|nz|my)\b/) || [])[1];
  const med = t.includes('tirzepatide') ? 'Tirzepatide'
    : t.includes('contrave') ? 'Contrave'
    : t.includes('semaglutide') ? 'Semaglutide' : null;
  const named = (text.match(/called\s+"?([^",.]+)"?/i) || text.match(/"([^"]+)"/) || [])[1];

  const isGoal = /\bgoal\b|conversion rate|detect|start point/.test(t);
  // a package wins whenever the request names a package, a medication or a plan length
  const packageSignal = /\bpackage\b|\bplan\b|premium|starter|standard|maintenance/.test(t)
    || !!med || PLAN_TYPES.some(pt => t.includes(pt.toLowerCase()));
  const isCare = !packageSignal
    && /care product|add-?on|consult|coaching|blood|panel|shake|\btest\b/.test(t);
  const uniqueName = (base, taken) => {
    const used = taken.map(x => x.toLowerCase());
    if(!used.includes(base.toLowerCase())) return base;
    let i = 2;
    while(used.includes(`${base} ${i}`.toLowerCase())) i++;
    return `${base} ${i}`;
  };

  if(isGoal){
    const step = (needle, fallback) => {
      const hit = FUNNEL.find(s => t.includes(s.label.toLowerCase()));
      return hit ? hit.id : fallback;
    };
    // find the two funnel steps mentioned, in order of appearance
    const hits = FUNNEL.map(s=>({id:s.id, at:t.indexOf(s.label.toLowerCase())}))
      .filter(x=>x.at >= 0).sort((a,b)=>a.at-b.at);
    const start = hits[0] ? hits[0].id : step(null,'lp_view');
    let ev = hits[1] ? hits[1].id : 'purchase';
    if(stepIdx(ev) <= stepIdx(start)) ev = FUNNEL[Math.min(stepIdx(start)+1, FUNNEL.length-1)].id;
    const win = Number((t.match(/(\d+)\s*day/) || [])[1]) || 14;
    const draft = Object.assign(blankGoalDraft(), {
      name: named || uniqueName(`${funnelStep(start).label} to ${funnelStep(ev).label.toLowerCase()}`,
        Object.values(GOALS).map(g=>g.name)),
      start, event:ev, window:win, note:'Created from the assistant'
    });
    return {
      kind:'goal', draft,
      title:'Primary metric to create',
      rows:[['name', draft.name], ['start point', funnelStep(start).label],
        ['goal event', funnelStep(ev).label], ['window', win + ' days'],
        ['baseline', goalObserved({start, event:ev}) + '% observed']],
      issues: goalIssues(draft)
    };
  }

  if(isCare){
    const addon = /add-?on|\$/.test(t);
    const kind = /consult|call|coaching/.test(t) ? 'Consult' : (/test|panel|blood/.test(t) ? 'Test' : 'Product');
    const draft = Object.assign(blankLibCare(), {
      name: named || (kind === 'Consult' ? 'New consult' : 'New care product'),
      kind, mode: addon ? 'addon' : 'included',
      price: addon && money.length ? String(money[0]) : '',
      note:'Created from the assistant'
    });
    return {
      kind:'care', draft,
      title:'Care product to create',
      rows:[['name', draft.name], ['type', kind],
        ['pricing', addon ? 'Add-on ' + (money.length?('$'+money[0]):'no price yet') : 'Included in package']],
      issues: careIssues(draft)
    };
  }

  // default: a care package
  const types = PLAN_TYPES.filter(pt => t.includes(pt.toLowerCase().replace('-',' ')) || t.includes(pt.toLowerCase()));
  const plans = (types.length ? types : ['Monthly']).map((type,i)=>{
    const price = money[i] != null ? String(money[i]) : (money[0] != null ? String(money[0]) : '');
    return {type, mode:'flat', price, tiers:{}};
  });
  const reg = (region || S.exp.audience.country || 'AU').toUpperCase();
  const draft = {
    builder:'package', returnTo:null, editId:null,
    name: named || uniqueName(
      `${reg} ${med || 'Semaglutide'} ${/premium/.test(t)?'Premium':/starter/.test(t)?'Starter':'Standard'}`,
      Object.values(library).map(P=>P.name)),
    region: reg, vertical: S.exp.audience.vertical || 'Weight loss',
    medication: med || 'Semaglutide',
    plans,
    care: Object.values(CARE).filter(c => t.includes(c.name.toLowerCase().split(' ')[0])).map(c=>c.id)
  };
  return {
    kind:'package', draft,
    title:'Care package to create',
    rows:[['name', draft.name], ['region', draft.region], ['medication', draft.medication],
      ['plans', plans.map(p=>p.type + (p.price?` $${p.price}`:' unpriced')).join(', ')],
      ['care products', draft.care.length ? draft.care.map(id=>CARE[id].name).join(', ') : 'none']],
    issues: pkgIssues(draft)
  };
}

function chatSend(){
  const c = S.chat;
  const text = c.input.trim();
  if(!text) return;
  if(!c.msgs.length) c.msgs.push(chatGreeting());
  c.msgs.push({role:'me', text});
  const p = parseChat(text);
  c.msgs.push({role:'tool', text:`→ ${CHAT_TOOLS[p.kind]}.preview\n${JSON.stringify(chatPayload(p), null, 1)}`});
  c.msgs.push({role:'ag', text: p.issues.length
    ? `Here is the record. ${p.issues[0]} before I can write it, or open the builder to finish it.`
    : 'Here is the record I will write. Check it and tell me to create it.'});
  c.pending = p;
  c.input = '';
  render();
}
function chatPayload(p){
  const d = p.draft;
  if(p.kind === 'goal') return {name:d.name, start:d.start, event:d.event, window:Number(d.window)};
  if(p.kind === 'care') return {name:d.name, kind:d.kind, mode:d.mode, price:Number(d.price||0)};
  return {name:d.name, region:d.region, medication:d.medication,
    plans:d.plans.map(x=>({type:x.type, price:Number(x.price||0)})), care:d.care};
}
function chatApply(){
  const c = S.chat, p = c.pending;
  if(!p || p.issues.length) return;
  let name = '', where = '';
  if(p.kind === 'goal'){ const {id} = persistGoal(p.draft); name = GOALS[id].name; where = 'Primary metrics'; }
  else if(p.kind === 'care'){
    const id = 'care_' + Date.now();
    CARE[id] = {id, name:p.draft.name.trim(), kind:p.draft.kind, mode:p.draft.mode,
      price: p.draft.mode === 'addon' ? Number(p.draft.price||0) : 0, note:p.draft.note||'', isNew:true};
    name = CARE[id].name; where = 'Care products';
  } else { const {id} = persistPackage(p.draft); name = library[id].name; where = 'Care packages'; }
  c.msgs.push({role:'tool', text:`→ ${CHAT_TOOLS[p.kind]}\n✓ created`});
  c.msgs.push({role:'ag', text:`Created ${name}. You will find it under ${where}, and it is selectable on any experiment.`});
  c.pending = null;
  save(); render();
  toast(`${name} created by the assistant.`);
}
function chatEdit(){
  const p = S.chat.pending;
  if(!p) return;
  S.chat.open = false; S.chat.pending = null;
  if(p.kind === 'goal') openGoalBuilder({fromChat:true}, p.draft);
  else if(p.kind === 'care') openCareBuilder({fromChat:true}, p.draft);
  else { S.focus = Object.assign({}, p.draft, {returnTo:{fromChat:true}}); render(); }
}

function ruleMatches(){
  const q = S.ruleQuery.trim().toLowerCase();
  return q ? EXTRA_PROPS.filter(p => p.toLowerCase().includes(q)) : EXTRA_PROPS;
}
function ruleListInner(){
  const cur = S.exp.audience.extra;
  const list = ruleMatches();
  if(!list.length) return `<div class="blank" style="padding:34px 10px">No property matches that.</div>`;
  return list.map(p=>{
    const dis = cur.includes(p);
    return `<div class="opt ${dis?'dis':''}" ${dis?'':`data-act="add-rule-do" data-r="${esc(p)}"`}>
      <div class="on">${esc(p)}</div>
      ${dis?'<span class="chip out">added</span>':'<span class="chip">Add</span>'}</div>`;
