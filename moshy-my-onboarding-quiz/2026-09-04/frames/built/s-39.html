<!DOCTYPE html>
<html lang="en" class="frame-preview">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Stat reveal</title>
  <link rel="stylesheet" href="../../design/act-2-spacing.lock.css" />
  <link rel="stylesheet" href="../../design/midfi-shared.css" />
  <link rel="stylesheet" href="../../design/frame-hifi.css" />
  <link rel="stylesheet" href="../components/cta-primary/component.css" />
  <link rel="stylesheet" href="../components/question/component.css" />
  <link rel="stylesheet" href="../components/trustpilot-row/component.css" />
  <link rel="stylesheet" href="../components/legal-fine/component.css" />
  <link rel="stylesheet" href="../components/numeric-input/component.css" />
  <link rel="stylesheet" href="../components/numeric-input-dock/component.css" />
  <link rel="stylesheet" href="../components/loader-step/component.css" />
  <link rel="stylesheet" href="../components/loader-stack/component.css" />
  <link rel="stylesheet" href="../templates/loader/template.css" />
  <link rel="stylesheet" href="../templates/stat-reveal/template.css" />
<style id="template-spacing">
:root {
  --quiz-gap-chrome-headline: 24px;
  --quiz-gap-content-footer: 24px;
  --quiz-gap-cta-trust: 8px;
  --quiz-gap-eyebrow-lead: 12px;
  --quiz-gap-lead-stat: 8px;
  --quiz-gap-stat-chart: 16px;
  --quiz-gap-trust-bottom: 16px;
}
</style>
</head>
<body>
<div class="phone phone--hifi phone--stat-reveal has-footer-dock" data-reveal-motion data-variant="statFadeHold">
  <div class="quiz-scroll">
    <div class="quiz-main quiz-main--stat-reveal">
      <div class="spacing-block" data-gap="chrome-headline" data-token="lg" data-px="24px"></div>
      <div class="mnode" data-k="eyebrow"><p class="reveal-eyebrow">Your 12-month estimate</p></div>
      <div class="spacing-block" data-gap="eyebrow-lead" data-token="sm" data-px="12px"></div>
      <div class="mnode" data-k="lead"><p class="reveal-lead">At your current weight, with Moshy you could lose up to</p></div>
      <div class="spacing-block" data-gap="lead-stat" data-token="xs" data-px="8px"></div>
      <div class="mnode" data-k="statBlock">
        <p class="stat-hero mnode" data-k="stat"><span data-stat-num>0</span><span class="unit">kg</span></p>
        <p class="stat-sub mnode" data-k="sub"><strong>over 12 months</strong><em>~12% body mass · estimate only</em></p>
      </div>
      <div class="spacing-block" data-gap="stat-chart" data-token="md" data-px="16px"></div>
      <div class="chart-fullbleed mnode" data-k="chart">
        <div class="weight-chart" data-chart-root>
  <div class="dot start-dot mnode" data-k="startDot"></div>
  <div class="dot end-dot mnode" data-k="endDot"></div>
  <svg viewBox="0 0 300 140" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="statChartGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4d41f0" stop-opacity="0.2"/>
        <stop offset="100%" stop-color="#4d41f0" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path class="fill" data-chart-fill pathLength="1" d="M12,32 C80,38 140,72 200,98 S280,118 278,118 L278,132 L12,132 Z" fill="url(#statChartGrad)"/>
    <path class="main" data-chart-line pathLength="1" d="M12,32 C80,38 140,72 200,98 S280,118 278,118"/>
  </svg>
  <div class="axis-label mnode" data-k="axis"><span>Today</span><span>12 months</span></div>
</div>

      </div>
    </div>
  </div>
  <div class="footer-dock">
    <div class="spacing-block" data-gap="content-footer" data-token="lg" data-px="24px"></div>
    <div class="mnode" data-k="cta"><button class="input-cta" type="button">Continue</button></div>
    <div class="spacing-block" data-gap="cta-trust" data-token="xs" data-px="8px"></div>
    <div class="trust-row trust-row--embed" data-layer="trust block">
  <div class="trust-row__embed">
    <div class="trustpilot-widget"
      data-locale="en-AU"
      data-template-id="5419b637fa0340045cd0c936"
      data-businessunit-id="665c9030d93d3d8666e023d9"
      data-style-height="20px"
      data-style-width="100%"
      data-token="66d3ceff-718a-448e-9e37-a90847f5fcfc">
      <a href="https://www.trustpilot.com/review/www.getmoshy.com.au" target="_blank" rel="noopener noreferrer">Trustpilot</a>
    </div>
    <div class="trust-row__link-block" aria-hidden="true"></div>
  </div>
</div>
<script src="../components/trustpilot-row/trustpilot-embed.js"></script>
<div class="spacing-block is-hidden" data-gap="trust-legal" data-legal-slot></div><div class="legal-block is-hidden" data-legal-slot><p class="fine">By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></p></div><div class="spacing-block" data-gap="trust-bottom" data-token="md" data-px="16px"></div>
  </div>
</div>
<script src="../shared/reveal-motion-engine.js"></script>
<script src="../templates/stat-reveal/preview.js"></script>

</body>
</html>
