<!DOCTYPE html>
<html lang="en" class="frame-preview">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Checking eligibility</title>
  <link rel="stylesheet" href="../../design/act-2-spacing.lock.css" />
  <link rel="stylesheet" href="../../design/midfi-shared.css" />
  <link rel="stylesheet" href="../../design/frame-hifi.css" />
  <link rel="stylesheet" href="../components/cta-primary/component.css" />
  <link rel="stylesheet" href="../components/question/component.css" />
  <link rel="stylesheet" href="../components/trustpilot-row/component.css" />
  <link rel="stylesheet" href="../components/legal-fine/component.css" />
  <link rel="stylesheet" href="../components/numeric-input/component.css" />
  <link rel="stylesheet" href="../components/numeric-input-dock/component.css" />

  <link rel="stylesheet" href="../templates/loader/template.css" />
  <link rel="stylesheet" href="../templates/loader/template.css" />
<style id="template-spacing">
:root {
  --quiz-gap-subhead-content: 60px;
}
</style>
</head>
<body>
<div class="phone phone--hifi phone--loader">
  <div class="quiz-scroll">
    <div class="quiz-main quiz-main--loader">
      <div class="content-block">
        <div class="loader-zone" data-loader-preview>
          <div class="question-block">
  <h2 class="q-head">One moment</h2>
  <p class="q-sub">Checking your BMI and health profile.</p>
</div>

          <div class="spacing-block" data-gap="subhead-content" data-token="3xl" data-px="60px"></div>
          <div
  class="loader-steps"
  data-loader-steps
  data-default-step-ms="950"
  data-pause-after-complete-ms="1500"
>
<div class="loader-step is-wait" data-loader-step data-duration-ms="900"><span class="loader-step-icon" aria-hidden="true"></span><span class="loader-step-label">BMI range</span></div><div class="loader-step is-wait" data-loader-step data-duration-ms="1100"><span class="loader-step-icon" aria-hidden="true"></span><span class="loader-step-label">Health profile</span></div><div class="loader-step is-wait" data-loader-step data-duration-ms="800"><span class="loader-step-icon" aria-hidden="true"></span><span class="loader-step-label">Confirming eligibility</span></div>
</div>

        </div>
      </div>
    </div>
  </div>
</div>
<script src="../components/loader-step/icons.js"></script>
<script src="../components/loader-stack/preview.js"></script>

</body>
</html>
