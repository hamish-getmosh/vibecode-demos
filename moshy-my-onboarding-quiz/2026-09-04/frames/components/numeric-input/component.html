<label class="num-field">
  <span class="num-field__body">
    <span class="num-field__cluster">
      <span class="num-field__value-wrap">
        <input type="text" class="num-field__input" inputmode="decimal" value="{{value}}" aria-label="{{ariaLabel}}" readonly tabindex="-1" />
      </span>
      <span class="num-field__unit-wrap">
        <span class="unit">{{unit}}</span>
      </span>
    </span>
  </span>
</label>
