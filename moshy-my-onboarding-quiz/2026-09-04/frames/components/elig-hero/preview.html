<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elig hero · preview</title>
  <link rel="stylesheet" href="../../design/frame-hifi.css">
  <link rel="stylesheet" href="component.css">
  <style>
    body { margin: 0; padding: 24px; background: linear-gradient(165deg, #f6e8ff 0%, #fdeef6 42%, #ebe6ff 100%); }
    .wrap { max-width: 390px; margin: 0 auto; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="elig-hero">
      <div class="elig-pass" aria-hidden="true">
        <span class="elig-pass__icon">✓</span>
      </div>
      <div class="question-block elig-hero__copy">
        <h2 class="q-head">Your BMI is in range</h2>
        <p class="q-sub">Next we'll build your metabolic profile and show you a personalised weight estimate.</p>
      </div>
    </div>
  </div>
</body>
</html>
