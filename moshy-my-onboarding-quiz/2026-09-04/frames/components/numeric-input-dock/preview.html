<!DOCTYPE html>
<html lang="en" class="frame-preview component-lab">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>numeric-input-dock · preview</title>
  <link rel="stylesheet" href="../../../design/act-2-spacing.lock.css" />
  <link rel="stylesheet" href="../../../design/midfi-shared.css" />
  <link rel="stylesheet" href="../../../design/frame-hifi.css" />
  <link rel="stylesheet" href="../cta-primary/component.css" />
  <link rel="stylesheet" href="../numeric-input/component.css" />
  <link rel="stylesheet" href="../trustpilot-row/component.css" />
  <link rel="stylesheet" href="../legal-fine/component.css" />
  <link rel="stylesheet" href="component.css" />
  <style>
    :root {
      --quiz-gap-trust-legal: 8px;
      --quiz-gap-trust-bottom: 16px;
    }
    .spacing-block[data-gap="trust-legal"] { padding-top: var(--quiz-gap-trust-legal); }
    .spacing-block[data-gap="trust-bottom"] { padding-top: var(--quiz-gap-trust-bottom); }
  </style>
</head>
<body>
<div class="phone phone--hifi">
  <div class="quiz-scroll">
    <div class="quiz-main">
      <div class="content-block">
        <div class="numeric-input-dock">
          <label class="num-field focused" id="num-field">
            <span class="num-field__body">
              <span class="num-field__value-wrap">
                <input type="text" class="num-field__input" id="num-input" inputmode="decimal" placeholder="0" value="165" aria-label="Height in centimetres" readonly tabindex="-1" />
              </span>
              <span class="unit" id="num-unit">cm</span>
            </span>
          </label>
          <button class="input-cta" type="button">Continue →</button>
          <div class="trust-row trust-row--embed" data-layer="trust block">
            <div class="trust-row__embed">
              <div class="trustpilot-widget"
                data-locale="en-AU"
                data-template-id="5419b637fa0340045cd0c936"
                data-businessunit-id="665c9030d93d3d8666e023d9"
                data-style-height="20px"
                data-style-width="100%"
                data-token="66d3ceff-718a-448e-9e37-a90847f5fcfc">
                <a href="https://www.trustpilot.com/review/www.getmoshy.com.au" target="_blank" rel="noopener noreferrer">Trustpilot</a>
              </div>
              <div class="trust-row__link-block" aria-hidden="true"></div>
            </div>
          </div>
          <div class="spacing-block is-hidden" id="legal-gap" data-gap="trust-legal"></div>
          <div class="legal-block is-hidden" id="legal-block"><p class="fine">By continuing you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a></p></div>
          <div class="spacing-block" data-gap="trust-bottom"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="numpad-dock" id="numpad" aria-hidden="true">
    <div class="numpad-grid">
      <key data-key="1">1</key><key data-key="2">2</key><key data-key="3">3</key>
      <key data-key="4">4</key><key data-key="5">5</key><key data-key="6">6</key>
      <key data-key="7">7</key><key data-key="8">8</key><key data-key="9">9</key>
      <key class="action" data-key=".">.</key><key data-key="0">0</key><key class="action" data-key="back">⌫</key>
    </div>
  </div>
</div>
<script src="../trustpilot-row/trustpilot-embed.js"></script>
<script src="preview.js"></script>
</body>
</html>
