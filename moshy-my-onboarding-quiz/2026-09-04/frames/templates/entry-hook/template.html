<div class="phone phone--hifi phone--entry-hook has-footer-dock">
  <div class="brand-shell">
    <div class="brand-bar">
      <div class="logo">moshy</div>
      <div class="lang">EN</div>
    </div>
  </div>
  <div class="quiz-scroll no-pad-x">
    <div class="entry-hero" data-layer="hero block">
      <div class="entry-hero__wash" aria-hidden="true"></div>
      <div class="entry-hero__fig" aria-hidden="true">
        <div class="entry-hero__ring">
          <svg class="entry-hero__icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="22" cy="38" r="10" stroke="currentColor" stroke-width="3"/>
            <path d="M30 38h18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M48 38v-8a8 8 0 0 0-16 0v14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="entry-copy">
      <div class="spacing-block" data-gap="chrome-headline"></div>
      {{> question}}
    </div>
  </div>
  <div class="footer-dock">
    <div class="spacing-block" data-gap="content-footer"></div>
    <button class="input-cta input-cta--entry" type="button">{{ctaLabel}}</button>
    <div class="spacing-block" data-gap="cta-trust"></div>
    {{footerTrustLegal}}
  </div>
</div>
