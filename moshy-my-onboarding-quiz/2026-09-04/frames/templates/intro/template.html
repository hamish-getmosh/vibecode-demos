<div class="phone phone--hifi phone--intro has-footer-dock">
  <div class="brand-shell">
    <div class="brand-bar">
      <div class="logo">moshy</div>
      <div class="lang">EN</div>
    </div>
  </div>
  <div class="quiz-scroll">
    <div class="quiz-main quiz-main--intro">
      <div class="spacing-block" data-gap="chrome-headline"></div>
      {{> question}}
      {{headlineTail}}
      <div class="intro-roadmap-visual" data-layer="roadmap visual" aria-hidden="true">
        <div class="intro-roadmap-visual__track"></div>
        <div class="intro-roadmap-visual__nodes">
          <span class="intro-roadmap-visual__node intro-roadmap-visual__node--check"></span>
          <span class="intro-roadmap-visual__node intro-roadmap-visual__node--chart"></span>
          <span class="intro-roadmap-visual__node intro-roadmap-visual__node--doctor"></span>
        </div>
      </div>
      <div class="spacing-block" data-gap="visual-steps"></div>
      <ol class="intro-steps">
        {{#each steps}}
        <li class="intro-step">
          <span class="intro-step__num" aria-hidden="true">{{number}}</span>
          <p class="intro-step__text">{{text}}</p>
        </li>
        {{/each}}
      </ol>
    </div>
  </div>
  <div class="footer-dock">
    <div class="spacing-block" data-gap="content-footer"></div>
    <button class="input-cta input-cta--intro" type="button">{{ctaLabel}}</button>
    <div class="spacing-block" data-gap="cta-trust"></div>
    {{footerTrustLegal}}
  </div>
</div>
