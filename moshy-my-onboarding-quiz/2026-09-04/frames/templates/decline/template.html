<div class="phone phone--hifi phone--decline has-footer-dock">
  <div class="quiz-scroll">
    <div class="quiz-main">
      <div class="spacing-block" data-gap="chrome-headline"></div>
      <div class="content-block decline-copy">
        <h2 class="q-head">{{headline}}</h2>
        <div class="spacing-block" data-gap="headline-content"></div>
        <p class="decline-body">{{body1}}</p>
        <div class="spacing-block" data-gap="subhead-content"></div>
        <p class="decline-body">{{body2}}</p>
      </div>
    </div>
  </div>
  <div class="footer-dock">
    <div class="spacing-block" data-gap="content-footer"></div>
    <button class="input-cta input-cta--decline" type="button">{{ctaLabel}}</button>
    <div class="spacing-block" data-gap="trust-bottom"></div>
  </div>
</div>
